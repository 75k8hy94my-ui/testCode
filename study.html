const VALID_VIEWS=['home','subjects','arguments','past-questions','review','progress','definitions','definition-editor','quiz','quiz-session'];const TOP_LEVEL_VIEWS=['home','subjects','arguments','past-questions','review'];const CONTEXT_TITLES={progress:'進捗',definitions:'定義','definition-editor':'定義を編集',quiz:'定義クイズ'};const PARENT_VIEWS={progress:'home',definitions:'home','definition-editor':'definitions',quiz:'home'};const $=id=>document.getElementById(id),all=q=>[...document.querySelectorAll(q)];const dock=$('studyBottomNav'),contextNav=$('studyContextNav'),contextNavTitle=$('contextNavTitle');let studyState=StudyData.load(),editingId=null,analysisDraft={memoryUnits:[],clozeCandidates:[]},quizSession=null,currentQuestion=null,currentDefinition=null,selectedChoice=null,orderSelection=[],feedbackShown=false;const studySync=StudySync.createController({vault:MangaVault,payloadApi:MangaVaultPayload,storage:localStorage,reduceFinalAttempt:StudyQuiz.reduceFinalAttempt});studySync.markBase();
function route(view,push=true,extra={}){const normalized=VALID_VIEWS.includes(view)?view:'home',url=new URL(location.href);if(normalized==='home')url.searchParams.delete('view');else url.searchParams.set('view',normalized);for(const[k,v]of Object.entries(extra))v==null?url.searchParams.delete(k):url.searchParams.set(k,v);if(push)history.pushState({view:normalized},'',url);else history.replaceState({view:normalized},'',url);renderRoute(normalized)}function currentView(){const url=new URL(location.href),view=url.searchParams.get('view')||'home';return VALID_VIEWS.includes(view)?view:'home'}function renderRoute(view){all('.studyView').forEach(el=>el.hidden=el.dataset.studyView!==view);const topLevel=TOP_LEVEL_VIEWS.includes(view);dock.hidden = !topLevel;contextNav.hidden = topLevel || view==='quiz-session';contextNavTitle.textContent=CONTEXT_TITLES[view]||'';document.body.classList.toggle('top-level-nav',topLevel);document.body.classList.toggle('secondary-surface',!topLevel&&view!=='quiz-session');document.body.classList.toggle('quiz-active',view==='quiz-session');all('.studyNavBtn').forEach(b=>b.setAttribute('aria-current',b.dataset.route===view?'page':'false'));if(view==='definitions')renderDefinitions();if(view==='definition-editor')loadEditor();if(view==='quiz')renderQuizLauncher();if(view==='progress')renderProgress();const h=document.querySelector(`[data-study-view="${view}"] h1`);h&&h.focus({preventScroll:true})}all('[data-route]').forEach(b=>b.addEventListener('click',()=>route(b.dataset.route)));$('contextBackBtn').onclick=()=>route(PARENT_VIEWS[currentView()]||'home');addEventListener('popstate',()=>renderRoute(currentView()));if(currentView()!==new URL(location.href).searchParams.get('view')&&currentView()==='home')route('home',false);else renderRoute(currentView());
function subjects(){return studyState.subjects||[]}function genres(subjectId){return(studyState.genres||[]).filter(g=>!subjectId||g.subjectId===subjectId)}function subjectName(id){return subjects().find(s=>s.id===id)?.name||''}function genreName(id){return(studyState.genres||[]).find(g=>g.id===id)?.name||''}function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fillSelect(el,items,includeAll=false){const old=el.value;el.innerHTML=(includeAll?'<option value="">すべて</option>':'')+items.map(x=>`<option value="${escapeHtml(x.id)}">${escapeHtml(x.name)}</option>`).join('');if([...el.options].some(o=>o.value===old))el.value=old}$('subjectCards').innerHTML=subjects().map(s=>`<div class="card">${escapeHtml(s.name)}</div>`).join('');
function renderDefinitions(){fillSelect($('definitionFilterSubject'),subjects(),true);const sub=$('definitionFilterSubject').value;fillSelect($('definitionFilterGenre'),genres(sub),true);const genre=$('definitionFilterGenre').value,defs=(studyState.definitions||[]).filter(d=>(!sub||d.subjectId===sub)&&(!genre||d.genreId===genre));$('definitionList').innerHTML=defs.length?defs.map(d=>`<div class="card definitionItem"><div><strong>${escapeHtml(d.title)}</strong><small>${escapeHtml(subjectName(d.subjectId))}${d.genreId?' · '+escapeHtml(genreName(d.genreId)):''}</small></div><button class="btn btnSoft" data-edit-definition="${escapeHtml(d.id)}">編集</button></div>`).join(''):'<div class="card status">まだ定義がありません。</div>';all('[data-edit-definition]').forEach(b=>b.onclick=()=>route('definition-editor',true,{definitionId:b.dataset.editDefinition}))}$('definitionFilterSubject').onchange=renderDefinitions;$('definitionFilterGenre').onchange=renderDefinitions;$('addDefinitionBtn').onclick=()=>route('definition-editor',true,{definitionId:null});
function loadEditor(){fillSelect($('definitionSubject'),subjects());const id=new URL(location.href).searchParams.get('definitionId');editingId=id||null;const d=(studyState.definitions||[]).find(x=>x.id===id),heading=d?'定義を編集':'定義を追加';$('definitionEditorHeading').textContent=heading;contextNavTitle.textContent=heading;$('deleteDefinitionBtn').hidden=!d;$('definitionSubject').value=d?.subjectId||subjects()[0]?.id||'';$('definitionGenre').value=d?genreName(d.genreId):'';$('definitionTitle').value=d?.title||'';$('definitionModelText').value=d?.modelText||'';$('definitionTitlePronunciation').value=d?.pronunciation?.title||'';$('definitionModelPronunciation').value=d?.pronunciation?.modelText||'';analysisDraft={memoryUnits:structuredClone(d?.memoryUnits||[]),clozeCandidates:structuredClone(d?.clozeCandidates||[])};renderStructure();refreshGenreDatalist()}function refreshGenreDatalist(){const sub=$('definitionSubject').value;$('genreSuggestions').innerHTML=genres(sub).map(g=>`<option value="${escapeHtml(g.name)}">`).join('')}$('definitionSubject').onchange=refreshGenreDatalist;
function renderStructure(){$('memoryUnitsEditor').innerHTML=analysisDraft.memoryUnits.map((u,i)=>`<div class="memoryUnit" data-unit-index="${i}"><input class="unitText" type="text" value="${escapeHtml(u.text)}"><label><input class="unitRequired" type="checkbox" ${u.required!==false?'checked':''}> 必須</label><input class="unitImportant" type="text" value="${escapeHtml((u.importantTerms||[]).join(' / '))}" placeholder="重要語句"><input class="unitVariants" type="text" value="${escapeHtml((u.acceptedVariants||[]).join(' / '))}" placeholder="許容表現"></div>`).join('');$('clozeEditor').innerHTML=analysisDraft.clozeCandidates.map((c,i)=>`<div class="memoryUnit" data-cloze-index="${i}"><span class="chip">${escapeHtml(c.unitId)}</span><input class="clozeTerms" type="text" value="${escapeHtml((c.terms||[]).join(' / '))}"></div>`).join('')}function pullStructure(){all('[data-unit-index]').forEach(el=>{const i=+el.dataset.unitIndex,u=analysisDraft.memoryUnits[i];u.text=el.querySelector('.unitText').value.trim();u.required=el.querySelector('.unitRequired').checked;u.importantTerms=el.querySelector('.unitImportant').value.split('/').map(x=>x.trim()).filter(Boolean);u.acceptedVariants=el.querySelector('.unitVariants').value.split('/').map(x=>x.trim()).filter(Boolean)});all('[data-cloze-index]').forEach(el=>{const i=+el.dataset.clozeIndex;analysisDraft.clozeCandidates[i].terms=el.querySelector('.clozeTerms').value.split('/').map(x=>x.trim()).filter(Boolean)})}
async function analyze(readingsOnly=false){const status=$('analysisStatus'),input={subject:subjectName($('definitionSubject').value),genre:$('definitionGenre').value.trim(),title:$('definitionTitle').value.trim(),modelText:$('definitionModelText').value.trim()};if(!input.title||!input.modelText){status.textContent='定義名と模範定義を入力してください。';return}status.textContent='AIで整理中…';try{const r=await StudyAI.analyzeDefinition(input);$('definitionTitlePronunciation').value=r.titlePronunciation;$('definitionModelPronunciation').value=r.modelTextPronunciation;if(!readingsOnly){analysisDraft={memoryUnits:r.memoryUnits,clozeCandidates:r.clozeCandidates};renderStructure();if(!$('definitionGenre').value.trim()&&r.genreSuggestions[0])$('definitionGenre').value=r.genreSuggestions[0];$('genreSuggestions').innerHTML=r.genreSuggestions.map(x=>`<option value="${escapeHtml(x)}">`).join('')}status.textContent=''}catch(e){status.textContent=e.code==='network'||e.code==='timeout'?'接続できませんでした。':'AI整理に失敗しました。'}}$('analyzeDefinitionBtn').onclick=()=>analyze(false);$('regenerateReadingBtn').onclick=()=>analyze(true);
function queueAndSave(op,apply=true){if(apply)studyState=StudySync.applyOperation(studyState,op);studyState=StudySync.queueOperation(studyState,op);StudyData.save(studyState);studySync.syncNow().catch(()=>{})}$('saveDefinitionBtn').onclick=()=>{pullStructure();const subjectId=$('definitionSubject').value,genreText=$('definitionGenre').value.trim(),title=$('definitionTitle').value.trim(),modelText=$('definitionModelText').value.trim();if(!subjectId||!genreText||!title||!modelText){$('analysisStatus').textContent='科目・ジャンル・定義名・模範定義を入力してください。';return}let genre=genres(subjectId).find(g=>g.name===genreText);if(!genre){genre={id:StudyData.createId(),subjectId,name:genreText};queueAndSave(StudySync.createOperation('genre.upserted',{genre}))}const old=(studyState.definitions||[]).find(d=>d.id===editingId),definition={id:old?.id||StudyData.createId(),subjectId,genreId:genre.id,title,modelText,pronunciation:{title:$('definitionTitlePronunciation').value.trim(),modelText:$('definitionModelPronunciation').value.trim()},memoryUnits:structuredClone(analysisDraft.memoryUnits),clozeCandidates:structuredClone(analysisDraft.clozeCandidates),createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString(),contentRevision:(old?.contentRevision||0)+1};queueAndSave(StudySync.createOperation('definition.upserted',{definition}));route('definitions')};$('deleteDefinitionBtn').onclick=()=>{if(!editingId)return;queueAndSave(StudySync.createOperation('definition.deleted',{definitionId:editingId}));route('definitions')};
function renderQuizLauncher(){fillSelect($('quizScopeSubject'),subjects(),true);renderScopeGenres();$('autoSpeakToggle').checked=!!studyState.preferences.autoSpeak}function renderScopeGenres(){const sub=$('quizScopeSubject').value;fillSelect($('quizScopeGenres'),genres(sub))}$('quizScopeSubject').onchange=renderScopeGenres;$('autoSpeakToggle').onchange=()=>queueAndSave(StudySync.createOperation('preference.changed',{autoSpeak:$('autoSpeakToggle').checked}));$('startAutoQuiz').onclick=()=>startQuiz({mode:'all'});$('startScopedQuiz').onclick=()=>{const subjectId=$('quizScopeSubject').value;if(!subjectId){startQuiz({mode:'all'});return}startQuiz({mode:'scope',subjectId,genreIds:[...$('quizScopeGenres').selectedOptions].map(o=>o.value)})};
function startQuiz(scope){if(!StudyQuiz.filterDefinitions(studyState,scope).length){alert('この範囲に定義がありません。');return}quizSession=StudyQuiz.createSession(studyState,scope,Date.now());route('quiz-session');showNextQuestion();flushPending();studySync.syncNow().catch(()=>{})}function showNextQuestion(){feedbackShown=false;selectedChoice=null;orderSelection=[];$('quizFeedback').hidden=true;$('nextQuizBtn').hidden=true;$('quizActions').hidden=false;$('quizCheckpoint').hidden=true;$('quizNormal').hidden=false;currentQuestion=StudyQuiz.nextQuestion(studyState,quizSession,Date.now());if(!currentQuestion){route('quiz');return}currentDefinition=studyState.definitions.find(d=>d.id===currentQuestion.definitionId);$('quizTitle').textContent=currentDefinition.title;$('quizPrompt').textContent=currentQuestion.prompt===currentDefinition.title?'':currentQuestion.prompt;$('quizProgressBar').style.width=`${(quizSession.answeredCount%10)*10}%`;renderAnswerControl();if(studyState.preferences.autoSpeak)StudyAudio.speakDefinition(currentDefinition,'title')}
function renderAnswerControl(){const root=$('quizInputArea');if(['full','hinted','cloze'].includes(currentQuestion.kind))root.innerHTML='<textarea id="quizTextAnswer" class="quizAnswer" autocomplete="off" spellcheck="false" placeholder="ここに回答"></textarea>';else{root.innerHTML=`<div class="choiceGrid">${currentQuestion.options.map((o,i)=>`<button class="choiceBtn" data-choice="${i}">${escapeHtml(o)}</button>`).join('')}</div>`;all('[data-choice]').forEach(b=>b.onclick=()=>{if(currentQuestion.kind==='order'){orderSelection.push(+b.dataset.choice);b.disabled=true;b.classList.add('selected')}else{selectedChoice=+b.dataset.choice;all('[data-choice]').forEach(x=>x.classList.toggle('selected',x===b))}})}$('giveUpBtn').hidden=!['full','hinted'].includes(currentQuestion.kind)}function localGrade(){const target=currentQuestion.targetUnitIds[0],unit=(currentDefinition.memoryUnits||[]).find(u=>u.id===target);if(currentQuestion.kind==='cloze'){const answer=$('quizTextAnswer').value.trim(),accepted=[...(unit?.importantTerms||[]),...(unit?.acceptedVariants||[])].map(x=>x.trim()),ok=accepted.some(x=>x===answer);return{result:ok?'correct':'wrong',recalledUnitIds:ok&&target?[target]:[],missingUnitIds:ok?[]:[target].filter(Boolean),wrongUnitIds:ok?[]:[target].filter(Boolean),confusions:[],feedback:'',confidence:'high'}}if(currentQuestion.kind==='choice'){const chosen=currentQuestion.options[selectedChoice],ok=unit&&chosen===unit.text;return{result:ok?'correct':'wrong',recalledUnitIds:ok&&target?[target]:[],missingUnitIds:ok?[]:[target].filter(Boolean),wrongUnitIds:[],confusions:[],feedback:'',confidence:'high'}}const expected=(currentDefinition.memoryUnits||[]).map(u=>u.text),chosen=orderSelection.map(i=>currentQuestion.options[i]),ok=JSON.stringify(expected)===JSON.stringify(chosen);return{result:ok?'correct':'wrong',recalledUnitIds:ok?(currentDefinition.memoryUnits||[]).map(u=>u.id):[],missingUnitIds:ok?[]:(currentDefinition.memoryUnits||[]).map(u=>u.id),wrongUnitIds:[],confusions:[],feedback:'',confidence:'high'}}
function getDeviceId(){let id=localStorage.getItem('studyDeviceId');if(!id){id=StudyData.createId();localStorage.setItem('studyDeviceId',id)}return id}function gradingContext(){return{modelText:currentDefinition.modelText,memoryUnits:structuredClone(currentDefinition.memoryUnits||[]),importantTerms:(currentDefinition.memoryUnits||[]).flatMap(u=>u.importantTerms||[]),acceptedVariants:(currentDefinition.memoryUnits||[]).flatMap(u=>u.acceptedVariants||[])}}function makeAttempt(grading,answerText='',pendingContext=null){return{id:StudyData.createId(),definitionId:currentDefinition.id,definitionRevision:currentDefinition.contentRevision||1,occurredAt:new Date().toISOString(),localStudyDate:new Date().toLocaleDateString('sv-SE'),sequence:quizSession.answeredCount+1,deviceId:getDeviceId(),questionKind:currentQuestion.kind,stageAtAttempt:currentQuestion.stage,answerText,gradingContext:pendingContext,grading}}
async function submitAnswer(){if(feedbackShown)return;let attempt;const answer=$('quizTextAnswer')?.value?.trim()||'';if(['full','hinted'].includes(currentQuestion.kind)){if(!answer)return;try{const grade=await StudyAI.gradeAnswer({definition:currentDefinition,answerText:answer});attempt=makeAttempt({status:'final',...grade,source:'ai'},answer)}catch(e){if(!['network','timeout'].includes(e.code))return showCompactFeedback(null,'採点できませんでした。');attempt=makeAttempt({status:'pending',result:null,source:'pending'},answer,gradingContext());studyState.recentAttempts.push(attempt);studyState=StudyOffline.enqueuePending(studyState,attempt.id);studyState=StudySync.queueOperation(studyState,StudySync.createOperation('attempt.upserted',{attempt}));const outcome=StudyQuiz.applyOutcome(studyState,quizSession,attempt,Date.now());studyState=outcome.study;quizSession=outcome.session;StudyData.save(studyState);showCompactFeedback(attempt,'採点待ち');return}}else attempt=makeAttempt({status:'final',...localGrade(),source:'local'},answer);finishFinalAttempt(attempt)}function finishFinalAttempt(attempt){studyState.recentAttempts.push(attempt);const outcome=StudyQuiz.applyOutcome(studyState,quizSession,attempt,Date.now());studyState=outcome.study;quizSession=outcome.session;studyState=StudySync.queueOperation(studyState,StudySync.createOperation('attempt.upserted',{attempt}));StudyData.save(studyState);showCompactFeedback(attempt);if(quizSession.answeredCount%10===0)setTimeout(showCheckpoint,0)}function giveUp(){const required=(currentDefinition.memoryUnits||[]).filter(u=>u.required!==false).map(u=>u.id);finishFinalAttempt(makeAttempt({status:'final',result:'gave-up',recalledUnitIds:[],missingUnitIds:required,wrongUnitIds:[],confusions:[],feedback:'',confidence:'high',source:'local'}))}
function showCompactFeedback(attempt,label){feedbackShown=true;const g=attempt?.grading,root=$('quizFeedback'),gaveUp=g?.result==='gave-up';root.hidden=false;const title=label||(g?.result==='correct'?'できました':g?.result==='almost'?'惜しい':gaveUp?'答えを確認':'確認');let terms=[];if(g&&!gaveUp)terms=[...(g.missingUnitIds||[]),...(g.wrongUnitIds||[])].map(id=>(currentDefinition.memoryUnits||[]).find(u=>u.id===id)).filter(Boolean).flatMap(u=>u.importantTerms?.length?u.importantTerms:[u.text]);root.className='feedback';root.innerHTML=`<strong>${escapeHtml(title)}</strong>${terms.length?`<div class="feedbackTerms">${[...new Set(terms)].map(t=>`<span class="chip">${escapeHtml(t)}</span>`).join('')}</div>`:''}<div class="feedbackModelLabel">模範</div><div class="feedbackModel">${escapeHtml(currentDefinition.modelText)}</div>${gaveUp?'<div class="retryNote">あとでもう一度出ます</div>':''}`;$('quizActions').hidden=true;$('nextQuizBtn').hidden=false;StudyAudio.speakDefinition(currentDefinition,'modelText')}$('submitQuizBtn').onclick=submitAnswer;$('giveUpBtn').onclick=giveUp;$('nextQuizBtn').onclick=()=>quizSession.answeredCount%10===0?showCheckpoint():showNextQuestion();$('quizSpeakerBtn').onclick=()=>StudyAudio.speakDefinition(currentDefinition,feedbackShown?'modelText':'title');$('quitQuizBtn').onclick=()=>{studySync.syncNow().catch(()=>{});route('quiz')};
function showCheckpoint(){$('quizNormal').hidden=true;$('quizCheckpoint').hidden=false;const model=StudyQuiz.buildCheckpoint(studyState,quizSession),root=$('checkpointCapabilities');root.innerHTML='';for(const c of model.capabilities)root.insertAdjacentHTML('beforeend',`<div class="capability"><strong>この問題が答えられるようになっています</strong><div>${escapeHtml(c.title)}</div></div>`);for(const i of model.improvements)root.insertAdjacentHTML('beforeend',`<div class="capability"><strong>前より思い出せています</strong><div>${escapeHtml(i.terms.join('・'))}</div></div>`);if(!root.children.length)root.innerHTML='<div class="capability">続けてみよう</div>';$('checkpointXp').textContent=model.xpGained?`+${model.xpGained} XP`:'';studySync.syncNow().catch(()=>{})}$('continueQuizBtn').onclick=()=>{quizSession.checkpointStartProgress=structuredClone(studyState.progress);quizSession.checkpointStartXp=studyState.gamification.xp;showNextQuestion()};$('endQuizBtn').onclick=()=>{studySync.syncNow().catch(()=>{});route('quiz')};
async function flushPending(){if(!studyState.pendingGradings.length)return;const result=await StudyOffline.flushPending(studyState,{gradeAttempt:a=>StudyAI.gradeAnswer({gradingContext:a.gradingContext,answerText:a.answerText}),finalizeAttempt:StudyQuiz.reduceFinalAttempt});studyState=result.study;StudyData.save(studyState);studySync.syncNow().catch(()=>{})}addEventListener('online',()=>flushPending());document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')studySync.syncNow().catch(()=>{})});function renderProgress(){$('progressSummary').innerHTML=`<strong>${(studyState.definitions||[]).length} 定義</strong><div class="status">${studyState.gamification.streak?`🔥 ${studyState.gamification.streak}日`:''} ${studyState.gamification.xp||0} XP</div>`}
})();
</script>
