<!doctype html>
<html lang="ja" class="auth-pending">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>判例百選</title>
<link rel="icon" type="image/png" href="icon-152.png">
<style>
html.auth-pending body{visibility:hidden}:root{color-scheme:light;--bg:#f4f6f8;--surface:#fff;--text:#202124;--sub:#6b7280;--line:#dfe3e8;--accent:#1769aa;--ok:#087443;--warn:#9a6700}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}button,input,select{font:inherit}.pageHeader{position:fixed;z-index:900;top:0;left:0;right:0;height:54px;display:flex;align-items:center;padding:0 18px 0 74px;background:#1769aa;color:#fff;border-bottom:1px solid rgba(0,0,0,.08)}.pageHeader h1{margin:0;font-size:18px;font-weight:650}.shell{margin-left:58px;padding:78px 24px 40px;max-width:none}.intro{margin:0 0 16px;color:var(--sub);font-size:13px}.glass{padding:18px;border:1px solid var(--line);border-radius:6px;background:var(--surface);margin-bottom:18px}.controls{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px;margin-bottom:14px}.driveRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}label{display:grid;gap:7px;color:var(--sub);font-size:12px;font-weight:650}input,select{width:100%;min-height:40px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--text);padding:8px 10px;outline:none}input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(23,105,170,.12)}.glassBtn{min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--text);cursor:pointer}.glassBtn:disabled{opacity:.45;cursor:not-allowed}.helper{margin:12px 0 0;color:var(--sub);font-size:12px;line-height:1.6}.status{margin-top:10px;min-height:20px;font-size:13px;color:var(--sub)}.status[data-tone="ok"]{color:var(--ok)}.status[data-tone="warn"]{color:var(--warn)}.listHeader{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:20px 2px 10px}.listHeader h2{margin:0;font-size:18px}.listHeader span{color:var(--sub);font-size:12px}#hyakusenList{display:grid;gap:8px}.hyakusenRow{width:100%;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:13px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:5px;padding:13px 14px;background:#fff;color:inherit;box-shadow:none}.hyakusenNumber{font-size:19px;font-weight:700}.hyakusenCitation{font-size:14px;line-height:1.5}.hyakusenFile{font-size:11px;color:var(--sub);word-break:break-all;text-align:right}button.hyakusenRow{cursor:pointer}.hyakusenRow[data-drive-state="missing"],.hyakusenRow[data-drive-state="unverified"]{opacity:.48;cursor:default}.hyakusenRow[data-drive-state="available"]{border-color:#9bcab2}.hyakusenRow[data-drive-state="available"] .hyakusenFile{color:var(--ok)}.empty{padding:34px 20px;text-align:center;border:1px dashed var(--line);border-radius:5px;color:var(--sub)}
@media(min-width:900px){html.app-desktop-rail-page body{padding-left:0!important}html.app-desktop-rail-page body>main{width:auto!important;max-width:none!important;margin-left:58px!important;margin-right:0!important}#appDesktopRail,#desktopReaderNav{position:fixed!important;z-index:950!important;left:0!important;top:54px!important;bottom:0!important;transform:none!important;width:58px!important;max-height:none!important;overflow-y:auto!important;display:flex!important;flex-direction:column!important;gap:2px!important;padding:8px 6px!important;border:0!important;border-right:1px solid var(--line)!important;border-radius:0!important;background:#fff!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}.appDesktopRailItem{min-height:44px!important;height:44px!important;padding:0!important;border:0!important;border-radius:4px!important;display:flex!important;align-items:center!important;justify-content:center!important;background:transparent!important;color:#555!important;box-shadow:none!important}.appDesktopRailItem svg{width:20px!important;height:20px!important;flex:0 0 20px!important}.appDesktopRailItem span{display:none!important}.appDesktopRailItem.active,.appDesktopRailItem[aria-current="page"]{color:var(--accent)!important;background:#e9f2fb!important;border:0!important;box-shadow:none!important}}
@media(max-width:899px){.pageHeader{position:static;height:auto;padding:18px;background:#fff;color:var(--text)}.shell{margin-left:0;padding:24px 18px 40px}.controls,.driveRow{grid-template-columns:1fr}.hyakusenRow{grid-template-columns:48px minmax(0,1fr)}.hyakusenFile{grid-column:2;text-align:left}}
</style>
</head>
<body>
<header class="pageHeader"><h1>判例百選</h1></header>
<main class="shell">
<p class="intro">収録判例と、Google Driveに保存した注釈PDFを対応表示します。</p>
<section class="glass" aria-label="判例百選の選択">
<div class="controls"><label>判例百選<select id="collectionSelect" aria-label="判例百選"></select></label><label>版<select id="editionSelect" aria-label="版"></select></label></div>
<div class="driveRow"><label>Google OAuth Client ID<input id="googleClientId" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="xxxxxxxx.apps.googleusercontent.com"></label><button id="connectDriveBtn" class="glassBtn" type="button">Google Driveに接続</button></div>
<p class="helper">Drive本文は取得しません。読み取り専用のメタデータ権限で、百選PDFのファイル名が完全一致するかだけを確認します。OAuth Client IDだけ端末に保存し、Driveのアクセストークンはページ内メモリにのみ保持します。</p>
<div id="driveStatus" class="status" role="status" aria-live="polite"></div>
</section>
<div class="listHeader"><h2 id="listTitle">収録判例</h2><span id="listSummary"></span></div>
<section id="hyakusenList" aria-live="polite"><div class="empty">百選データ未登録</div></section>
</main>
<script src="app-desktop-rail.js"></script>
<script src="supabase-config.js"></script>
<script src="vault-session.js"></script>
<script src="profile-menu.js?v=20260911-shared-route"></script>
<script src="hyakusen-catalog.js"></script>
<script src="hyakusen-drive.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="hyakusen-page.js"></script>
</body>
</html>
