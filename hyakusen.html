<!doctype html>
<html lang="ja" class="auth-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>判例百選 | testCode</title>
  <link rel="stylesheet" href="liquid-glass.css">
  <style>
    :root{
      color-scheme:dark;
      --bg:#0b0d10;--panel:rgba(24,28,34,.72);--panel-strong:rgba(30,35,42,.9);--text:#f5f7fa;
      --muted:#9aa4b2;--line:rgba(255,255,255,.12);--accent:#89b4ff;--ok:#7fe0a0;--warn:#f2c66d;
      --shadow:0 18px 50px rgba(0,0,0,.28);--radius:22px;
    }
    html[data-theme="light"]{color-scheme:light;--bg:#eef1f6;--panel:rgba(255,255,255,.72);--panel-strong:rgba(255,255,255,.92);--text:#16191f;--muted:#626c79;--line:rgba(20,28,40,.12);--accent:#285fba;--ok:#187a3d;--warn:#945f00;--shadow:0 18px 50px rgba(44,54,70,.14)}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% -10%,rgba(94,142,225,.16),transparent 34rem),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
    html.auth-pending body{visibility:hidden}
    body{padding:28px 20px 70px}
    a{color:inherit}
    button,input,select{font:inherit;color:inherit}
    .shell{width:min(920px,100%);margin:0 auto}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
    .topbarActions{display:grid;gap:8px;justify-items:end}.topActions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.topActionCurrent{cursor:default;color:var(--accent);border-color:color-mix(in srgb,var(--accent) 34%,var(--line))}.shell .topActionCurrent:hover{transform:none}.topActionCurrent:active{transform:none}
    .titleBlock h1{font-size:clamp(26px,4vw,38px);letter-spacing:-.035em;margin:0}.titleBlock p{margin:7px 0 0;color:var(--muted);font-size:14px}
    .glass,.glassBtn,.hyakusenRow{border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(22px) saturate(135%);-webkit-backdrop-filter:blur(22px) saturate(135%)}
    .glass{border-radius:var(--radius);padding:18px;margin-bottom:16px}
    .glassBtn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 14px;border-radius:14px;text-decoration:none;cursor:pointer}
    .glassBtn:disabled{opacity:.45;cursor:not-allowed}
    .controls{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px;margin-bottom:14px}
    label{display:grid;gap:7px;color:var(--muted);font-size:12px;font-weight:650}
    input,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:13px;background:rgba(0,0,0,.13);padding:9px 11px;outline:none}
    html[data-theme="light"] input,html[data-theme="light"] select{background:rgba(255,255,255,.62)}
    input:focus,select:focus{border-color:color-mix(in srgb,var(--accent) 70%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
    .driveRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}
    .helper{margin:12px 0 0;color:var(--muted);font-size:12px;line-height:1.65}.status{margin-top:10px;min-height:20px;font-size:13px;color:var(--muted)}.status[data-tone="ok"]{color:var(--ok)}.status[data-tone="warn"]{color:var(--warn)}
    .listHeader{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:22px 2px 10px}.listHeader h2{margin:0;font-size:19px}.listHeader span{color:var(--muted);font-size:12px}
    #hyakusenList{display:grid;gap:9px}
    .hyakusenRow{width:100%;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:13px;align-items:center;text-align:left;border-radius:17px;padding:14px 15px;color:inherit}
    button.hyakusenRow{cursor:pointer}.hyakusenNumber{font-size:20px;font-weight:760;letter-spacing:-.03em}.hyakusenCitation{font-size:14px;line-height:1.55}.hyakusenFile{font-size:11px;color:var(--muted);word-break:break-all;text-align:right}
    .hyakusenRow[data-drive-state="missing"], .hyakusenRow[data-drive-state="unverified"]{opacity:.42;box-shadow:none;cursor:default}
    .hyakusenRow[data-drive-state="available"]{border-color:color-mix(in srgb,var(--ok) 38%,var(--line))}.hyakusenRow[data-drive-state="available"] .hyakusenFile{color:var(--ok)}
    .empty{padding:34px 20px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted);line-height:1.7}
    @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass,.glassBtn,.hyakusenRow{background:var(--panel-strong)}}
    @media(max-width:700px){body{padding:18px 12px 50px}.topbar{align-items:flex-start;flex-direction:column}.topbarActions{width:100%;justify-items:stretch}.topActions{justify-content:flex-start}.topActions .glassBtn{flex:1}.controls,.driveRow{grid-template-columns:1fr}.hyakusenRow{grid-template-columns:48px minmax(0,1fr);padding:13px}.hyakusenFile{grid-column:2;text-align:left}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="titleBlock">
        <h1>判例百選</h1>
        <p>収録判例と、Google Driveに保存した注釈PDFを対応表示します。</p>
      </div>
      <div class="topbarActions">
        <nav class="topActions" aria-label="主要ページ">
          <a class="glassBtn" href="home.html">ホーム</a>
          <a class="glassBtn" href="index-search.html">索引検索</a>
          <span class="glassBtn topActionCurrent" aria-current="page">判例百選</span>
        </nav>
      </div>
    </header>

    <section class="glass" aria-label="判例百選の選択">
      <div class="controls">
        <label>判例百選
          <select id="collectionSelect" aria-label="判例百選"></select>
        </label>
        <label>版
          <select id="editionSelect" aria-label="版"></select>
        </label>
      </div>
      <div class="driveRow">
        <label>Google OAuth Client ID
          <input id="googleClientId" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="xxxxxxxx.apps.googleusercontent.com">
        </label>
        <button id="connectDriveBtn" class="glassBtn" type="button">Google Driveに接続</button>
      </div>
      <p class="helper">Drive本文は取得しません。読み取り専用のメタデータ権限で、百選PDFのファイル名が完全一致するかだけを確認します。OAuth Client IDだけ端末に保存し、Driveのアクセストークンはページ内メモリにのみ保持します。</p>
      <div id="driveStatus" class="status" role="status" aria-live="polite"></div>
    </section>

    <div class="listHeader">
      <h2 id="listTitle">収録判例</h2>
      <span id="listSummary"></span>
    </div>
    <section id="hyakusenList" aria-live="polite">
      <div class="empty">百選データ未登録</div>
    </section>
  </main>

  <script src="app-desktop-rail.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="vault-session.js"></script>
  <script src="hyakusen-catalog.js"></script>
  <script src="hyakusen-drive.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="hyakusen-page.js"></script>
</body>
</html>
