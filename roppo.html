<body><main class="shell">
<header class="header"><div><span class="eyebrow">LAW</span><h1>六法</h1></div><nav class="topActions" aria-label="主要ページ"><a class="glassBtn" href="home.html">ホーム</a><span class="glassBtn current" aria-current="page">六法</span><a class="glassBtn" href="index-search.html">索引検索</a><a class="glassBtn" href="hyakusen.html">判例百選</a><a class="glassBtn" href="sync.html">保管庫</a></nav></header>
<p id="roppoSyncStatus" class="syncLine" aria-live="polite"></p>
<div class="layout"><aside class="panel controls"><div class="controlBlock"><label class="label" for="groupSelect">分野</label><select id="groupSelect" class="field"></select></div><div class="controlBlock"><label class="label" for="lawSelect">法令</label><select id="lawSelect" class="field"></select></div><div class="controlBlock"><label class="label" for="roppoSearch">条番号・見出し・本文検索</label><input id="roppoSearch" class="field" type="search" autocomplete="off" placeholder="例: 90 / 錯誤 / 公序良俗"></div><div id="resultsMeta" class="resultsMeta"></div><div id="articleList" class="articleList"></div></aside>
<section class="panel detail" aria-live="polite"><div id="loadingState" class="state"><strong>法令を読み込み中</strong><span>GitHub内の保存済み条文データを読み込んでいます。</span></div><div id="errorState" class="state" hidden><strong>保存済み条文を読み込めませんでした</strong><span id="errorText"></span></div><div id="emptyState" class="state" hidden><strong>該当する条文がありません</strong><span>検索語を変えてください。</span></div><div id="articleDetail" hidden><div class="detailHead"><div><p id="lawName" class="lawName"></p><h2 id="articleTitle" class="articleTitle"></h2><span id="articleCaption" class="caption"></span></div><button id="favoriteBtn" class="glassBtn favBtn" type="button" aria-label="お気に入り">☆</button></div><div id="paragraphs" class="paragraphs"></div><div class="navRow"><button id="prevArticle" class="glassBtn" type="button">← 前の条文</button><button id="nextArticle" class="glassBtn" type="button">次の条文 →</button></div></div></section></div></main>

<script>(()=>{'use strict';
const config=window.MANGA_READER_SUPABASE||{};const showLogin=()=>location.replace('index.html');const showVault=()=>location.replace('sync.html');const session=window.MangaVault&&MangaVault.loadSession();if(!session||!session.refresh_token||!config.url||!config.publishableKey){showLogin();return}if(!MangaVault.loadActive()){showVault();return}MangaVault.refreshSession().then(()=>document.documentElement.classList.remove('auth-pending')).catch(()=>{MangaVault.saveSession(null);showLogin()});
const R=window.MangaRoppo,$=(id)=>document.getElementById(id);const ui={group:$('groupSelect'),law:$('lawSelect'),search:$('roppoSearch'),list:$('articleList'),meta:$('resultsMeta'),loading:$('loadingState'),error:$('errorState'),errorText:$('errorText'),empty:$('emptyState'),detail:$('articleDetail'),lawName:$('lawName'),title:$('articleTitle'),caption:$('articleCaption'),paras:$('paragraphs'),fav:$('favoriteBtn'),prev:$('prevArticle'),next:$('nextArticle'),sync:$('roppoSyncStatus')};let state=R.loadState(),articles=[],visibleArticles=[],currentIndex=-1,currentArticleKey='',loadToken=0,syncTimer=null,syncing=false,syncQueued=false,metadata=null;
try{const theme=localStorage.getItem('mangaReaderTheme');document.documentElement.dataset.theme=theme==='light'?'light':'dark'}catch(_){document.documentElement.dataset.theme='dark'}
function setView(name){ui.loading.hidden=name!=='loading';ui.error.hidden=name!=='error';ui.empty.hidden=name!=='empty';ui.detail.hidden=name!=='detail'}function setSync(t){ui.sync.textContent=t||''}function persistLocal(){state=R.saveState(state)}async function syncVault(){if(syncing){syncQueued=true;return}syncing=true;setSync('同期中…');try{await MangaVault.savePayload(MangaVaultPayload.buildFromLocalStorage());setSync('同期済み');setTimeout(()=>{if(ui.sync.textContent==='同期済み')setSync('')},1800)}catch(error){setSync('端末保存済み・同期失敗: '+(error?.message||'エラー'))}finally{syncing=false;if(syncQueued){syncQueued=false;syncVault()}}}function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(syncVault,500)}function commitState(){persistLocal();scheduleSync()}
function lawMeta(){return R.LAW_CATALOG[state.preferences.selectedLawId]}function populateGroups(){ui.group.replaceChildren();R.LAW_GROUPS.forEach(g=>{const o=document.createElement('option');o.value=g.id;o.textContent=g.name;ui.group.append(o)});ui.group.value=state.preferences.selectedGroup;populateLaws()}function populateLaws(){const g=R.LAW_GROUPS.find(x=>x.id===state.preferences.selectedGroup)||R.LAW_GROUPS[0];ui.law.replaceChildren();g.lawIds.forEach(id=>{const law=R.LAW_CATALOG[id],o=document.createElement('option');o.value=id;o.textContent=law.name;ui.law.append(o)});if(!g.lawIds.includes(state.preferences.selectedLawId))state.preferences.selectedLawId=g.lawIds[0];ui.law.value=state.preferences.selectedLawId}
async function loadMetadata(){try{const r=await fetch('data/roppo/metadata.json',{cache:'no-cache'});if(!r.ok)throw new Error();metadata=await r.json()}catch(_){metadata=null}}
async function loadLaw(preferredKey){const token=++loadToken;setView('loading');articles=[];visibleArticles=[];currentIndex=-1;currentArticleKey='';document.body.classList.remove('mobile-searching');ui.list.replaceChildren();ui.meta.textContent='';const meta=lawMeta();try{const version=metadata?.lastSyncedAt?`?v=${encodeURIComponent(metadata.lastSyncedAt)}`:'';const response=await fetch(`data/roppo/${encodeURIComponent(meta.id)}.json${version}`,{cache:'no-cache'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const parsed=await response.json();if(token!==loadToken)return;articles=Array.isArray(parsed.articles)?parsed.articles:[];ui.search.value='';renderResults();const target=preferredKey||state.recent.find(e=>e.lawId===meta.id)?.articleKey;let index=target?visibleArticles.findIndex(x=>x.key===target):-1;if(index<0)index=visibleArticles.length?0:-1;if(index>=0)selectArticle(index);else setView('empty')}catch(error){if(token!==loadToken)return;ui.errorText.textContent='GitHubに保存された法令JSONがまだ生成されていないか、読み込みに失敗しました。';setView('error')}}
function renderResults(){visibleArticles=R.searchArticles(articles,ui.search.value);ui.meta.textContent=`${visibleArticles.length}条`;ui.list.replaceChildren();visibleArticles.forEach((article,index)=>{const b=document.createElement('button');b.type='button';b.className='articleItem'+(article.key===currentArticleKey?' active':'');const strong=document.createElement('strong');strong.textContent=article.number||article.key;b.append(strong);if(article.caption){const s=document.createElement('span');s.textContent=article.caption;b.append(s)}b.addEventListener('click',()=>{if(ui.search.value.trim())openArticleFromSearch(index);else selectArticle(index)});ui.list.append(b)});if(!visibleArticles.length)setView('empty')}
function scrollSelectedArticleIntoView(){requestAnimationFrame(()=>{const active=ui.list.querySelector('.articleItem.active');if(active)active.scrollIntoView({block:'center',inline:'nearest'})})}
function openArticleFromSearch(index){selectArticle(index);document.body.classList.remove('mobile-searching');requestAnimationFrame(()=>ui.detail.scrollIntoView({behavior:'smooth',block:'start'}))}
function markRecent(article){const lawId=state.preferences.selectedLawId;state.recent=[{lawId,articleKey:article.key,viewedAt:new Date().toISOString()},...state.recent.filter(e=>!(e.lawId===lawId&&e.articleKey===article.key))].slice(0,R.MAX_RECENT);commitState()}
function memoFor(lawId,articleKey,paragraphNum){return state.notes[R.paragraphStorageKey(lawId,articleKey,paragraphNum)]?.text||''}
function renderParagraphs(article){ui.paras.replaceChildren();const lawId=state.preferences.selectedLawId;const paragraphs=Array.isArray(article.paragraphs)?article.paragraphs:[];paragraphs.forEach((paragraph,index)=>{const card=document.createElement('section');card.className='paraCard';const body=document.createElement('div');body.className='paraBody';const label=document.createElement('div');label.className='paraLabel';label.textContent=`${paragraph.number||index+1}項`;const text=document.createElement('div');text.className='paraText';text.textContent=R.formatParagraphText(paragraph.text||'');body.append(label,text);const memoWrap=document.createElement('div');memoWrap.className='paraMemo';const head=document.createElement('div');head.className='memoHead';const title=document.createElement('strong');title.textContent=`${paragraph.number||index+1}項のメモ`;const status=document.createElement('span');status.className='saveStatus';const memo=document.createElement('textarea');memo.className='memo';memo.placeholder='この項の要件、趣旨、判例、論証など';memo.value=memoFor(lawId,article.key,paragraph.number||index+1);let timer=null;memo.addEventListener('input',()=>{clearTimeout(timer);status.textContent='保存中…';const key=R.paragraphStorageKey(lawId,article.key,paragraph.number||index+1),value=memo.value;timer=setTimeout(()=>{if(value.trim())state.notes[key]={text:value,updatedAt:new Date().toISOString()};else delete state.notes[key];commitState();status.textContent='保存済み';setTimeout(()=>{if(status.textContent==='保存済み')status.textContent=''},1400)},350)});head.append(title,status);memoWrap.append(head,memo);card.append(body,memoWrap);ui.paras.append(card)})}
function selectArticle(index){if(index<0||index>=visibleArticles.length)return;currentIndex=index;const article=visibleArticles[index],lawId=state.preferences.selectedLawId;currentArticleKey=article.key;ui.lawName.textContent=lawMeta().name;ui.title.textContent=article.number||article.key;ui.caption.textContent=article.caption||'';ui.caption.hidden=!article.caption;renderParagraphs(article);const favKey=R.articleStorageKey(lawId,article.key),on=state.favorites.includes(favKey);ui.fav.textContent=on?'★':'☆';ui.fav.classList.toggle('on',on);ui.fav.onclick=()=>{const exists=state.favorites.includes(favKey);state.favorites=exists?state.favorites.filter(k=>k!==favKey):[favKey,...state.favorites];commitState();selectArticle(currentIndex)};ui.prev.disabled=index===0;ui.next.disabled=index===visibleArticles.length-1;setView('detail');markRecent(article);renderResults()}
ui.group.addEventListener('change',()=>{state.preferences.selectedGroup=ui.group.value;populateLaws();state.preferences.selectedLawId=ui.law.value;commitState();loadLaw()});ui.law.addEventListener('change',()=>{state.preferences.selectedLawId=ui.law.value;commitState();loadLaw()});ui.search.addEventListener('input',()=>{const selectedKey=currentArticleKey;document.body.classList.toggle('mobile-searching',!!ui.search.value.trim());currentIndex=-1;renderResults();if(!visibleArticles.length)return;let nextIndex=selectedKey?visibleArticles.findIndex(article=>article.key===selectedKey):-1;if(nextIndex<0)nextIndex=0;selectArticle(nextIndex);if(!ui.search.value.trim()&&selectedKey)scrollSelectedArticleIntoView()});ui.prev.addEventListener('click',()=>selectArticle(currentIndex-1));ui.next.addEventListener('click',()=>selectArticle(currentIndex+1));
populateGroups();persistLocal();loadMetadata().finally(()=>loadLaw());
})();</script></body></html>
