<!doctype html>
<html lang="ja" class="auth-pending">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>六法</title>
<link rel="icon" type="image/png" href="icon-152.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="stylesheet" href="liquid-glass.css">
<style>
html.auth-pending body{visibility:hidden}:root{color-scheme:light;--bg:#f5f5f7;--surface:rgba(255,255,255,.82);--strong:#fff;--text:#1d1d1f;--sub:#6e6e73;--line:rgba(60,60,67,.16);--accent:#2563eb;--glass:rgba(248,249,252,.74);--glass-border:rgba(255,255,255,.78);--shadow:rgba(38,42,50,.14)}html[data-theme="dark"]{color-scheme:dark;--bg:#0a0c11;--surface:rgba(21,25,35,.82);--strong:#151923;--text:#f1f2f6;--sub:#959cab;--line:rgba(255,255,255,.13);--accent:#7aa2ff;--glass:rgba(25,28,35,.78);--glass-border:rgba(255,255,255,.20);--shadow:rgba(0,0,0,.42)}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;color:var(--text);background:radial-gradient(80% 55% at 0 0,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%),var(--bg);-webkit-font-smoothing:antialiased}button,input,textarea,a{font:inherit}.shell{width:min(100% - 24px,1240px);margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 0 max(48px,env(safe-area-inset-bottom))}.header{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin:0 2px 18px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.14em;color:var(--accent)}h1{margin:5px 0 3px;font-size:clamp(32px,6vw,50px);letter-spacing:-.05em}.sub{margin:0;color:var(--sub);font-size:13px}.topActions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.glassBtn{min-height:42px;border:1px solid var(--glass-border);border-radius:16px;padding:0 13px;background:var(--glass);color:var(--text);font-weight:750;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.34),0 8px 22px var(--shadow);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);cursor:pointer}.current{color:var(--accent);cursor:default}.toolbar{display:grid;gap:12px;margin-bottom:14px}.lawTabs{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 5px;scrollbar-width:none}.lawTabs::-webkit-scrollbar{display:none}.lawTab{flex:0 0 auto;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--sub);font-weight:800;cursor:pointer}.lawTab.active{background:color-mix(in srgb,var(--accent) 13%,var(--strong));color:var(--accent);border-color:color-mix(in srgb,var(--accent) 34%,var(--line))}.searchRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px}.searchWrap{position:relative}.searchWrap input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:17px;background:var(--surface);color:var(--text);padding:0 15px;outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}.searchWrap input:focus{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}.dataMeta{min-height:20px;color:var(--sub);font-size:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.dataMeta a{color:var(--accent);text-decoration:none;font-weight:750}.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,390px);gap:14px;align-items:start}.readerPanel,.notePane{border:1px solid var(--glass-border);border-radius:26px;background:linear-gradient(145deg,color-mix(in srgb,var(--surface) 96%,transparent),color-mix(in srgb,var(--surface) 77%,transparent));box-shadow:0 15px 36px color-mix(in srgb,var(--shadow) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.26);overflow:hidden}.readerPanel{min-height:520px}.readerState{padding:38px 22px;text-align:center;color:var(--sub)}.readerState strong{display:block;color:var(--text);font-size:18px;margin-bottom:7px}.articleList{display:grid}.articleRow{appearance:none;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:16px 18px;text-align:left;cursor:pointer}.articleRow:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}.articleRow.active{background:color-mix(in srgb,var(--accent) 10%,transparent)}.articleRow:last-child{border-bottom:0}.articleRowTitle{display:flex;align-items:baseline;gap:8px;font-weight:850}.articleCaption{color:var(--sub);font-size:12px;margin-top:4px}.articlePreview{color:var(--sub);font-size:12px;line-height:1.55;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.articleDetail{padding:22px}.detailHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}.detailHead h2{margin:0;font-size:25px;letter-spacing:-.03em}.detailCaption{margin:5px 0 0;color:var(--sub);font-size:13px}.articleText{font-size:16px;line-height:1.92;white-space:pre-wrap;overflow-wrap:anywhere}.articleNav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:24px}.articleNav button{min-height:44px;border:1px solid var(--line);border-radius:15px;background:var(--strong);color:var(--text);font-weight:760;cursor:pointer}.articleNav button:disabled{opacity:.35;cursor:default}.backToList{min-height:38px;border:0;background:transparent;color:var(--accent);font-weight:800;cursor:pointer;padding:0}.notePane{position:sticky;top:18px;padding:18px}.noteHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.noteHead h2{margin:0;font-size:18px}.memoContext{margin:0 0 10px;color:var(--sub);font-size:12px}.memo{width:100%;min-height:330px;resize:vertical;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--strong) 88%,transparent);color:var(--text);padding:14px;line-height:1.65;outline:none}.memo:focus{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}.memo:disabled{opacity:.55}.syncStatus{min-height:19px;margin-top:9px;color:var(--sub);font-size:11px;line-height:1.4}.memoClose{display:none;width:36px;height:36px;border:1px solid var(--line);border-radius:999px;background:var(--strong);color:var(--text);font-size:20px;cursor:pointer}.emptyDetail{padding:58px 18px;text-align:center;color:var(--sub)}[hidden]{display:none!important}@media(max-width:780px){.header{display:block}.topActions{justify-content:flex-start;margin-top:14px}.topActions>*{flex:1}.workspace{display:block}.notePane{position:fixed;z-index:1200;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));top:auto;max-height:min(72vh,620px);padding:17px;border-radius:28px;transform:translateY(calc(100% + 24px));transition:transform .22s ease;box-shadow:0 20px 70px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25)}.notePane.open{transform:translateY(0)}.memo{min-height:220px;max-height:46vh}.memoClose{display:inline-grid;place-items:center}.articleDetail{padding:18px}.readerPanel{min-height:460px}.searchRow{grid-template-columns:1fr}.searchRow .glassBtn{width:100%}}@media(prefers-reduced-motion:reduce){.notePane{transition:none}}@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glassBtn,.readerPanel,.notePane{background:var(--strong)}}
</style>
</head>
<body>
<main class="shell">
  <header class="header">
    <div><span class="eyebrow">STATUTES</span><h1>六法</h1><p class="sub">現行条文を端末に保存して閲覧し、条文ごとにメモできます。</p></div>
    <nav class="topActions" aria-label="主要ページ">
      <a class="glassBtn" href="home.html">ホーム</a>
      <a class="glassBtn" href="index-search.html">索引検索</a>
      <a class="glassBtn" href="hyakusen.html">判例百選</a>
      <span class="glassBtn current" aria-current="page">六法</span>
      <a class="glassBtn" href="sync.html">保管庫</a>
    </nav>
  </header>

  <section class="toolbar" aria-label="六法操作">
    <div id="lawTabs" class="lawTabs" role="tablist" aria-label="法令選択"></div>
    <div class="searchRow">
      <label class="searchWrap"><span hidden>条文検索</span><input id="articleSearch" type="search" autocomplete="off" placeholder="条番号・キーワードで検索"></label>
      <button id="refreshLawBtn" class="glassBtn" type="button">法令データを更新</button>
    </div>
    <div id="dataMeta" class="dataMeta" aria-live="polite"></div>
  </section>

  <section class="workspace">
    <section id="readerPanel" class="readerPanel" aria-live="polite">
      <div id="readerState" class="readerState"><strong>法令データを準備しています</strong><span>端末に保存済みのデータがあればそれを使います。</span></div>
      <div id="articleList" class="articleList" hidden></div>
      <article id="articleDetail" class="articleDetail" hidden>
        <div class="detailHead"><div><h2 id="detailTitle"></h2><p id="detailCaption" class="detailCaption"></p></div><button id="backToListBtn" class="backToList" type="button">一覧</button></div>
        <div id="articleText" class="articleText"></div>
        <div class="articleNav"><button id="prevArticleBtn" type="button">← 前条</button><button id="nextArticleBtn" type="button">次条 →</button></div>
      </article>
    </section>

    <aside id="notePane" class="notePane" aria-label="条文メモ">
      <div class="noteHead"><h2>条文メモ</h2><button id="memoCloseBtn" class="memoClose" type="button" aria-label="メモを閉じる">×</button></div>
      <p id="memoContext" class="memoContext">条文を選択してください。</p>
      <textarea id="statuteMemo" class="memo" placeholder="この条文についてのメモ" disabled></textarea>
      <div id="syncStatus" class="syncStatus" aria-live="polite"></div>
    </aside>
  </section>
</main>
<script src="app-desktop-rail.js"></script>
<script src="supabase-config.js"></script>
<script src="vault-session.js?v=20260813-vault-state"></script>
<script src="vault-payload.js"></script>
<script src="statute-data.js"></script>
<script>
(()=>{
'use strict';
const config=window.MANGA_READER_SUPABASE||{};
const showLogin=()=>window.location.replace('index.html');
const showVault=()=>window.location.replace('sync.html');
const session=window.MangaVault&&MangaVault.loadSession();
if(!session||!session.refresh_token||!config.url||!config.publishableKey){showLogin();return;}
if(!MangaVault.loadActive()){showVault();return;}

try{const theme=localStorage.getItem('mangaReaderTheme');document.documentElement.dataset.theme=theme==='light'?'light':'dark';}catch(_){document.documentElement.dataset.theme='dark';}

const $=(id)=>document.getElementById(id);
const ui={tabs:$('lawTabs'),search:$('articleSearch'),refresh:$('refreshLawBtn'),meta:$('dataMeta'),state:$('readerState'),list:$('articleList'),detail:$('articleDetail'),detailTitle:$('detailTitle'),detailCaption:$('detailCaption'),text:$('articleText'),back:$('backToListBtn'),prev:$('prevArticleBtn'),next:$('nextArticleBtn'),pane:$('notePane'),memo:$('statuteMemo'),memoContext:$('memoContext'),memoClose:$('memoCloseBtn'),sync:$('syncStatus')};
const Statutes=window.MangaStatutes;
const NOTES_KEY='mangaReaderStatuteNotes';
let selectedLawId=Statutes.LAW_CATALOG[0].id;
let lawRecord=null;
let filtered=[];
let selectedArticle=null;
let loadToken=0;
let memoTimer=null;
let syncTimer=null;
let syncRunning=false;
let syncDirty=false;

function isMobile(){return window.matchMedia&&window.matchMedia('(max-width:780px)').matches;}
function readNotes(){try{const parsed=JSON.parse(localStorage.getItem(NOTES_KEY)||'{}');return parsed&&typeof parsed==='object'&&!Array.isArray(parsed)?parsed:{};}catch(_){return {};}}
function writeNotes(notes){localStorage.setItem(NOTES_KEY,JSON.stringify(notes));}
function noteKey(){return selectedArticle?selectedLawId+':'+selectedArticle.num:'';}
function setSync(text){ui.sync.textContent=text||'';}
function scheduleCloudSync(){clearTimeout(syncTimer);syncTimer=setTimeout(runCloudSync,900);}
async function runCloudSync(){
  if(syncRunning){syncDirty=true;return;}
  syncRunning=true;setSync('同期中…');
  try{await MangaVault.savePayload(MangaVaultPayload.buildFromLocalStorage());setSync('同期済み');}
  catch(error){setSync('端末保存済み・クラウド同期失敗: '+(error&&error.message?error.message:'失敗'));}
  finally{syncRunning=false;if(syncDirty){syncDirty=false;runCloudSync();}}
}
function commitMemo(){
  if(!selectedArticle)return;
  const key=noteKey();const notes=readNotes();const text=ui.memo.value.replace(/\r\n?/g,'\n');
  if(text.trim())notes[key]=text;else delete notes[key];
  try{writeNotes(notes);setSync('端末に保存済み');scheduleCloudSync();}catch(error){setSync('端末保存に失敗: '+(error&&error.message?error.message:'失敗'));}
}
function loadMemo(){
  clearTimeout(memoTimer);const key=noteKey();const notes=readNotes();
  ui.memo.disabled=!selectedArticle;ui.memo.value=key?(notes[key]||''):'';
  ui.memoContext.textContent=selectedArticle?(Statutes.getLaw(selectedLawId).title+' '+(selectedArticle.title||selectedArticle.num)):'条文を選択してください。';
  setSync('');
}
function openMemo(){if(isMobile()&&selectedArticle)ui.pane.classList.add('open');}
function closeMemo(){ui.pane.classList.remove('open');}
function setReaderState(title,text){ui.state.hidden=false;ui.state.innerHTML='';const strong=document.createElement('strong');strong.textContent=title;const span=document.createElement('span');span.textContent=text||'';ui.state.append(strong,span);ui.list.hidden=true;ui.detail.hidden=true;}
function renderTabs(){ui.tabs.replaceChildren();Statutes.LAW_CATALOG.forEach((law)=>{const button=document.createElement('button');button.type='button';button.className='lawTab'+(law.id===selectedLawId?' active':'');button.textContent=law.shortTitle;button.setAttribute('role','tab');button.setAttribute('aria-selected',law.id===selectedLawId?'true':'false');button.addEventListener('click',()=>{if(law.id!==selectedLawId)selectLaw(law.id);});ui.tabs.append(button);});}
function formatDate(value){if(!value)return'';const date=new Date(value);return Number.isNaN(date.getTime())?'':new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(date);}
function renderMeta(extra=''){
  ui.meta.replaceChildren();if(!lawRecord){ui.meta.textContent=extra;return;}
  const source=document.createElement('span');source.textContent=(lawRecord.source||'e-Gov 法令API')+(lawRecord.lawNum?' ・ '+lawRecord.lawNum:'');ui.meta.append(source);
  if(lawRecord.fetchedAt){const fetched=document.createElement('span');fetched.textContent='端末保存: '+formatDate(lawRecord.fetchedAt);ui.meta.append(fetched);}
  const link=document.createElement('a');link.href=lawRecord.sourceUrl||('https://laws.e-gov.go.jp/law/'+lawRecord.lawId);link.target='_blank';link.rel='noopener noreferrer';link.textContent='e-Govで確認 ↗';ui.meta.append(link);
  if(extra){const note=document.createElement('span');note.textContent=extra;ui.meta.append(note);}
}
function matches(){return Statutes.searchArticles(lawRecord,ui.search.value);}
function renderList(){
  selectedArticle=null;closeMemo();loadMemo();filtered=matches();ui.state.hidden=true;ui.detail.hidden=true;ui.list.hidden=false;ui.list.replaceChildren();
  if(!filtered.length){setReaderState('該当する条文がありません','検索語を変えてください。');return;}
  const fragment=document.createDocumentFragment();filtered.forEach((article)=>{const button=document.createElement('button');button.type='button';button.className='articleRow';button.dataset.article=article.num;const title=document.createElement('div');title.className='articleRowTitle';title.textContent=article.title||('第'+article.num+'条');button.append(title);if(article.caption){const caption=document.createElement('div');caption.className='articleCaption';caption.textContent=article.caption;button.append(caption);}if(article.text){const preview=document.createElement('div');preview.className='articlePreview';preview.textContent=article.text;button.append(preview);}button.addEventListener('click',()=>selectArticle(article));fragment.append(button);});ui.list.append(fragment);
}
function selectedIndex(){return lawRecord&&selectedArticle?lawRecord.articles.findIndex((article)=>String(article.num)===String(selectedArticle.num)):-1;}
function renderDetail(){
  if(!selectedArticle)return;ui.state.hidden=true;ui.list.hidden=true;ui.detail.hidden=false;ui.detailTitle.textContent=selectedArticle.title||('第'+selectedArticle.num+'条');ui.detailCaption.textContent=selectedArticle.caption||'';ui.text.textContent=selectedArticle.text||'';
  const index=selectedIndex();ui.prev.disabled=index<=0;ui.next.disabled=index<0||index>=lawRecord.articles.length-1;
}
function selectArticle(article){selectedArticle=article;renderDetail();loadMemo();openMemo();const url=new URL(location.href);url.searchParams.set('law',selectedLawId);url.searchParams.set('article',article.num);history.replaceState(null,'',url);}
function moveArticle(delta){const index=selectedIndex();const next=lawRecord&&lawRecord.articles[index+delta];if(next)selectArticle(next);}
function restoreArticleFromUrl(){const params=new URLSearchParams(location.search);const num=params.get('article');if(!num||!lawRecord)return false;const normalized=Statutes.normalizeArticleQuery(num);const found=lawRecord.articles.find((article)=>Statutes.normalizeArticleQuery(String(article.num).replace(/-/g,'_'))===normalized||Statutes.normalizeArticleQuery(article.title)===normalized);if(!found)return false;selectArticle(found);return true;}
async function selectLaw(id,force=false){
  const token=++loadToken;selectedLawId=id;lawRecord=null;selectedArticle=null;ui.search.value='';renderTabs();loadMemo();closeMemo();ui.refresh.disabled=true;setReaderState(force?'法令データを更新しています':'法令データを準備しています','端末キャッシュを優先して読み込みます。');renderMeta('');
  try{
    const result=await Statutes.ensureLaw(id,{force});if(token!==loadToken)return;lawRecord=result.record;renderMeta(result.cached?'端末キャッシュを使用':'最新データを端末に保存しました');
    if(!restoreArticleFromUrl())renderList();
  }catch(error){if(token!==loadToken)return;const cached=await Statutes.getCachedLaw(id).catch(()=>null);if(cached){lawRecord=cached;renderMeta('更新に失敗したため端末キャッシュを使用');renderList();}else{setReaderState('法令データを取得できませんでした',error&&error.message?error.message:'通信状態を確認して再試行してください。');renderMeta('');}}
  finally{if(token===loadToken)ui.refresh.disabled=false;}
}
ui.search.addEventListener('input',()=>{if(lawRecord)renderList();});
ui.refresh.addEventListener('click',()=>selectLaw(selectedLawId,true));
ui.back.addEventListener('click',()=>renderList());ui.prev.addEventListener('click',()=>moveArticle(-1));ui.next.addEventListener('click',()=>moveArticle(1));ui.memoClose.addEventListener('click',closeMemo);
ui.memo.addEventListener('input',()=>{clearTimeout(memoTimer);setSync('入力中…');memoTimer=setTimeout(commitMemo,350);});
window.addEventListener('pagehide',()=>{if(memoTimer){clearTimeout(memoTimer);commitMemo();}});
window.addEventListener('resize',()=>{if(!isMobile())closeMemo();});

const requestedLaw=new URLSearchParams(location.search).get('law');if(Statutes.getLaw(requestedLaw))selectedLawId=requestedLaw;
renderTabs();
MangaVault.refreshSession().then(()=>{document.documentElement.classList.remove('auth-pending');selectLaw(selectedLawId);}).catch(()=>{MangaVault.saveSession(null);showLogin();});
})();
</script>
</body>
</html>
