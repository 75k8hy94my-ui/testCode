owTitle{font-weight:850}.articleCaption{color:var(--sub);font-size:12px;margin-top:4px}.articlePreview{color:var(--sub);font-size:12px;line-height:1.55;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.articleDetail{padding:22px}.detailHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}.detailHead h2{margin:0;font-size:25px;letter-spacing:-.03em}.detailCaption{margin:5px 0 0;color:var(--sub);font-size:13px}.articleText{font-size:16px;line-height:1.92;white-space:pre-wrap;overflow-wrap:anywhere}.articleNav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:24px}.articleNav button{min-height:44px;border:1px solid var(--line);border-radius:15px;background:var(--strong);color:var(--text);font-weight:760;cursor:pointer}.articleNav button:disabled{opacity:.35;cursor:default}.backToList{min-height:38px;border:0;background:transparent;color:var(--accent);font-weight:800;cursor:pointer;padding:0}.notePane{position:sticky;top:18px;padding:18px}.noteHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.noteHead h2{margin:0;font-size:18px}.memoContext{margin:0 0 10px;color:var(--sub);font-size:12px}.memo{width:100%;min-height:330px;resize:vertical;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--strong) 88%,transparent);color:var(--text);padding:14px;line-height:1.65;outline:none}.memo:focus{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}.memo:disabled{opacity:.55}.syncStatus{min-height:19px;margin-top:9px;color:var(--sub);font-size:11px;line-height:1.4}.memoClose{display:none;width:36px;height:36px;border:1px solid var(--line);border-radius:999px;background:var(--strong);color:var(--text);font-size:20px;cursor:pointer}[hidden]{display:none!important}@media(max-width:780px){.header{display:block}.topActions{just </style>
</head>
<body>
<main class="shell">
  <header class="header">
    <div><span class="eyebrow">STATUTES</span><h1>六法</h1><p class="sub">現行条文を端末に保存して閲覧し、条文ごとにメモできます。</p></div>
    <nav class="topActions" aria-label="主要ページ">
      <a class="glassBtn" href="home.html">ホーム</a>
      <a class="glassBtn" href="index-search.html">索引検索</a>
      <a class="glassBtn" href="hyakusen.html">判例百選</a>
      <span class="glassBtn current" aria-current="page">六法</span>
      <a class="glassBtn" href="sync.html">保管庫</a>
    </nav>
  </header>

  <section class="toolbar" aria-label="六法操作">
    <div id="lawTabs" class="lawTabs" role="tablist" aria-label="法令選択"></div>
    <div class="searchRow">
      <label class="searchWrap"><span hidden>条文検索</span><input id="articleSearch" type="search" autocomplete="off" placeholder="条番号・キーワードで検索"></label>
      <button id="refreshLawBtn" class="glassBtn" type="button">法令データを更新</button>
    </div>
    <div id="dataMeta" class="dataMeta" aria-live="polite"></div>
  </section>

  <section class="workspace">
    <section id="readerPanel" class="readerPanel" aria-live="polite">
      <div id="readerState" class="readerState"><strong>法令データを準備しています</strong><span>端末に保存済みのデータがあればそれを使います。</span></div>
      <div id="articleList" class="articleList" hidden></div>
      <article id="articleDetail" class="articleDetail" hidden>
        <div class="detailHead"><div><h2 id="detailTitle"></h2><p id="detailCaption" class="detailCaption"></p></div><button id="backToListBtn" class="backToList" type="button">一覧</button></div>
        <div id="articleText" class="articleText"></div>
        <div class="articleNav"><button id="prevArticleBtn" type="button">← 前条</button><button id="nextArticleBtn" type="button">次条 →</button></div>
      </article>
    </section>

    <aside id="notePane" class="notePane" aria-label="条文メモ">
      <div class="noteHead"><h2>条文メモ</h2><button id="memoCloseBtn" class="memoClose" type="button" aria-label="メモを閉じる">×</button></div>
      <p id="memoContext" class="memoContext">条文を選択してください。</p>
      <textarea id="statuteMemo" class="memo" placeholder="この条文についてのメモ" disabled></textarea>
      <div id="syncStatus" class="syncStatus" aria-live="polite"></div>
    </aside>
  </section>
</main>
<script src="app-desktop-rail.js"></script>
<script src="supabase-config.js"></script>
<script src="vault-session.js?v=20260813-vault-state"></script>
<script src="vault-payload.js"></script>
<script src="statute-data.js"></script>
<script src="statutes-page.js"></script>
</body>
</html>
