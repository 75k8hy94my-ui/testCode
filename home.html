<!doctype html>
<html lang="ja" class="auth-pending">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="theme-color" content="#f4f6f8">
<title>ホーム</title>
<link rel="icon" type="image/png" href="icon-152.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="stylesheet" href="liquid-glass.css">
<style>
html.auth-pending body{visibility:hidden}:root{color-scheme:light;--bg:#f4f6f8;--surface:#fff;--surface-strong:#fff;--text:#202124;--sub:#6b7280;--line:#dfe3e8;--accent:#1769aa;--official:#0f766e}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}button,a{font:inherit}[hidden]{display:none!important}.homeShell{width:auto;margin:0;padding:0}.homeHeader{position:fixed;z-index:900;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin:0;padding:0 18px 0 74px;background:#1769aa;color:#fff;border-bottom:1px solid rgba(0,0,0,.08)}.homeHeader>div:first-child{display:flex;align-items:center}.eyebrow{display:none}h1{margin:0;font-size:18px;font-weight:650;letter-spacing:0}.topbarActions{display:flex;align-items:center;gap:10px}.topActions,.headerActions{display:flex;align-items:center;gap:4px}.glassBtn{min-height:34px;border:0;border-radius:4px;padding:0 10px;background:transparent;color:inherit;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;box-shadow:none;cursor:pointer}.homeHeader .glassBtn:hover{background:rgba(255,255,255,.14)}.topActionCurrent{background:rgba(255,255,255,.18)}.syncStatus{position:fixed;z-index:901;top:17px;right:18px;margin:0;color:#fff;font-size:12px;pointer-events:none}.syncStatus:not(:empty){background:#1769aa}.homeGrid,.emptyState,.addPanel,.homeLogoutArea{margin-left:82px;margin-right:24px}.homeGrid{padding-top:78px;display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.homeCard{position:relative;min-height:150px;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}.homeCardLink{height:100%;min-height:150px;padding:18px;color:inherit;text-decoration:none;display:flex;flex-direction:column}.cardTop{display:flex;justify-content:space-between;align-items:center;gap:12px}.cardMark{width:34px;height:34px;border-radius:4px;display:grid;place-items:center;background:#eef3f8;border:1px solid var(--line);font-weight:700;color:var(--accent)}.cardBadge{font-size:10px;font-weight:650;color:var(--sub);border:1px solid var(--line);border-radius:3px;padding:4px 7px}.homeCard[data-kind="official"] .cardBadge{color:var(--official)}.homeCard h2{margin:15px 0 5px;font-size:19px}.homeCard p{margin:0;color:var(--sub);font-size:13px;line-height:1.55}.openHint{margin-top:auto;padding-top:14px;color:var(--accent);font-size:12px;font-weight:650}.editCardBody{min-height:150px;padding:18px 18px 64px}.editCardBody h2{margin:14px 0 5px}.cardEditControls{position:absolute;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:6px}.cardEditControls button,.addCardButton{min-height:36px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--text);font-weight:600;cursor:pointer}.cardEditControls button:disabled{opacity:.35;cursor:default}.cardEditControls .remove{color:#b42318}.addPanel{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:6px;background:#fff}.addPanel h2{margin:0;font-size:18px}.addPanel p{margin:6px 0 14px;color:var(--sub);font-size:13px}.addCardList{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.addCardButton{text-align:left;padding:12px}.addCardButton strong{display:block}.addCardButton span{display:block;color:var(--sub);font-size:11px;margin-top:4px}.emptyState{margin-top:78px;padding:38px 18px;border:1px dashed var(--line);border-radius:6px;text-align:center;color:var(--sub);background:#fff}.emptyState strong{display:block;color:var(--text);font-size:19px;margin-bottom:7px}.emptyState .glassBtn{margin-top:16px;color:var(--text);border:1px solid var(--line)}.homeLogoutArea{margin-top:28px;margin-bottom:32px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:center}.homeLogoutBtn{min-width:180px;color:#b42318;border:1px solid var(--line);background:#fff}.homeLogoutBtn:disabled{opacity:.55;cursor:wait}.homeCardLink:focus-visible,.glassBtn:focus-visible,.cardEditControls button:focus-visible,.addCardButton:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(min-width:900px){html.app-desktop-rail-page body{padding-left:0!important}html.app-desktop-rail-page body>main{width:auto!important;max-width:none!important;margin:0!important}#appDesktopRail,#desktopReaderNav{position:fixed!important;z-index:950!important;left:0!important;top:54px!important;bottom:0!important;transform:none!important;width:58px!important;max-height:none!important;overflow-y:auto!important;display:flex!important;flex-direction:column!important;gap:2px!important;padding:8px 6px!important;border:0!important;border-right:1px solid var(--line)!important;border-radius:0!important;background:#fff!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}.appDesktopRailItem{min-height:44px!important;height:44px!important;padding:0!important;border:0!important;border-radius:4px!important;display:flex!important;align-items:center!important;justify-content:center!important;background:transparent!important;color:#555!important;box-shadow:none!important}.appDesktopRailItem svg{width:20px!important;height:20px!important;flex:0 0 20px!important}.appDesktopRailItem span{display:none!important}.appDesktopRailItem.active,.appDesktopRailItem[aria-current="page"]{color:var(--accent)!important;background:#e9f2fb!important;border:0!important;box-shadow:none!important}.appDesktopRailItem:active{transform:none!important}}
@media(max-width:899px){.homeHeader{position:static;height:auto;display:block;padding:18px;color:var(--text);background:#fff}.topbarActions{margin-top:14px;display:block}.topActions,.headerActions{margin-top:6px;flex-wrap:wrap}.homeHeader .glassBtn{color:var(--text);border:1px solid var(--line)}.syncStatus{position:static;margin:8px 18px;color:var(--sub)}.homeGrid,.emptyState,.addPanel,.homeLogoutArea{margin-left:18px;margin-right:18px}.homeGrid{padding-top:10px;grid-template-columns:1fr}.emptyState{margin-top:10px}}
</style>
</head>
<body>
<main class="homeShell" id="homeApp">
  <header class="homeHeader">
    <div><span class="eyebrow">HOME</span><h1>ホーム</h1></div>
    <div class="topbarActions">
      <nav class="topActions" aria-label="主要ページ"><span class="glassBtn topActionCurrent" aria-current="page">ホーム</span><a class="glassBtn" href="index-search.html">索引検索</a><a class="glassBtn" href="hyakusen.html">判例百選</a></nav>
      <div class="headerActions"><a class="glassBtn" href="sync.html">保管庫</a><button class="glassBtn" id="editHomeBtn" type="button">カードを編集</button></div>
    </div>
  </header>
  <p id="homeSyncStatus" class="syncStatus" aria-live="polite"></p>
  <section id="homeGrid" class="homeGrid" aria-label="ホームカード"></section>
  <section id="homeEmpty" class="emptyState" hidden><strong>ホームにカードがありません</strong><span>必要なカードだけ追加できます。</span><button id="emptyEditBtn" class="glassBtn" type="button">カードを追加</button></section>
  <section id="addCardPanel" class="addPanel" hidden><h2>カードを追加</h2><p>非表示にしたカードはいつでも戻せます。</p><div id="addCardList" class="addCardList"></div></section>
  <section class="homeLogoutArea" aria-label="アカウント操作"><button class="glassBtn homeLogoutBtn" id="homeLogoutBtn" type="button">ログアウト</button></section>
</main>
<script src="app-desktop-rail.js"></script>
<script src="supabase-config.js"></script>
<script src="vault-session.js?v=20260813-vault-state"></script>
<script src="vault-payload.js"></script>
<script src="encrypted-chunk-cache.js"></script>
<script src="home-dashboard.js"></script>
<script>
(()=>{
'use strict';
const config=window.MANGA_READER_SUPABASE||{};
const showLogin=()=>window.location.replace('index.html');
const showVault=()=>window.location.replace('sync.html');
const session=window.MangaVault&&MangaVault.loadSession();
if(!session||!session.refresh_token||!config.url||!config.publishableKey){showLogin();return;}
if(!MangaVault.loadActive()){showVault();return;}
MangaVault.refreshSession().then(()=>document.documentElement.classList.remove('auth-pending')).catch(()=>{MangaVault.saveSession(null);showLogin();});
const Home=window.MangaReaderHome;
const $=(id)=>document.getElementById(id);
const ui={grid:$('homeGrid'),empty:$('homeEmpty'),edit:$('editHomeBtn'),emptyEdit:$('emptyEditBtn'),addPanel:$('addCardPanel'),addList:$('addCardList'),sync:$('homeSyncStatus'),logout:$('homeLogoutBtn')};
const DEVICE_DATA_KEYS=[...Object.values(MangaVaultPayload.DATA_KEYS||{}),'mangaReaderLastUrl','mangaReaderSavedUrls','mangaReaderGithubSync','mangaReaderVaultSyncMeta'];
const marks={bookshelf:'本',study:'学',quiz:'Q',links:'↗',egov:'法',courts:'判','moj-exam':'司'};
let layout=Home.loadLayout();let editing=false;let syncRunning=false;let syncDirty=false;let syncClearTimer=null;
function setSyncStatus(text){clearTimeout(syncClearTimer);ui.sync.textContent=text||'';if(text&&text!=='同期中…')syncClearTimer=setTimeout(()=>{ui.sync.textContent='';},3500);}
async function runHomeSync(){if(syncRunning){syncDirty=true;return;}syncRunning=true;setSyncStatus('同期中…');try{await MangaVault.savePayload(MangaVaultPayload.buildFromLocalStorage());setSyncStatus('ホームの並びを保存しました');}catch(error){setSyncStatus('端末には保存済みです。クラウド同期: '+(error&&error.message?error.message:'失敗'));}finally{syncRunning=false;if(syncDirty){syncDirty=false;runHomeSync();}}}
async function logout(){if(!confirm('ログアウトしますか？'))return;ui.logout.disabled=true;try{await MangaVault.withSession((token)=>MangaVault.api('/auth/v1/logout',{method:'POST',token}));}catch(_){}try{if(session.user&&session.user.id)await EncryptedChunkCache.clearAll({dbName:`${EncryptedChunkCache.DB_NAME}:${session.user.id}`});}catch(_){}MangaVault.clearActive();MangaVault.saveSession(null);localStorage.removeItem(MangaVault.META_KEY);DEVICE_DATA_KEYS.forEach((key)=>localStorage.removeItem(key));Object.keys(localStorage).filter((key)=>key.startsWith('mangaReaderSavedVaultPassphrase:')).forEach((key)=>localStorage.removeItem(key));showLogin();}
function commitLayout(next){layout=Home.saveLayout(next);render();runHomeSync();}
function cardTop(card){const top=document.createElement('div');top.className='cardTop';const mark=document.createElement('span');mark.className='cardMark';mark.textContent=marks[card.id]||'・';const badge=document.createElement('span');badge.className='cardBadge';badge.textContent=card.badge||'';top.append(mark,badge);return top;}
function addCardText(root,card){root.append(cardTop(card));const title=document.createElement('h2');title.textContent=card.title;const text=document.createElement('p');text.textContent=card.subtitle;root.append(title,text);}
function buildCard(id,index){const card=Home.CARD_CATALOG[id];if(!card)return null;const article=document.createElement('article');article.className='homeCard';article.dataset.kind=card.kind;if(!editing){const link=document.createElement('a');link.className='homeCardLink';link.href=card.href;if(card.kind==='official'){link.target='_blank';link.rel='noopener noreferrer';}addCardText(link,card);const hint=document.createElement('span');hint.className='openHint';hint.textContent=card.kind==='official'?'公式サイトを開く ↗':'開く →';link.append(hint);article.append(link);return article;}const body=document.createElement('div');body.className='editCardBody';addCardText(body,card);article.append(body);const controls=document.createElement('div');controls.className='cardEditControls';const up=document.createElement('button');up.type='button';up.textContent='↑';up.setAttribute('aria-label',card.title+'を上へ');up.disabled=index===0;up.addEventListener('click',()=>commitLayout(Home.moveCard(layout,id,-1)));const down=document.createElement('button');down.type='button';down.textContent='↓';down.setAttribute('aria-label',card.title+'を下へ');down.disabled=index===layout.length-1;down.addEventListener('click',()=>commitLayout(Home.moveCard(layout,id,1)));const remove=document.createElement('button');remove.type='button';remove.className='remove';remove.textContent='削除';remove.addEventListener('click',()=>commitLayout(Home.removeCard(layout,id)));controls.append(up,down,remove);article.append(controls);return article;}
function renderAddPanel(){ui.addList.replaceChildren();Home.hiddenCardIds(layout).forEach((id)=>{const card=Home.CARD_CATALOG[id];const button=document.createElement('button');button.className='addCardButton';button.type='button';const title=document.createElement('strong');title.textContent='+ '+card.title;const detail=document.createElement('span');detail.textContent=card.subtitle;button.append(title,detail);button.addEventListener('click',()=>commitLayout(Home.addCard(layout,id)));ui.addList.append(button);});if(!ui.addList.childElementCount){const done=document.createElement('span');done.textContent='追加できるカードはすべて表示されています。';done.style.color='var(--sub)';ui.addList.append(done);}}
function render(){ui.grid.replaceChildren();layout.forEach((id,index)=>{const node=buildCard(id,index);if(node)ui.grid.append(node);});ui.empty.hidden=layout.length>0;ui.addPanel.hidden=!editing;ui.edit.textContent=editing?'編集完了':'カードを編集';if(editing)renderAddPanel();}
function setEditing(value){editing=!!value;render();}
ui.edit.addEventListener('click',()=>setEditing(!editing));ui.emptyEdit.addEventListener('click',()=>setEditing(true));ui.logout.addEventListener('click',logout);
try{const theme=localStorage.getItem('mangaReaderTheme');document.documentElement.dataset.theme=theme==='light'?'light':'dark';}catch(_){document.documentElement.dataset.theme='dark';}
render();
})();
</script>
</body>
</html>
