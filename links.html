<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c11">
<title>リンク管理</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0c11;
    --panel: #161a23;
    --border: #262b38;
    --text: #f1f2f6;
    --sub: #8d93a3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    background: radial-gradient(ellipse 120% 80% at 50% -10%, #161a26 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  main { width: min(680px, 100%); margin: 0 auto; }
  a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    color: var(--text);
    text-decoration: none;
  }
  .panel {
    margin-top: 28px;
    padding: 24px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--panel);
  }
  h1 { margin: 0 0 10px; font-size: 26px; }
  p { margin: 0; color: var(--sub); line-height: 1.7; }
</style>
</head>
<body>
<main>
  <a href="index.html" aria-label="ホームへ戻る">← ホームへ戻る</a>
  <section class="panel">
    <h1>リンク管理</h1>
    <p>Safariから保存したリンクを管理するページを、ここに少しずつ作っていきます。</p>
  </section>
</main>
</body>
</html>
