<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c11">
<title>リンク管理</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0c11;
    --panel: #161a23;
    --panel-2: #1d2230;
    --border: #2b3140;
    --text: #f1f2f6;
    --sub: #969dad;
    --accent: #7aa2ff;
    --danger: #ff7b86;
    --shadow: 0 18px 45px rgba(0, 0, 0, .28);
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    min-height: 100vh;
    padding: max(18px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    background: radial-gradient(ellipse 120% 70% at 50% -10%, #1a2030 0%, var(--bg) 58%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  button, input, textarea { font: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button { color: var(--text); }
  main { width: min(760px, 100%); margin: 0 auto; }
  .topline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .back {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    color: var(--text);
    text-decoration: none;
  }
  .primary, .secondary, .icon-btn, .filter-btn {
    min-height: 44px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    cursor: pointer;
  }
  .primary {
    padding: 0 16px;
    border-color: #6b8ee6;
    background: var(--accent);
    color: #08101f;
    font-weight: 750;
  }
  .secondary { padding: 0 14px; }
  .hero { padding: 22px 2px 16px; }
  h1 { margin: 0; font-size: clamp(26px, 7vw, 38px); letter-spacing: -.03em; }
  .summary { margin: 7px 0 0; color: var(--sub); }
  .search-wrap { position: relative; margin: 6px 0 12px; }
  .search-wrap::before {
    content: "⌕";
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-51%);
    color: var(--sub);
    font-size: 22px;
  }
  #searchInput {
    width: 100%;
    min-height: 48px;
    padding: 0 42px;
    border: 1px solid var(--border);
    border-radius: 14px;
    outline: none;
    background: var(--panel);
    color: var(--text);
  }
  #searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(122, 162, 255, .14); }
  #clearSearchBtn {
    position: absolute;
    right: 7px;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    min-height: 36px;
    border: 0;
    background: transparent;
    color: var(--sub);
    font-size: 19px;
    cursor: pointer;
  }
  .filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 0 0 14px;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filter-btn {
    flex: 0 0 auto;
    min-height: 38px;
    padding: 0 13px;
    color: var(--sub);
  }
  .filter-btn.active {
    border-color: rgba(122, 162, 255, .72);
    background: rgba(122, 162, 255, .14);
    color: var(--text);
  }
  .tag-filter {
    margin: -4px 0 14px;
    color: var(--sub);
    font-size: 13px;
  }
  .tag-filter button {
    margin-left: 7px;
    border: 0;
    background: transparent;
    color: var(--accent);
    cursor: pointer;
  }
  .list { display: grid; gap: 11px; }
  .card {
    position: relative;
    padding: 15px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: linear-gradient(145deg, var(--panel), #131720);
    box-shadow: 0 5px 20px rgba(0, 0, 0, .12);
  }
  .card.unread { border-left: 3px solid var(--accent); }
  .card-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: start;
    gap: 10px;
  }
  .card-title {
    display: block;
    overflow: hidden;
    color: var(--text);
    font-size: 16px;
    font-weight: 720;
    line-height: 1.4;
    text-decoration: none;
    text-overflow: ellipsis;
  }
  .domain {
    margin-top: 4px;
    overflow: hidden;
    color: var(--sub);
    font-size: 12px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .favorite-btn {
    width: 40px;
    min-height: 40px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--sub);
    font-size: 23px;
    cursor: pointer;
  }
  .favorite-btn.active { color: #ffb14b; }
  .note { margin: 10px 0 0; color: #c7cbd5; font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
  .tag {
    min-height: 28px;
    padding: 3px 9px;
    border: 1px solid #394154;
    border-radius: 999px;
    background: #202635;
    color: #bdc8e3;
    font-size: 12px;
    cursor: pointer;
  }
  .card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 13px;
    color: var(--sub);
    font-size: 12px;
  }
  .actions { display: flex; gap: 4px; }
  .icon-btn {
    min-height: 36px;
    padding: 0 10px;
    border-color: transparent;
    background: transparent;
    color: var(--sub);
  }
  .icon-btn:hover { color: var(--text); background: var(--panel-2); }
  .empty {
    display: none;
    padding: 42px 22px;
    border: 1px dashed var(--border);
    border-radius: 16px;
    color: var(--sub);
    text-align: center;
    line-height: 1.7;
  }
  .tools {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .tools .secondary { min-height: 40px; color: var(--sub); font-size: 13px; }
  #importFile { display: none; }
  dialog {
    width: min(560px, calc(100% - 24px));
    max-height: calc(100dvh - 24px);
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--panel);
    color: var(--text);
    box-shadow: var(--shadow);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .68); backdrop-filter: blur(5px); }
  form { padding: 20px; }
  .dialog-title { margin: 0 0 18px; font-size: 21px; }
  label { display: block; margin-top: 13px; color: var(--sub); font-size: 13px; }
  label span { display: block; margin-bottom: 6px; }
  label input, label textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 11px;
    outline: none;
    background: #10141c;
    color: var(--text);
  }
  label input:focus, label textarea:focus { border-color: var(--accent); }
  textarea { min-height: 88px; resize: vertical; }
  .dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 9px;
    margin-top: 20px;
  }
  .form-error { min-height: 20px; margin: 8px 0 0; color: var(--danger); font-size: 13px; }
  .toast {
    position: fixed;
    z-index: 10;
    left: 50%;
    bottom: max(22px, env(safe-area-inset-bottom));
    transform: translate(-50%, 18px);
    max-width: calc(100% - 28px);
    padding: 11px 16px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: #252b39;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: .2s ease;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  @media (min-width: 660px) {
    body { padding-left: 24px; padding-right: 24px; }
    .card { padding: 18px; }
  }
</style>
</head>
<body>
<main>
  <div class="topline">
    <a class="back" href="index.html" aria-label="ホームへ戻る">← ホーム</a>
    <button class="primary" id="addBtn" type="button">＋ 追加</button>
  </div>

  <header class="hero">
    <h1>リンク管理</h1>
    <p class="summary" id="summary">保存したリンクはありません</p>
  </header>

  <div class="search-wrap">
    <input id="searchInput" type="search" placeholder="タイトル・URL・メモ・タグを検索" autocomplete="off">
    <button id="clearSearchBtn" type="button" aria-label="検索を消去" hidden>×</button>
  </div>

  <nav class="filters" aria-label="リンクの絞り込み">
    <button class="filter-btn active" type="button" data-filter="all">すべて</button>
    <button class="filter-btn" type="button" data-filter="unread">未読</button>
    <button class="filter-btn" type="button" data-filter="favorite">お気に入り</button>
  </nav>
  <div class="tag-filter" id="tagFilter" hidden></div>

  <section class="list" id="linkList" aria-live="polite"></section>
  <div class="empty" id="emptyState"></div>

  <footer class="tools">
    <button class="secondary" id="exportBtn" type="button">JSONを書き出す</button>
    <button class="secondary" id="importBtn" type="button">JSONを読み込む</button>
    <input id="importFile" type="file" accept="application/json,.json">
  </footer>
</main>

<dialog id="editDialog">
  <form id="editForm">
    <h2 class="dialog-title" id="dialogTitle">リンクを追加</h2>
    <input id="itemId" type="hidden">
    <label>
      <span>URL</span>
      <input id="urlInput" type="url" inputmode="url" placeholder="https://example.com" required>
    </label>
    <label>
      <span>タイトル</span>
      <input id="titleInput" type="text" placeholder="空欄ならURLから作成">
    </label>
    <label>
      <span>メモ</span>
      <textarea id="noteInput" placeholder="あとで確認したいことなど"></textarea>
    </label>
    <label>
      <span>タグ（カンマ区切り）</span>
      <input id="tagsInput" type="text" placeholder="法律, 読み物">
    </label>
    <p class="form-error" id="formError"></p>
    <div class="dialog-actions">
      <button class="secondary" id="cancelBtn" type="button">キャンセル</button>
      <button class="primary" type="submit">保存</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'linkManagerItemsV1';
  const MAX_IMPORT_ITEMS = 5000;
  const els = {
    addBtn: document.getElementById('addBtn'),
    summary: document.getElementById('summary'),
    searchInput: document.getElementById('searchInput'),
    clearSearchBtn: document.getElementById('clearSearchBtn'),
    filters: Array.from(document.querySelectorAll('.filter-btn')),
    tagFilter: document.getElementById('tagFilter'),
    linkList: document.getElementById('linkList'),
    emptyState: document.getElementById('emptyState'),
    exportBtn: document.getElementById('exportBtn'),
    importBtn: document.getElementById('importBtn'),
    importFile: document.getElementById('importFile'),
    editDialog: document.getElementById('editDialog'),
    editForm: document.getElementById('editForm'),
    dialogTitle: document.getElementById('dialogTitle'),
    itemId: document.getElementById('itemId'),
    urlInput: document.getElementById('urlInput'),
    titleInput: document.getElementById('titleInput'),
    noteInput: document.getElementById('noteInput'),
    tagsInput: document.getElementById('tagsInput'),
    formError: document.getElementById('formError'),
    cancelBtn: document.getElementById('cancelBtn'),
    toast: document.getElementById('toast'),
  };

  let items = loadItems();
  let activeFilter = 'all';
  let activeTag = '';
  let toastTimer = 0;

  function loadItems() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      return Array.isArray(parsed) ? parsed.map(normalizeItem).filter(Boolean) : [];
    } catch (e) {
      return [];
    }
  }

  function normalizeItem(raw) {
    if (!raw || typeof raw !== 'object' || typeof raw.url !== 'string') return null;
    const url = normalizeUrl(raw.url);
    if (!url) return null;
    const now = Date.now();
    return {
      id: String(raw.id || makeId()),
      url,
      title: String(raw.title || titleFromUrl(url)).trim(),
      note: String(raw.note || '').trim(),
      tags: normalizeTags(raw.tags),
      favorite: !!raw.favorite,
      readAt: Number(raw.readAt) || null,
      createdAt: Number(raw.createdAt) || now,
      updatedAt: Number(raw.updatedAt) || Number(raw.createdAt) || now,
      source: String(raw.source || 'manual'),
    };
  }

  function saveItems() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function makeId() {
    if (crypto && typeof crypto.randomUUID === 'function') return 'link_' + crypto.randomUUID();
    return 'link_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
  }

  function normalizeUrl(value) {
    let input = String(value || '').trim();
    if (!input) return '';
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(input)) input = 'https://' + input;
    try {
      const url = new URL(input);
      if (!/^https?:$/.test(url.protocol)) return '';
      url.hash = '';
      return url.href;
    } catch (e) {
      return '';
    }
  }

  function urlKey(value) {
    try {
      const url = new URL(value);
      url.hash = '';
      if (url.pathname === '/') url.pathname = '';
      return url.href.replace(/\/$/, '').toLowerCase();
    } catch (e) {
      return String(value || '').toLowerCase();
    }
  }

  function titleFromUrl(value) {
    try {
      const url = new URL(value);
      const tail = decodeURIComponent(url.pathname.split('/').filter(Boolean).pop() || '');
      return tail || url.hostname.replace(/^www\./, '');
    } catch (e) {
      return value;
    }
  }

  function normalizeTags(value) {
    const source = Array.isArray(value) ? value : String(value || '').split(/[,、]/);
    return Array.from(new Set(source.map((tag) => String(tag).trim()).filter(Boolean))).slice(0, 20);
  }

  function displayDomain(value) {
    try {
      return new URL(value).hostname.replace(/^www\./, '');
    } catch (e) {
      return value;
    }
  }

  function formatDate(timestamp) {
    if (!timestamp) return '未読';
    return new Intl.DateTimeFormat('ja-JP', { year: 'numeric', month: 'numeric', day: 'numeric' }).format(timestamp);
  }

  function escapeSearch(value) {
    return String(value || '').normalize('NFKC').toLocaleLowerCase('ja');
  }

  function visibleItems() {
    const query = escapeSearch(els.searchInput.value.trim());
    return items
      .filter((item) => {
        if (activeFilter === 'unread' && item.readAt) return false;
        if (activeFilter === 'favorite' && !item.favorite) return false;
        if (activeTag && !item.tags.includes(activeTag)) return false;
        if (!query) return true;
        return escapeSearch([item.title, item.url, item.note, item.tags.join(' ')].join(' ')).includes(query);
      })
      .sort((a, b) => b.createdAt - a.createdAt);
  }

  function render() {
    const visible = visibleItems();
    const unread = items.filter((item) => !item.readAt).length;
    els.summary.textContent = items.length
      ? items.length + '件保存 ・ 未読' + unread + '件'
      : '保存したリンクはありません';
    els.clearSearchBtn.hidden = !els.searchInput.value;

    els.tagFilter.hidden = !activeTag;
    if (activeTag) {
      els.tagFilter.replaceChildren(
        document.createTextNode('タグ「' + activeTag + '」で絞り込み中'),
        makeButton('解除', () => { activeTag = ''; render(); })
      );
    }

    els.linkList.replaceChildren();
    const fragment = document.createDocumentFragment();
    visible.forEach((item) => fragment.appendChild(buildCard(item)));
    els.linkList.appendChild(fragment);

    const filtering = activeFilter !== 'all' || activeTag || els.searchInput.value.trim();
    els.emptyState.style.display = visible.length ? 'none' : 'block';
    els.emptyState.textContent = items.length
      ? (filtering ? '条件に一致するリンクはありません。' : 'リンクはまだありません。')
      : '「＋ 追加」から最初のリンクを保存できます。';
  }

  function buildCard(item) {
    const card = document.createElement('article');
    card.className = 'card' + (item.readAt ? '' : ' unread');

    const head = document.createElement('div');
    head.className = 'card-head';
    const titleBox = document.createElement('div');
    const title = document.createElement('a');
    title.className = 'card-title';
    title.href = item.url;
    title.target = '_blank';
    title.rel = 'noopener noreferrer';
    title.textContent = item.title || item.url;
    title.addEventListener('click', () => markRead(item));
    const domain = document.createElement('div');
    domain.className = 'domain';
    domain.textContent = displayDomain(item.url);
    titleBox.append(title, domain);

    const favorite = document.createElement('button');
    favorite.type = 'button';
    favorite.className = 'favorite-btn' + (item.favorite ? ' active' : '');
    favorite.textContent = item.favorite ? '★' : '☆';
    favorite.title = item.favorite ? 'お気に入りから外す' : 'お気に入りに追加';
    favorite.setAttribute('aria-label', favorite.title);
    favorite.addEventListener('click', () => {
      item.favorite = !item.favorite;
      item.updatedAt = Date.now();
      saveItems();
      render();
    });
    head.append(titleBox, favorite);
    card.appendChild(head);

    if (item.note) {
      const note = document.createElement('p');
      note.className = 'note';
      note.textContent = item.note;
      card.appendChild(note);
    }

    if (item.tags.length) {
      const tags = document.createElement('div');
      tags.className = 'tags';
      item.tags.forEach((tagName) => {
        const tag = makeButton(tagName, () => { activeTag = tagName; render(); });
        tag.className = 'tag';
        tags.appendChild(tag);
      });
      card.appendChild(tags);
    }

    const foot = document.createElement('div');
    foot.className = 'card-foot';
    const status = document.createElement('span');
    status.textContent = item.readAt ? '既読 ' + formatDate(item.readAt) : '未読';
    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.append(
      makeAction(item.readAt ? '未読に戻す' : '既読にする', () => toggleRead(item)),
      makeAction('編集', () => openEditor(item)),
      makeAction('削除', () => deleteItem(item))
    );
    foot.append(status, actions);
    card.appendChild(foot);
    return card;
  }

  function makeButton(label, action) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.addEventListener('click', action);
    return button;
  }

  function makeAction(label, action) {
    const button = makeButton(label, action);
    button.className = 'icon-btn';
    return button;
  }

  function markRead(item) {
    if (!item.readAt) {
      item.readAt = Date.now();
      item.updatedAt = Date.now();
      saveItems();
    }
  }

  function toggleRead(item) {
    item.readAt = item.readAt ? null : Date.now();
    item.updatedAt = Date.now();
    saveItems();
    render();
  }

  function deleteItem(item) {
    if (!confirm('「' + item.title + '」を削除しますか？')) return;
    items = items.filter((candidate) => candidate.id !== item.id);
    saveItems();
    render();
    showToast('削除しました');
  }

  function openEditor(item, preset) {
    const data = item || preset || {};
    els.dialogTitle.textContent = item ? 'リンクを編集' : 'リンクを追加';
    els.itemId.value = item ? item.id : '';
    els.urlInput.value = data.url || '';
    els.titleInput.value = data.title || '';
    els.noteInput.value = data.note || '';
    els.tagsInput.value = normalizeTags(data.tags).join(', ');
    els.formError.textContent = '';
    els.editDialog.showModal();
    window.setTimeout(() => (els.urlInput.value ? els.titleInput : els.urlInput).focus(), 0);
  }

  function closeEditor() {
    els.editDialog.close();
    els.editForm.reset();
    els.formError.textContent = '';
  }

  function submitEditor(event) {
    event.preventDefault();
    const url = normalizeUrl(els.urlInput.value);
    if (!url) {
      els.formError.textContent = 'http または https のURLを入力してください。';
      return;
    }
    const id = els.itemId.value;
    const duplicate = items.find((item) => urlKey(item.url) === urlKey(url) && item.id !== id);
    if (duplicate) {
      els.formError.textContent = 'このURLはすでに「' + duplicate.title + '」として保存されています。';
      return;
    }
    const now = Date.now();
    const existing = items.find((item) => item.id === id);
    const values = {
      url,
      title: els.titleInput.value.trim() || titleFromUrl(url),
      note: els.noteInput.value.trim(),
      tags: normalizeTags(els.tagsInput.value),
      updatedAt: now,
    };
    if (existing) {
      Object.assign(existing, values);
    } else {
      items.unshift({
        id: makeId(),
        ...values,
        favorite: false,
        readAt: null,
        createdAt: now,
        source: new URLSearchParams(location.search).has('add') ? 'safari-shortcut' : 'manual',
      });
    }
    saveItems();
    closeEditor();
    clearCaptureQuery();
    render();
    showToast(existing ? '更新しました' : '保存しました');
  }

  function showToast(message) {
    window.clearTimeout(toastTimer);
    els.toast.textContent = message;
    els.toast.classList.add('show');
    toastTimer = window.setTimeout(() => els.toast.classList.remove('show'), 1800);
  }

  function exportItems() {
    const payload = JSON.stringify({
      version: 1,
      exportedAt: new Date().toISOString(),
      items,
    }, null, 2);
    const blob = new Blob([payload], { type: 'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'links-' + new Date().toISOString().slice(0, 10) + '.json';
    link.click();
    window.setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  }

  async function importItems(file) {
    try {
      const payload = JSON.parse(await file.text());
      const incoming = Array.isArray(payload) ? payload : payload.items;
      if (!Array.isArray(incoming)) throw new Error('形式が違います');
      if (incoming.length > MAX_IMPORT_ITEMS) throw new Error('件数が多すぎます');

      const byUrl = new Map(items.map((item) => [urlKey(item.url), item]));
      let added = 0;
      let updated = 0;
      incoming.map(normalizeItem).filter(Boolean).forEach((item) => {
        const key = urlKey(item.url);
        const existing = byUrl.get(key);
        if (!existing) {
          items.push(item);
          byUrl.set(key, item);
          added++;
        } else if (item.updatedAt > existing.updatedAt) {
          Object.assign(existing, item, { id: existing.id });
          updated++;
        }
      });
      saveItems();
      render();
      showToast('追加' + added + '件・更新' + updated + '件');
    } catch (e) {
      alert('JSONを読み込めませんでした。リンク管理から書き出したファイルを選んでください。');
    } finally {
      els.importFile.value = '';
    }
  }

  function captureFromQuery() {
    const params = new URLSearchParams(location.search);
    const rawUrl = params.get('url') || '';
    if (!params.has('add') && !rawUrl) return;
    openEditor(null, {
      url: rawUrl,
      title: params.get('title') || '',
      note: params.get('note') || '',
      tags: params.get('tags') || '',
    });
  }

  function clearCaptureQuery() {
    if (!location.search) return;
    history.replaceState(null, '', location.pathname + location.hash);
  }

  els.addBtn.addEventListener('click', () => openEditor());
  els.cancelBtn.addEventListener('click', () => { closeEditor(); clearCaptureQuery(); });
  els.editForm.addEventListener('submit', submitEditor);
  els.editDialog.addEventListener('cancel', () => { clearCaptureQuery(); });
  els.searchInput.addEventListener('input', render);
  els.clearSearchBtn.addEventListener('click', () => { els.searchInput.value = ''; render(); els.searchInput.focus(); });
  els.filters.forEach((button) => button.addEventListener('click', () => {
    activeFilter = button.dataset.filter;
    els.filters.forEach((candidate) => candidate.classList.toggle('active', candidate === button));
    render();
  }));
  els.exportBtn.addEventListener('click', exportItems);
  els.importBtn.addEventListener('click', () => els.importFile.click());
  els.importFile.addEventListener('change', () => {
    const file = els.importFile.files && els.importFile.files[0];
    if (file) importItems(file);
  });

  render();
  captureFromQuery();
})();
</script>
</body>
</html>
