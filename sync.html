<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>保管庫 | 漫画リーダー</title>
  <style>
    :root { --bg:#f5f7fb; --surface:#fff; --text:#1e293b; --sub:#64748b; --line:#dbe3ee; --accent:#2563eb; --danger:#b91c1c; --radius:14px; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--text); background:linear-gradient(150deg,#edf4ff 0%,var(--bg) 45%,#f8fafc 100%); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100% - 32px,560px); margin:0 auto; padding:42px 0 64px; } header,.account { display:flex; justify-content:space-between; align-items:center; gap:12px; } header { margin-bottom:26px; } h1 { font-size:24px; margin:0; } h2 { font-size:18px; margin:0 0 6px; }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:0 14px 36px rgba(15,23,42,.08); padding:24px; } .description,.status { color:var(--sub); font-size:14px; line-height:1.7; margin:0 0 18px; } label { display:block; font-size:13px; font-weight:700; margin:15px 0 6px; }
    input { width:100%; padding:12px; border:1px solid var(--line); border-radius:9px; color:var(--text); background:#fbfdff; font:inherit; } input:focus { outline:3px solid rgba(37,99,235,.16); border-color:var(--accent); } button { appearance:none; border:1px solid var(--line); border-radius:9px; padding:10px 12px; background:#fff; color:var(--text); font:inherit; font-weight:700; cursor:pointer; } .danger { color:var(--danger); border-color:#fecaca; background:#fff7f7; } .recovery { margin-top:16px; padding:14px; border:1px solid #facc15; border-radius:10px; background:#fefce8; font-size:13px; line-height:1.65; } code { display:block; margin:8px 0; padding:9px; border-radius:7px; background:#fff; overflow-wrap:anywhere; user-select:all; } [hidden] { display:none!important; } @media (max-width:520px) { main { width:min(100% - 24px,560px); padding-top:24px; }.card { padding:18px; } }
  </style>
</head>
<body>
  <main>
    <header><h1>漫画リーダー</h1><button id="logoutBtn" class="danger" type="button">ログアウト</button></header>
    <section class="card">
      <div class="account"><div><div class="description" style="margin:0 0 3px;">ログイン中</div><div id="accountEmail"></div></div></div>
      <div id="unlockView" style="margin-top:24px;">
        <h2>パスフレーズ</h2>
        <p class="description">入力すると、暗号化された保存内容を自動で読み込みます。</p>
        <label for="vaultPassphrase">保管庫パスフレーズ</label>
        <input id="vaultPassphrase" name="vault-unlock-key" type="password" autocomplete="off" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" placeholder="ログイン用とは別のパスフレーズ" autofocus>
        <label for="recoveryKey">または復旧キー</label>
        <input id="recoveryKey" type="text" autocomplete="off" spellcheck="false" placeholder="作成時に控えた復旧キー">
        <p id="status" class="status" aria-live="polite"></p>
      </div>
      <div id="recoveryBox" class="recovery" hidden>
        <strong>復旧キー（今だけ表示）</strong>
        <code id="recoveryCode"></code>
        <button id="copyRecoveryBtn" type="button">復旧キーをコピー</button>
        <div style="margin-top:8px;">安全な場所に保管してください。数秒後に漫画リーダーを開きます。</div>
      </div>
    </section>
  </main>
  <script src="supabase-config.js"></script>
  <script src="vault-session.js"></script>
  <script>
  (() => {
    'use strict';
    const DATA_KEYS = { folders:'mangaReaderSavedFolders', items:'mangaReaderSavedItems', videos:'mangaReaderVideos', mangaInfo:'mangaReaderInfoCache', toc:'mangaReaderToc', lastPages:'mangaReaderLastPage' };
    const DEVICE_DATA_KEYS = [DATA_KEYS.folders,DATA_KEYS.items,DATA_KEYS.videos,DATA_KEYS.mangaInfo,DATA_KEYS.toc,DATA_KEYS.lastPages,'mangaReaderLastUrl','mangaReaderSavedUrls','mangaReaderGithubSync','mangaReaderVaultSyncMeta'];
    const $ = (id) => document.getElementById(id);
    const ui = { email:$('accountEmail'), passphrase:$('vaultPassphrase'), recovery:$('recoveryKey'), status:$('status'), unlock:$('unlockView'), recoveryBox:$('recoveryBox'), recoveryCode:$('recoveryCode'), copy:$('copyRecoveryBtn'), logout:$('logoutBtn') };
    const readJSON = (key, fallback) => { try { const value=JSON.parse(localStorage.getItem(key)||''); return value == null ? fallback : value; } catch (_) { return fallback; } };
    const buildPayload = () => ({ folders:readJSON(DATA_KEYS.folders,[]), items:readJSON(DATA_KEYS.items,[]), videos:readJSON(DATA_KEYS.videos,[]), mangaInfo:readJSON(DATA_KEYS.mangaInfo,{}), toc:readJSON(DATA_KEYS.toc,{}), lastPages:readJSON(DATA_KEYS.lastPages,{}) });
    function applyPayload(data) {
      if (!data || !Array.isArray(data.folders) || !Array.isArray(data.items)) throw new Error('保管庫の形式が正しくありません。');
      localStorage.setItem(DATA_KEYS.folders,JSON.stringify(data.folders));
      localStorage.setItem(DATA_KEYS.items,JSON.stringify(data.items));
      localStorage.setItem(DATA_KEYS.videos,JSON.stringify(Array.isArray(data.videos) ? data.videos : []));
      localStorage.setItem(DATA_KEYS.mangaInfo,JSON.stringify(data.mangaInfo && typeof data.mangaInfo === 'object' ? data.mangaInfo : {}));
      localStorage.setItem(DATA_KEYS.toc,JSON.stringify(data.toc && typeof data.toc === 'object' ? data.toc : {}));
      localStorage.setItem(DATA_KEYS.lastPages,JSON.stringify(data.lastPages && typeof data.lastPages === 'object' ? data.lastPages : {}));
    }
    function setStatus(text) { ui.status.textContent=text || ''; }
    function goReader() { window.location.replace('reader.html'); }
    const session = MangaVault.loadSession();
    if (!session || !session.user || !session.user.email) { window.location.replace('index.html'); return; }
    ui.email.textContent=session.user.email;
    if (MangaVault.loadActive()) goReader();
    let timer = null, opening = false;
    function scheduleOpen() {
      clearTimeout(timer);
      const passphrase=ui.passphrase.value, recovery=ui.recovery.value.trim();
      if (!recovery && passphrase.length < 12) { setStatus('パスフレーズは12文字以上で入力してください。'); return; }
      timer=setTimeout(() => openAutomatically(passphrase,recovery), 650);
    }
    async function openAutomatically(passphrase,recovery) {
      if (opening) return;
      opening=true; setStatus('保管庫を確認しています…');
      try {
        const result=await MangaVault.initialize(passphrase,recovery,buildPayload,applyPayload);
        ui.passphrase.value=''; ui.recovery.value='';
        if (result.created) {
          ui.unlock.hidden=true; ui.recoveryCode.textContent=result.recoveryCode; ui.recoveryBox.hidden=false; setStatus('');
          setTimeout(goReader, 5500);
        } else { goReader(); }
      } catch (error) { setStatus(error.message || '保管庫を開けませんでした。'); }
      finally { opening=false; }
    }
    async function logout() {
      if (!confirm('ログアウトしますか？')) return;
      try { await MangaVault.withSession((token) => MangaVault.api('/auth/v1/logout',{method:'POST',token})); } catch (_) {}
      MangaVault.clearActive(); MangaVault.saveSession(null); localStorage.removeItem(MangaVault.META_KEY); DEVICE_DATA_KEYS.forEach((key)=>localStorage.removeItem(key)); window.location.replace('index.html');
    }
    ui.passphrase.addEventListener('input',scheduleOpen); ui.recovery.addEventListener('input',scheduleOpen); ui.copy.addEventListener('click',async () => { try { await navigator.clipboard.writeText(ui.recoveryCode.textContent); } catch (_) {} }); ui.logout.addEventListener('click',logout);
  })();
  </script>
</body>
</html>
