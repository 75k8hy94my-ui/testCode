<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { min-width: 340px; max-width: 380px; padding: 14px; margin: 0; }
  h1 { font-size: 16px; margin: 0 0 10px; }
  button { cursor: pointer; border: 1px solid #8885; border-radius: 8px; padding: 8px 10px; font: inherit; }
  button:disabled { opacity: .55; cursor: default; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .primary { background: #2174d2; color: white; border-color: #2174d2; }
  #status { font-size: 12px; line-height: 1.6; min-height: 2.2em; white-space: pre-wrap; }
  #items { padding: 0; max-height: 220px; overflow: auto; list-style: none; }
  #items li { padding: 8px 0; border-top: 1px solid #8884; overflow-wrap: anywhere; }
  .itemTitle { font-weight: 600; font-size: 13px; }
  .itemMeta { font-size: 12px; opacity: .8; }
</style></head><body>
<h1>testCode 漫画 JSON エクスポート</h1>
<div class="actions"><button id="capture" class="primary">このページを追加</button><button id="download">JSONを保存</button><button id="clear">一覧を消去</button></div>
<p id="status" role="status" aria-live="polite"></p>
<div id="count"></div><ul id="items"></ul>
<script src="popup.js"></script>
</body></html>
