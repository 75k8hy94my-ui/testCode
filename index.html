<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="theme-color" content="#ffffff">
  <title>ログイン</title>
  <link rel="icon" type="image/png" href="icon-152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <style>
    :root { --bg:#fff; --text:#1f2937; --line:#9ca3af; --focus:#2563eb; --danger:#dc2626; --sub:#6b7280; }
    * { box-sizing:border-box; }
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
    body { height:100dvh; color:var(--text); background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif; }
    main { position:relative; width:100%; height:100dvh; overflow:hidden; padding-top:env(safe-area-inset-top); padding-right:env(safe-area-inset-right); padding-bottom:env(safe-area-inset-bottom); padding-left:env(safe-area-inset-left); }
    header { position:absolute; top:max(22px, calc(env(safe-area-inset-top) + 14px)); left:max(28px, calc(env(safe-area-inset-left) + 18px)); }
    h1 { margin:0; font-size:clamp(24px,3vw,42px); line-height:1.1; font-weight:500; letter-spacing:.04em; white-space:nowrap; }
    #loginView { position:absolute; inset:0; }
    #loginForm { position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); width:min(62vw,720px); display:grid; gap:14px; }
    #loginForm input { display:block; width:100%; height:clamp(54px,6vw,78px); border:1.5px solid var(--line); border-radius:3px; background:#fff; color:var(--text); padding:0 18px; font:inherit; font-size:clamp(18px,2vw,26px); box-shadow:none; outline:none; }
    #loginForm input::placeholder { color:#9ca3af; opacity:.72; }
    #loginForm input:focus { border-color:var(--focus); box-shadow:0 0 0 2px rgba(37,99,235,.12); }
    #loginForm button[type="submit"] { appearance:none; width:100%; min-height:48px; border:0; border-radius:3px; background:#2563eb; color:#fff; font:inherit; font-size:16px; font-weight:600; cursor:pointer; }
    #loginForm button[type="submit"]:disabled { opacity:.55; cursor:wait; }
    #forgotRow { margin:14px 0 0; text-align:center; }
    .link-button { appearance:none; border:0; background:transparent; color:#2563eb; padding:4px 6px; font:inherit; font-size:14px; cursor:pointer; }
    .link-button:hover { text-decoration:underline; text-underline-offset:3px; }
    .status { position:absolute; left:50%; top:calc(44% + 145px); transform:translateX(-50%); width:min(62vw,720px); min-height:1.5em; color:var(--sub); line-height:1.5; font-size:13px; text-align:center; margin:0; }
    #resetView, #completeResetView { position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); width:min(62vw,720px); }
    #resetView h2, #completeResetView h2 { margin:0 0 16px; font-size:22px; font-weight:500; }
    #resetView .intro, #completeResetView .intro { margin:0 0 16px; color:var(--sub); font-size:14px; line-height:1.6; }
    #resetView form, #completeResetView form { display:grid; gap:14px; }
    #resetView label, #completeResetView label { display:none; }
    #resetView input, #completeResetView input { width:100%; height:58px; border:1.5px solid var(--line); border-radius:3px; background:#fff; color:var(--text); padding:0 16px; font:inherit; font-size:18px; outline:none; }
    #resetView button[type="submit"], #completeResetView button[type="submit"] { appearance:none; width:100%; min-height:48px; border:0; border-radius:3px; background:#2563eb; color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    #resetView .switch { text-align:center; margin:14px 0 0; }
    [hidden] { display:none!important; }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      #loginForm button[type="submit"], #resetView button[type="submit"], #completeResetView button[type="submit"] { background:#2563eb; }
    }
    @media (max-width:640px) {
      header { top:max(18px, calc(env(safe-area-inset-top) + 10px)); left:max(18px, calc(env(safe-area-inset-left) + 12px)); }
      h1 { font-size:25px; }
      #loginForm, #resetView, #completeResetView { top:42%; width:calc(100vw - 44px - env(safe-area-inset-left) - env(safe-area-inset-right)); }
      #loginForm input { height:58px; padding:0 14px; font-size:20px; }
      .status { top:calc(42% + 138px); width:calc(100vw - 44px - env(safe-area-inset-left) - env(safe-area-inset-right)); }
    }
    @media (max-height:520px) {
      #loginForm, #resetView, #completeResetView { top:54%; }
      .status { top:calc(54% + 138px); }
    }
  </style>
</head>
<body>
  <main>
    <header><h1>ログイン</h1></header>

    <div id="loginView">
      <form id="loginForm">
        <input id="loginEmail" type="email" autocomplete="email" placeholder="メールアドレス" required autofocus>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="パスワード" required>
        <button type="submit">ログイン</button>
        <p id="forgotRow"><button id="showReset" class="link-button" type="button">ログインパスワードを忘れた</button></p>
      </form>
    </div>

    <div id="resetView" hidden>
      <h2>ログインパスワードをリセット</h2>
      <p class="intro">保管庫パスフレーズや復旧キーとは別のものです。</p>
      <form id="resetForm">
        <label for="resetEmail">メールアドレス</label>
        <input id="resetEmail" type="email" autocomplete="email" placeholder="メールアドレス" required>
        <button type="submit">リセットメールを送る</button>
      </form>
      <p class="switch"><button id="resetBack" class="link-button" type="button">ログインへ戻る</button></p>
    </div>

    <div id="completeResetView" hidden>
      <h2>新しいログインパスワード</h2>
      <p class="intro">保管庫パスフレーズや復旧キーは変更されません。</p>
      <form id="completeResetForm">
        <label for="newPassword">新しいパスワード</label>
        <input id="newPassword" type="password" autocomplete="new-password" placeholder="新しいパスワード" minlength="8" required>
        <button type="submit">パスワードを更新</button>
      </form>
    </div>

    <p id="status" class="status" aria-live="polite"></p>
  </main>

  <script src="supabase-config.js"></script>
  <script>
  (() => {
    'use strict';
    const SESSION_KEY = 'mangaReaderSupabaseSession';
    const config = window.MANGA_READER_SUPABASE || {};
    const $ = (id) => document.getElementById(id);
    const ui = { loginView:$('loginView'), resetView:$('resetView'), completeResetView:$('completeResetView'), loginForm:$('loginForm'), loginEmail:$('loginEmail'), loginPassword:$('loginPassword'), resetForm:$('resetForm'), resetEmail:$('resetEmail'), completeResetForm:$('completeResetForm'), newPassword:$('newPassword'), showReset:$('showReset'), resetBack:$('resetBack'), status:$('status') };
    function setStatus(text) { ui.status.textContent = text || ''; }
    function loadSession() { try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (_) { return null; } }
    function saveSession(session) { if (session) localStorage.setItem(SESSION_KEY,JSON.stringify(session)); else localStorage.removeItem(SESSION_KEY); }
    function assertConfig() { if (!config.url || !config.publishableKey) throw new Error('Supabase の設定が見つかりません。'); }
    async function api(path, options = {}) { assertConfig(); const headers=Object.assign({apikey:config.publishableKey},options.headers || {}); if (options.token) headers.Authorization='Bearer '+options.token; if (options.body) headers['Content-Type']='application/json'; const response=await fetch(config.url+path,Object.assign({},options,{headers})); if (!response.ok) { const detail=await response.text().catch(()=>''); throw new Error('通信に失敗しました ('+response.status+')'+(detail ? '。'+detail.slice(0,140) : '')); } return response.status===204 ? null : response.json(); }
    function showLogin(message) { ui.loginView.hidden=false; ui.resetView.hidden=true; ui.completeResetView.hidden=true; ui.loginPassword.value=''; setStatus(message); }
    function showReset() { ui.loginView.hidden=true; ui.resetView.hidden=false; ui.completeResetView.hidden=true; setStatus(''); ui.resetEmail.value=ui.loginEmail.value; ui.resetEmail.focus(); }
    function goReader() { window.location.replace('reader.html'); }
    async function refreshSavedSession() { const session=loadSession(); if (!session || !session.refresh_token) return; try { const next=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:session.refresh_token})}); saveSession(next); goReader(); } catch (_) { saveSession(null); } }
    async function login(event) { event.preventDefault(); const email=ui.loginEmail.value.trim(),password=ui.loginPassword.value,button=ui.loginForm.querySelector('button[type="submit"]'); if (!email || !password) return; button.disabled=true; try { saveSession(await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})})); goReader(); } catch (error) { setStatus(error.message || 'ログインできませんでした。'); } finally { button.disabled=false; } }
    async function resetPassword(event) { event.preventDefault(); const email=ui.resetEmail.value.trim(); if(!email)return; const button=ui.resetForm.querySelector('button[type="submit"]'); button.disabled=true; try { await api('/auth/v1/recover',{method:'POST',body:JSON.stringify({email,redirect_to:location.origin+location.pathname})}); showLogin('パスワード再設定メールを送信しました。ログインパスワードを変更しても、保管庫パスフレーズや復旧キーは変更されません。'); } catch(error) { setStatus(error.message||'再設定メールを送信できませんでした。'); } finally { button.disabled=false; } }
    async function completeReset(event) { event.preventDefault(); const hash=new URLSearchParams(location.hash.replace(/^#/,'').replace(/;/g,'&')); const token=hash.get('access_token'); const password=ui.newPassword.value; if(!token||password.length<8){setStatus('8文字以上の新しいパスワードを入力してください。');return;} const button=ui.completeResetForm.querySelector('button[type="submit"]');button.disabled=true;try{await api('/auth/v1/user',{method:'PUT',token,body:JSON.stringify({password})});history.replaceState(null,'',location.pathname);showLogin('ログインパスワードを更新しました。保管庫パスフレーズは別途必要です。');}catch(error){setStatus(error.message||'パスワードを更新できませんでした。');}finally{button.disabled=false;}}
    function showCompleteReset(){ui.loginView.hidden=true;ui.resetView.hidden=true;ui.completeResetView.hidden=false;ui.newPassword.focus();setStatus('');}
    ui.showReset.addEventListener('click',showReset); ui.resetBack.addEventListener('click',() => showLogin('')); ui.loginForm.addEventListener('submit',login); ui.resetForm.addEventListener('submit',resetPassword); ui.completeResetForm.addEventListener('submit',completeReset); if(new URLSearchParams(location.hash.replace(/^#/,'')).get('type')==='recovery') showCompleteReset(); else refreshSavedSession();
  })();
  </script>
</body>
</html>
