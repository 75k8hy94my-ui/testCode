<!doctype html>
<html lang="ja" class="auth-pending">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Chat</title>
<link rel="icon" type="image/png" href="icon-152.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>
html.auth-pending body{visibility:hidden}:root{color-scheme:light;--bg:#f6f7f9;--surface:#fff;--surface2:#f1f3f6;--text:#1d1d1f;--sub:#6e6e73;--line:rgba(60,60,67,.16);--accent:#2563eb;--danger:#c2413b;--glass:rgba(248,249,252,.78);--shadow:rgba(38,42,50,.14)}html[data-theme="dark"]{color-scheme:dark;--bg:#0b0d12;--surface:#151923;--surface2:#10141c;--text:#f2f3f6;--sub:#9ca3b2;--line:rgba(255,255,255,.12);--accent:#7aa2ff;--danger:#ff8b83;--glass:rgba(25,28,35,.80);--shadow:rgba(0,0,0,.38)}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}.chatShell{min-height:100vh;width:min(100%,1100px);margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);background:var(--surface);border-left:1px solid var(--line);border-right:1px solid var(--line)}.chatSidebar{min-height:100vh;border-right:1px solid var(--line);background:var(--surface2);padding:max(14px,env(safe-area-inset-top)) 10px 16px;display:flex;flex-direction:column;gap:10px}.sidebarHead{display:flex;gap:8px}.newChatBtn,.iconBtn,.secondaryBtn,.dangerBtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:42px;font-weight:700}.newChatBtn{flex:1;text-align:left;padding:0 12px}.iconBtn{width:42px;display:grid;place-items:center}.closeSidebarBtn{display:none}.conversationList{display:flex;flex-direction:column;gap:3px;overflow:auto}.conversationItem{border:0;background:transparent;border-radius:10px;padding:10px;text-align:left;color:var(--text);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.conversationItem:hover{background:color-mix(in srgb,var(--surface) 72%,transparent)}.conversationItem.active{background:var(--surface);box-shadow:0 1px 5px var(--shadow)}.conversationTitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:650}.conversationItem small{font-size:10px;color:var(--sub)}.sidebarFoot{margin-top:auto;color:var(--sub);font-size:11px;line-height:1.5;padding:8px}.chatMain{min-width:0;min-height:100vh;position:relative;display:flex;flex-direction:column}.chatHeader{position:sticky;top:0;z-index:8;min-height:62px;padding:max(8px,env(safe-area-inset-top)) 14px 8px;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:8px;background:color-mix(in srgb,var(--surface) 88%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%)}.menuBtn{display:none}.chatTitle{font-size:15px;font-weight:760;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.modelSelect{max-width:210px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 9px;font-size:12px}.statusStrip{min-height:23px;padding:4px 20px;color:var(--sub);font-size:11px;display:flex;gap:12px;justify-content:flex-end}.syncConflict{margin:8px auto 0;width:min(calc(100% - 28px),760px);border:1px solid color-mix(in srgb,#d97706 42%,var(--line));background:color-mix(in srgb,#f59e0b 10%,var(--surface));border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:12px}.syncConflict span{flex:1}.syncConflict button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 9px;font-weight:700}.messagesWrap{flex:1;padding:18px 18px 150px}.messages{width:min(100%,760px);margin:0 auto}.emptyState{width:min(100%,650px);margin:18vh auto 0;text-align:center;color:var(--sub)}.emptyState strong{display:block;color:var(--text);font-size:28px;letter-spacing:-.035em;margin-bottom:9px}.message{padding:18px 4px;border-bottom:1px solid color-mix(in srgb,var(--line) 68%,transparent)}.messageLabel{font-size:11px;font-weight:850;letter-spacing:.05em;color:var(--sub);margin-bottom:8px}.message.user .messageLabel{color:var(--accent)}.messageContent{font-size:15px;line-height:1.78;overflow-wrap:anywhere}.messageContent p{margin:.35em 0 .9em}.messageContent h1,.messageContent h2,.messageContent h3{line-height:1.35;margin:1em 0 .5em}.messageContent h1{font-size:1.35em}.messageContent h2{font-size:1.2em}.messageContent h3{font-size:1.08em}.messageContent ul{padding-left:1.4em}.messageContent code{font-family:"SFMono-Regular",Consolas,monospace;font-size:.9em;background:var(--surface2);border-radius:5px;padding:.12em .3em}.messageContent pre{overflow:auto;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:13px}.messageContent pre code{background:transparent;padding:0;white-space:pre}.messageContent a{color:var(--accent)}.composerDock{position:fixed;z-index:7;left:calc(50% - 125px);bottom:0;width:min(calc(100% - 250px),850px);transform:translateX(-50%);padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--surface) 34%)}.composer{border:1px solid var(--line);border-radius:22px;background:var(--surface);box-shadow:0 12px 32px var(--shadow);display:flex;align-items:flex-end;gap:7px;padding:8px}.messageInput{flex:1;min-height:42px;max-height:180px;resize:none;border:0;outline:0;background:transparent;padding:10px 11px;line-height:1.45}.sendBtn,.stopBtn{width:42px;height:42px;border:0;border-radius:50%;background:var(--text);color:var(--surface);font-weight:900}.composerActions{width:min(100%,760px);margin:6px auto 0;display:flex;justify-content:flex-end;gap:7px}.composerActions button{border:0;background:transparent;color:var(--sub);font-size:11px;padding:4px 7px}.composerActions .dangerText{color:var(--danger)}.drawerBackdrop{display:none}.settingsDialog{width:min(calc(100% - 24px),520px);border:1px solid var(--line);border-radius:22px;padding:0;background:var(--surface);color:var(--text);box-shadow:0 24px 70px rgba(0,0,0,.28)}.settingsDialog::backdrop{background:rgba(0,0,0,.38);backdrop-filter:blur(3px)}.settingsForm{padding:22px}.settingsForm h2{margin:0 0 6px}.settingsForm p{color:var(--sub);font-size:12px;line-height:1.6}.settingsForm label{display:block;font-size:12px;font-weight:760;margin:15px 0 6px}.settingsForm input{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:11px}.settingsNote{font-size:11px;color:var(--sub);margin-top:5px}.settingsActions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.settingsActions button{padding:10px 14px}.primaryBtn{border:0;background:var(--accent);color:white;border-radius:11px;font-weight:760}.secondaryBtn{padding:0 12px}.dangerBtn{color:var(--danger);padding:0 12px}[hidden]{display:none!important}@media(max-width:899px){.chatShell{display:block;border:0}.chatSidebar{position:fixed;inset:0 auto 0 0;width:min(84vw,310px);z-index:30;transform:translateX(-105%);transition:transform .2s ease;box-shadow:14px 0 40px rgba(0,0,0,.25)}.chatSidebar.open{transform:translateX(0)}.closeSidebarBtn{display:grid}.drawerBackdrop{display:block;position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.32)}.menuBtn{display:grid}.chatHeader{grid-template-columns:auto minmax(0,1fr) auto auto}.modelSelect{max-width:120px}.messagesWrap{padding-left:14px;padding-right:14px}.composerDock{left:0;width:100%;transform:none;padding-left:10px;padding-right:10px}.message{padding-top:15px;padding-bottom:15px}.statusStrip{padding-left:12px;padding-right:12px}.syncConflict{flex-wrap:wrap}.syncConflict span{flex-basis:100%}}@media(prefers-reduced-motion:reduce){.chatSidebar{transition:none}}@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.chatHeader{background:var(--surface)}}
</style>
</head>
<body>
<main id="chatShell" class="chatShell">
  <aside id="chatSidebar" class="chatSidebar" aria-label="チャット履歴">
    <div class="sidebarHead"><button id="newChatBtn" class="newChatBtn" type="button">＋ 新しいチャット</button><button id="closeSidebarBtn" class="iconBtn closeSidebarBtn" type="button" aria-label="履歴を閉じる">×</button></div>
    <div id="conversationList" class="conversationList"></div>
    <div class="sidebarFoot">会話履歴と接続設定は暗号化して同期されます。</div>
  </aside>
  <section class="chatMain">
    <header class="chatHeader">
      <button id="menuBtn" class="iconBtn menuBtn" type="button" aria-label="チャット履歴">☰</button>
      <div id="chatTitle" class="chatTitle">Chat</div>
      <select id="modelSelect" class="modelSelect" aria-label="モデル"><option value="">モデル未設定</option></select>
      <button id="settingsBtn" class="iconBtn" type="button" aria-label="設定">⚙</button>
    </header>
    <div class="statusStrip"><span id="chatStatus" aria-live="polite"></span><span id="syncStatus" aria-live="polite"></span></div>
    <div id="syncConflict" class="syncConflict" hidden><span>この端末とクラウドのチャット内容が異なります。自動上書きはしていません。</span><button id="useLocalConflictBtn" type="button">この端末を使う</button><button id="useRemoteConflictBtn" type="button">クラウドを使う</button></div>
    <div class="messagesWrap"><div id="emptyState" class="emptyState"><strong>何を話しますか？</strong><span>Windows上のローカルモデルと会話します。</span></div><div id="messages" class="messages" aria-live="polite"></div></div>
    <div class="composerDock">
      <form id="composerForm" class="composer"><textarea id="messageInput" class="messageInput" rows="1" maxlength="65536" placeholder="メッセージを入力" aria-label="メッセージ"></textarea><button id="sendBtn" class="sendBtn" type="submit" aria-label="送信">↑</button><button id="stopBtn" class="stopBtn" type="button" aria-label="生成を停止" hidden>■</button></form>
      <div class="composerActions"><button id="regenerateBtn" type="button" hidden>回答を再生成</button><button id="deleteChatBtn" class="dangerText" type="button" disabled>チャットを削除</button></div>
    </div>
  </section>
</main>
<div id="drawerBackdrop" class="drawerBackdrop" hidden></div>
<dialog id="settingsDialog" class="settingsDialog">
  <form id="settingsForm" class="settingsForm" method="dialog">
    <h2>Chat API 設定</h2><p>Windows側の認証付きChat APIへ接続します。設定値は保管庫鍵で暗号化してから端末保存・同期します。</p>
    <label for="apiEndpointInput">API URL</label><input id="apiEndpointInput" type="url" autocomplete="off" spellcheck="false" placeholder="https://..." required><div class="settingsNote">このページのOrigin: <code id="currentOrigin"></code></div>
    <label for="apiKeyInput">Chat API キー</label><input id="apiKeyInput" type="password" autocomplete="off" spellcheck="false" placeholder="変更する場合のみ入力"><div id="apiKeyState" class="settingsNote"></div>
    <div class="settingsActions"><button id="settingsCancelBtn" class="secondaryBtn" type="button">キャンセル</button><button class="primaryBtn" type="submit">保存して接続</button></div>
  </form>
</dialog>
<script src="app-desktop-rail.js"></script>
<script src="supabase-config.js"></script>
<script src="vault-session.js?v=20260813-vault-state"></script>
<script src="chat-store.js"></script>
<script src="chat-sync.js"></script>
<script src="chat-markdown.js"></script>
<script src="chat-app.js"></script>
</body>
</html>
