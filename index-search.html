<style>

s:24px;background:var(--surface);box-shadow:0 14px 34px color-mix(in srgb,var(--shadow) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.23);padding:16px}.queryWrap{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:18px;background:var(--strong);padding:0 15px;min-height:56px}.queryIcon{font-size:21px;color:var(--sub)}#indexQuery{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:18px;min-width:0}.tabs{display:flex;gap:7px;overflow-x:auto;padding:13px 0 2px}.tab{min-height:36px;border-radius:999px;box-shadow:none;white-space:nowrap}.tab[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 16%,var(--strong));border-color:color-mix(in srgb,var(--accent) 36%,var(--line));color:var(--accent)}.filterRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.filterBox label,.field label{display:block;font-size:11px;font-weight:800;color:var(--sub);margin:0 0 5px}.filterBox select,.field input,.field select{width:100%;min-height:42px;border:1px solid var(--line);border-radius:12px;background:var(--strong);color:var(--text);padding:8px 10px}.filterBox select[multiple]{min-height:76px}.status{min-height:20px;color:var(--sub);font-size:12px;margin:10px 3px 0}.results{margin-top:12px}.result{padding:19px 4px;border-bottom:1px solid var(--line)}.result:first-child{padding-top:8px}.resultTitle{font-size:19px;font-weight:780;line-height:1.45;letter-spacing:-.02em}.resultType{display:inline-block;margin-left:7px;padding:3px 7px;border-radius:999px;background:color-mix(in srgb,var(--accent) 11%,transparent);color:var(--accent);font-size:10px;font-weight:800;vertical-align:2px}.source{display:flex;gap:10px;align-items:baseline;margin-top:8px;color:var(--sub);font-size:13px}.sourceBook{color:var(--text);font-weight:680}.empty{padding:45px 10px;text-align:center;color:var(--sub);line-height:1.7}.panel{margin-top:14px}.panelHeader{display:flex;justify-content:space-between;gap:12px;align-items:center}.panelHeader h2{margin:0;font-size:19px}.panelText{color:var(--sub);font-size:12px;line-height:1.6;margin:5px 0 14px}.settingGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.checkRow{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--strong);font-size:13px;font-weight:700}.checkRow input{width:18px;height:18px}.importZone{border:1px dashed color-mix(in srgb,var(--accent) 50%,var(--line));border-radius:16px;padding:15px;background:color-mix(in srgb,var(--accent) 5%,transparent)}#indexImportFiles{width:100%}.previewList,.bookList{display:grid;gap:9px;margin-top:12px}.previewCard,.bookCard{border:1px solid var(--line);border-radius:15px;background:var(--strong);padding:12px}.previewTop,.bookTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.previewTitle,.bookTitle{font-weight:800;line-height:1.4}.meta{color:var(--sub);font-size:11px;line-height:1.55;margin-top:4px}.previewError{color:var(--danger);font-size:12px;margin-top:7px}.previewControls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.previewControls input,.previewControls select{width:100%;min-height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);padding:7px 9px}.manageActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.badge{display:inline-block;padding:3px 7px;border-radius:999px;border:1px solid var(--line);color:var(--sub);font-size:10px;font-weight:750}.hidden{display:none!important}@media(max-width:700px){.top{display:block}.actions{margin-top:14px}.filterRow,.previewControls,.settingGrid{grid-template-columns:1fr}.source{display:block}.sourceBook{display:block;margin-bottom:2px}}@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glassBtn,.tab,.primary,.dangerBtn,.searchPanel,.panel{background:var(--strong)}}
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div><span class="eyebrow">LEGAL INDEX</span><h1>索引検索</h1><p class="lead">登録した教科書の事項・判例・条文索引を横断します。</p></div>
    <div class="actions"><button id="indexSettingsBtn" class="glassBtn" type="button">検索設定</button><button id="indexManageBtn" class="glassBtn" type="button">書籍管理</button></div>
  </header>

  <section class="searchPanel" aria-label="索引検索">
    <div class="queryWrap"><span class="queryIcon" aria-hidden="true">⌕</span><input id="indexQuery" type="search" autocomplete="off" spellcheck="false" placeholder="索引語・判例年月日・条文を検索"></div>
    <div class="tabs" role="tablist" aria-label="索引種別">
      <button id="kindAll" class="tab" type="button" role="tab" data-kind="all">すべて</button>
      <button id="kindMatter" class="tab" type="button" role="tab" data-kind="matter">事項</button>
      <button id="kindCase" class="tab" type="button" role="tab" data-kind="case">判例</button>
      <button id="kindStatute" class="tab" type="button" role="tab" data-kind="statute">条文</button>
    </div>
    <div class="filterRow">
      <div class="filterBox"><label for="subjectFilter">科目（複数選択可）</label><select id="subjectFilter" multiple aria-label="科目で絞り込み"></select></div>
      <div class="filterBox"><label for="bookFilter">書籍（複数選択可）</label><select id="bookFilter" multiple aria-label="書籍で絞り込み"></select></div>
    </div>
    <p id="indexStatus" class="status" aria-live="polite"></p>
  </section>

  <section id="indexSettingsPanel" class="panel hidden" aria-labelledby="settingsTitle">
    <div class="panelHeader"><h2 id="settingsTitle">検索設定</h2><button class="glassBtn" type="button" data-close-panel="settings">閉じる</button></div>
    <p class="panelText">有効にした一致方式だけを使います。複数有効時は、完全一致 → 部分一致 → AND一致 → あいまい一致の順で表示します。</p>
    <div class="settingGrid">
      <label class="checkRow"><input id="matchExact" type="checkbox">完全一致</label>
      <label class="checkRow"><input id="matchPartial" type="checkbox">部分一致</label>
      <label class="checkRow"><input id="matchAnd" type="checkbox">AND一致</label>
      <label class="checkRow"><input id="matchFuzzy" type="checkbox">あいまい一致</label>
    </div>
  </section>

  <section id="indexManagePanel" class="panel hidden" aria-labelledby="manageTitle">
    <div class="panelHeader"><h2 id="manageTitle">書籍管理</h2><button class="glassBtn" type="button" data-close-panel="manage">閉じる</button></div>
    <p class="panelText">ChatGPT / Gemini等で変換済みのJSONを読み込みます。1冊＝1ファイルです。複数ファイルを一括選択できます。各ファイルごとに「新規追加」または「既存書籍を置換」を選んでください。</p>
    <div class="importZone">
      <input id="indexImportFiles" type="file" accept="application/json,.json" multiple>
      <div id="indexImportPreview" class="previewList"></div>
      <button id="indexImportCommit" class="primary" type="button" disabled>選択した書籍を取り込む</button>
    </div>
    <div id="indexBookList" class="bookList" aria-label="登録済み書籍"></div>
  </section>

  <section id="indexResults" class="results" aria-live="polite"><div class="empty">検索語を入力してください。</div></section>
</main>
<script src="app-desktop-rail.js"></script>
<script src="supabase-config.js"></script>
<script src="vault-session.js?v=20260813-vault-state"></script>
<script src="vault-payload.js"></script>
<script src="legal-index-schema.js"></script>
<script src="legal-index-search.js"></script>
<script src="encrypted-chunk-crypto.js"></script>
<script src="encrypted-chunk-cache.js"></script>
<script src="encrypted-chunk-sync.js"></script>
<script src="index-search-page.js"></script>
</body>
</html>
