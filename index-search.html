155%)}.checkRow{display:flex;align-items:center;gap:9px;padding:8px;border-radius:9px;font-size:13px}.checkRow:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}.checkRow input{width:17px;height:17px}.statusLine{min-height:22px;margin:0 3px 10px;color:var(--sub);font-size:12px}.statusLine[data-tone="error"]{color:var(--danger)}.statusLine[data-tone="ok"]{color:var(--ok)}.statusLine[data-tone="warn"]{color:var(--warn)}.toolPanel{padding:17px;margin:0 0 13px}.toolHead{display:flex;align-items:center;justify-content:space-between;gap:12px}.toolPanel h2{font-size:18px;margin:0}.toolPanel p{font-size:12px;line-height:1.6;color:var(--sub)}.filePicker{display:block;border:1px dashed color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:15px;padding:14px;background:color-mix(in srgb,var(--accent) 5%,transparent)}#indexFiles{width:100%}.previewList,.bookList{display:grid;gap:9px;margin-top:13px}.previewRow,.bookRow{border:1px solid var(--line);border-radius:15px;padding:12px;background:color-mix(in srgb,var(--surface-strong) 68%,transparent)}.previewRow[data-invalid="true"]{border-color:color-mix(in srgb,var(--danger) 38%,var(--line))}.previewTitle,.bookTitle{font-weight:800;font-size:14px}.previewMeta,.bookMeta{font-size:11px;color:var(--sub);margin-top:4px;line-height:1.55}.previewControls{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(135px,.7fr);gap:8px;margin-top:10px}.previewControls input,.previewControls select{width:100%;min-height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface-strong);color:var(--text);padding:7px 9px}.replaceSelect{grid-column:1/-1}.panelActions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.primary{background:color-mix(in srgb,var(--accent) 18%,var(--surface-strong));color:var(--accent);border-color:color-mix(in srgb,var(--accent) 36%,var(--line))}.danger{color:var(--danger)}.settingsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px;margin-top:11px}.settingsGrid .checkRow{border:1px solid var(--line);background:color-mix(in srgb,var(--surface-strong) 55%,transparent)}.resultList{display:grid;gap:10px}.resultCard{padding:16px}.resultHead{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}.resultTitle{font-size:17px;font-weight:820;line-height:1.45;overflow-wrap:anywhere}.matchBadge{flex:none;border:1px solid var(--line);border-radius:999px;padding:4px 7px;font-size:10px;font-weight:800;color:var(--sub)}.sourceList{display:grid;gap:6px;margin-top:11px}.sourceRow{display:flex;gap:12px;justify-content:space-between;border-top:1px solid var(--line);padding-top:7px;font-size:12px}.sourceBook{font-weight:700}.sourcePages{color:var(--accent);font-weight:750;text-align:right}.emptyCard{padding:34px 18px;text-align:center;color:var(--sub);font-size:13px}.emptyCard strong{display:block;color:var(--text);font-size:17px;margin-bottom:5px}.bookRow{display:flex;justify-content:space-between;gap:12px;align-items:center}.bookActions{display:flex;gap:6px}.smallBtn{min-height:34px;border:1px solid var(--line);border-radius:10px;background:var(--surface-strong);color:var(--text);font-weight:700;padding:0 9px;cursor:pointer}.summaryCount{margin-left:4px;color:var(--accent)}[hidden]{display:none!important}.glassBtn:focus-visible,.tabBtn:focus-visible,#indexQuery:focus-visible,.smallBtn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}@media(max-width:640px){.topbar{display:block}.actions{justify-content:flex-start;margin-top:15px}.actions .glassBtn{flex:1}.searchCard{top:4px;padding:12px}.previewControls{grid-template-columns:1fr}.replaceSelect{grid-column:auto}.sourceRow{display:block}.sourcePages{text-align:left;margin-top:3px}.bookRow{align-items:flex-start}.bookActions{flex-direction:column}}@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glassBtn,.tabBtn,.searchCard,.filterMenu{background:var(--surface-strong)}.searchCard,.toolPanel,.resultCard,.emptyCard{background:var(--surface-strong)}}
</style>

<body>
<main class="indexShell">
  <header class="topbar">
    <div><span class="eyebrow">LEGAL INDEX</span><h1>索引検索</h1><p class="lead">登録した教科書の事項・判例・条文索引を、端末内で横断検索します。</p></div>
    <div class="actions">
      <button class="glassBtn" id="openImportBtn" type="button">JSONを読み込む</button>
      <button class="glassBtn" id="openBooksBtn" type="button">書籍管理</button>
      <button class="glassBtn" id="openSettingsBtn" type="button">検索設定</button>
    </div>
  </header>

  <section class="searchCard" aria-label="索引検索">
    <div class="queryWrap"><input id="indexQuery" type="search" inputmode="search" autocomplete="off" placeholder="例：債権者代位権 / H9.12.18 / 民法423条" aria-label="索引を検索"></div>
    <div id="kindTabs" class="tabs" role="tablist" aria-label="索引種別">
      <button class="tabBtn active" type="button" data-kind="all" role="tab">すべて</button>
      <button class="tabBtn" type="button" data-kind="matter" role="tab">事項</button>
      <button class="tabBtn" type="button" data-kind="case" role="tab">判例</button>
      <button class="tabBtn" type="button" data-kind="statute" role="tab">条文</button>
    </div>
    <div class="filterBar">
      <details class="filterBox"><summary>科目<span class="summaryCount" id="subjectFilterCount"></span></summary><div class="filterMenu" id="subjectFilters"></div></details>
      <details class="filterBox"><summary>書籍<span class="summaryCount" id="bookFilterCount"></span></summary><div class="filterMenu" id="bookFilters"></div></details>
    </div>
  </section>
  <p id="indexStatus" class="statusLine" aria-live="polite"></p>

  <section id="importPanel" class="toolPanel" hidden>
    <div class="toolHead"><h2>JSONを読み込む</h2><button class="smallBtn" type="button" data-close-panel>閉じる</button></div>
    <p>1冊につき1ファイルです。複数ファイルをまとめて選択できます。エラーのあるファイルは除外し、正常な本だけ登録できます。</p>
    <label class="filePicker">JSONファイルを選択<input id="indexFiles" type="file" accept="application/json,.json" multiple></label>
    <div id="importPreview" class="previewList"></div>
    <div class="panelActions"><button id="commitImportBtn" class="glassBtn primary" type="button" disabled>正常な書籍を登録</button></div>
  </section>

  <section id="settingsPanel" class="toolPanel" hidden>
    <div class="toolHead"><h2>検索設定</h2><button class="smallBtn" type="button" data-close-panel>閉じる</button></div>
    <p>一致方式を個別に切り替えられます。複数を有効にした場合は、完全一致 → 部分一致 → AND一致 → あいまい一致の順です。</p>
    <div class="settingsGrid">
      <label class="checkRow"><input id="matchExact" type="checkbox">完全一致</label>
      <label class="checkRow"><input id="matchPartial" type="checkbox">部分一致</label>
      <label class="checkRow"><input id="matchAnd" type="checkbox">AND一致</label>
      <label class="checkRow"><input id="matchFuzzy" type="checkbox">あいまい一致</label>
    </div>
  </section>

  <section id="booksPanel" class="toolPanel" hidden>
    <div class="toolHead"><h2>書籍管理</h2><button class="smallBtn" type="button" data-close-panel>閉じる</button></div>
    <p>登録済みの本を確認・削除できます。置換は「JSONを読み込む」から既存書籍を選びます。</p>
    <div id="bookManagerList" class="bookList"></div>
  </section>

  <section id="searchResults" class="resultList" aria-live="polite"></section>
</main>
<script src="app-desktop-rail.js"></script>
<script src="supabase-config.js"></script>
<script src="vault-session.js?v=20260813-vault-state"></script>
<script src="vault-payload.js"></script>
<script src="legal-index-schema.js"></script>
<script src="legal-index-search.js"></script>
<script src="encrypted-chunk-crypto.js"></script>
<script src="encrypted-chunk-cache.js"></script>
<script src="encrypted-chunk-sync.js"></script>
<script src="index-search-page.js"></script>
</body>
</html>
