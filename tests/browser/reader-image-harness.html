<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reader image pipeline browser check</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #090b10; color: #f1f2f6; font: 15px system-ui, sans-serif; }
    #topbar, #controls { position: absolute; z-index: 4; display: flex; align-items: center; gap: 10px; padding: 10px; background: #171b24; }
    #topbar { inset: 0 0 auto; }
    #controls { inset: auto 0 0; }
    #readerMeta { display: flex; gap: 12px; margin-left: auto; }
    #viewer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
    #pageStage { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; overflow: hidden; }
    body.vertical-scroll #viewer { align-items: flex-start; overflow-y: auto; }
    body.vertical-scroll #pageStage { height: auto; min-height: 100%; flex-direction: column; justify-content: flex-start; overflow: visible; }
    .readerPageFrame { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
    body.vertical-scroll .readerPageFrame { flex: 0 0 auto; height: auto; }
    .readerPageImage { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
    body.vertical-scroll .readerPageImage { max-width: 100%; max-height: 90vh; }
    .spreadCrop { position: relative; width: 50%; height: 100%; overflow: hidden; }
    .spreadCrop .readerPageImage { position: absolute; top: 0; width: 200%; height: 100%; max-width: none; }
    .spreadLeft .readerPageImage { left: -100%; }
    .spreadRight .readerPageImage { left: 0; }
    .readerVerticalSlot { width: 100%; min-height: 40vh; display: flex; justify-content: center; }
    #testReport { position: absolute; z-index: 8; inset: 60px auto auto 12px; max-width: 45vw; padding: 6px 10px; background: #102016; color: #b7f7ce; font: 12px ui-monospace, monospace; }
    #pageSlider { width: 35vw; }
    button { padding: 8px 12px; }
  </style>
</head>
<body>
  <main id="readerApp">
    <header id="topbar">
      <button id="closeBtn" type="button">閉じる</button>
      <button id="favToggleBtn" type="button" hidden>♡</button>
      <button id="safeModeBtn" type="button">セーフモード</button>
      <button id="enhanceBtn" type="button">画像補正</button>
      <button id="verticalBtn" type="button">縦スクロール</button>
      <button id="tocAddBtn" type="button">目次追加</button>
      <button id="tocBtn" type="button" hidden>目次</button>
      <div id="readerMeta"><span id="currentTitle">Test manga</span><span id="readerStatus"></span><button id="retryPageBtn" type="button" hidden>再試行</button></div>
    </header>
    <div id="viewer"><div id="pageStage"></div></div>
    <div id="readerMessage" role="status"></div>
    <output id="testReport">検証準備中</output>
    <nav id="controls">
      <button id="firstBtn" type="button">|◀</button>
      <button id="prevBtn" type="button">◀</button>
      <input id="pageSlider" type="range" min="1" max="40" value="1" aria-label="ページ">
      <span id="pageLabel">1 / 40</span>
      <button id="nextBtn" type="button">▶</button>
      <button id="lastBtn" type="button">▶|</button>
    </nav>
    <aside id="nextVolumeBanner" hidden><span id="nextVolumeText"></span><button id="nextVolumeDismissBtn">×</button><button id="nextVolumeBtn">次の巻</button></aside>
  </main>
  <script src="../../reader-image-loader.js?v=browser-check"></script>
  <script src="../../reader-image-enhancement.js"></script>
  <script src="../../reader-item-repository.js"></script>
  <script src="../../reader-runtime.js?v=browser-check"></script>
  <script src="reader-image-harness.js"></script>
</body>
</html>
