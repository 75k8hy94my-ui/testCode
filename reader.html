<!doctype html>
<html lang="ja" class="auth-pending reader-shell-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="theme-color" content="#090b10">
  <title>漫画リーダー</title>
  <style>
    :root { color-scheme: dark; --bg:#090b10; --panel:#171b24; --text:#f1f2f6; --sub:#9da3b2; --accent:#ff6b4a; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font:15px system-ui,"Yu Gothic",sans-serif; }
    html.auth-pending body { visibility:hidden; }
    #readerApp { position:relative; width:100%; height:100dvh; background:#000; }
    #topbar,#controls { position:absolute; z-index:4; display:flex; align-items:center; gap:8px; padding:8px; background:rgba(20,24,32,.92); border-color:rgba(255,255,255,.12); backdrop-filter:blur(24px) saturate(150%); -webkit-backdrop-filter:blur(24px) saturate(150%); box-shadow:0 6px 20px rgba(0,0,0,.18); transition:transform .18s ease,opacity .18s ease; }
    #topbar { inset:0 0 auto; min-height:54px; border-bottom:1px solid rgba(255,255,255,.12); }
    #readerMeta { display:flex; flex-direction:column; min-width:0; margin-left:auto; text-align:right; }
    #currentTitle { overflow:hidden; max-width:min(45vw,560px); text-overflow:ellipsis; white-space:nowrap; }
    #readerStatus { color:var(--sub); font-size:12px; }
    #retryPageBtn[hidden] { display:none; }
    .ctrlBtn { min-height:36px; padding:6px 10px; border:1px solid #424754; border-radius:9px; background:rgba(255,255,255,.08); color:var(--text); cursor:pointer; }
    .ctrlBtn[hidden],#nextVolumeBanner[hidden] { display:none; }
    #viewer { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#000; }
    #pageStage { display:flex; align-items:center; justify-content:center; width:100%; height:100%; overflow:hidden; }
    .readerPageFrame { display:flex; align-items:center; justify-content:center; width:100%; height:100%; }
    .readerPageImage { display:block; max-width:100%; max-height:100%; object-fit:contain; user-select:none; -webkit-user-drag:none; -webkit-touch-callout:none; }
    .readerVerticalSlot { width:100%; min-height:40vh; display:flex; justify-content:center; }
    .spreadCrop { position:relative; width:50%; height:100%; overflow:hidden; }
    .spreadCrop .readerPageImage { position:absolute; top:0; width:200%; height:100%; max-width:none; max-height:none; }
    .spreadRight .readerPageImage { left:0; }
    .spreadLeft .readerPageImage { left:-100%; }
    body.vertical-scroll #viewer { align-items:flex-start; overflow-y:auto; }
    body.vertical-scroll #pageStage { height:auto; min-height:100%; flex-direction:column; align-items:center; overflow:visible; }
    body.vertical-scroll .readerPageImage { width:min(100%, 960px); height:auto; max-height:none; margin-inline:auto; }
    body.safe-mode .readerPageImage,body.safe-mode .encryptedAssetHost img { filter:blur(12px); transform:scale(1.08); }
    body.image-enhance .readerPageImage:not([data-local-enhanced="true"]) { filter:contrast(1.12) brightness(1.04) saturate(.96); }
    #controls { inset:auto 0 0; min-height:52px; border-top:1px solid rgba(255,255,255,.12); }
    body.reader-chrome-hidden #topbar { transform:translateY(-105%); opacity:0; pointer-events:none; }
    body.reader-chrome-hidden #controls { transform:translateY(105%); opacity:0; pointer-events:none; }
    #pageSlider { flex:1; min-width:50px; accent-color:var(--accent); }
    #nextVolumeBanner { position:absolute; z-index:5; right:14px; bottom:68px; display:flex; gap:10px; align-items:center; padding:10px; border-radius:12px; background:rgba(23,27,36,.94); }
    #nextVolumeText { max-width:45vw; }
    #readerMessage { position:absolute; z-index:3; left:50%; top:50%; transform:translate(-50%,-50%); max-width:90vw; color:var(--sub); text-align:center; }
    @media(max-width:700px) { #topbar { gap:4px; padding:6px; } .ctrlBtn { padding:5px 7px; font-size:12px; } #readerMeta { max-width:35vw; } #nextVolumeBanner { left:8px; right:8px; bottom:64px; } }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { #topbar,#controls { background:rgba(20,24,32,.98); } }
  </style>
</head>
<body>
  <main id="readerApp" aria-label="漫画リーダー">
    <header id="topbar">
      <button class="ctrlBtn" id="closeBtn" type="button" aria-label="本棚に戻る">閉じる</button>
      <button class="ctrlBtn" id="favToggleBtn" type="button" aria-label="お気に入りを切り替える" hidden></button>
      <button class="ctrlBtn" id="safeModeBtn" type="button">セーフモード</button>
      <button class="ctrlBtn" id="enhanceBtn" type="button" aria-pressed="false">画像補正</button>
      <button class="ctrlBtn" id="verticalBtn" type="button">縦スクロール</button>
      <button class="ctrlBtn" id="tocAddBtn" type="button">目次追加</button>
      <button class="ctrlBtn" id="tocBtn" type="button" hidden>目次</button>
      <div id="readerMeta"><span id="currentTitle">読み込み中…</span><span id="readerStatus"></span><button class="ctrlBtn" id="retryPageBtn" type="button" hidden>再試行</button></div>
    </header>
    <section id="viewer" aria-label="ページ表示"><div id="pageStage"></div></section>
    <div id="readerMessage" role="status" aria-live="polite"></div>
    <nav id="controls" aria-label="ページ操作">
      <button class="ctrlBtn" id="firstBtn" type="button" aria-label="最初のページ">|◀</button>
      <button class="ctrlBtn" id="prevBtn" type="button" aria-label="前のページ">◀</button>
      <input id="pageSlider" type="range" min="1" max="1" value="1" aria-label="ページ">
      <span id="pageLabel">1 / 1</span>
      <button class="ctrlBtn" id="nextBtn" type="button" aria-label="次のページ">▶</button>
      <button class="ctrlBtn" id="lastBtn" type="button" aria-label="最後のページ">▶|</button>
    </nav>
    <aside id="nextVolumeBanner" hidden><span id="nextVolumeText"></span><button class="ctrlBtn" id="nextVolumeDismissBtn" type="button" aria-label="閉じる">×</button><button class="ctrlBtn" id="nextVolumeBtn" type="button">次の巻を読む</button></aside>
  </main>

  <script src="supabase-config.js"></script>
  <script src="vault-session.js?v=20261003-session-lock"></script>
  <script src="browser-storage.js"></script>
  <script src="reader-target.js?v=20261003-reader-launch-contract"></script>
  <script src="vault-payload.js"></script>
  <script src="feature-flags.js"></script>
  <script src="media-access-gate.js?v=20260926-non-jp-vpn"></script>
  <script src="encrypted-asset-crypto.js"></script>
  <script src="encrypted-asset-cache.js"></script>
  <script src="encrypted-asset-backend.js"></script>
  <script src="encrypted-asset-storage.js"></script>
  <script src="image-transfer-settings.js"></script>
  <script src="image-transfer-ledger.js"></script>
  <script src="image-remote-access.js"></script>
  <script src="encrypted-asset-sync.js"></script>
  <script src="encrypted-asset-reader.js"></script>
  <script src="encrypted-asset-item.js"></script>
  <script src="reader-image-enhancement.js"></script>
  <script src="reader-image-loader.js?v=20261004-reader-image-pipeline"></script>
  <script src="reader-item-repository.js"></script>
  <script src="reader-runtime.js?v=20261003-reader-ui-spa"></script>
  <script>
    window.MangaReaderBootPromise = (async () => {
      const sessionKey = 'mangaReaderSupabaseSession';
      const showLogin = () => window.location.replace('index.html');
      const showVault = () => window.location.replace('sync.html');
      const hasSession = () => { try { const session = JSON.parse(localStorage.getItem(sessionKey) || 'null'); return !!(session && session.refresh_token); } catch (_) { return false; } };
      const config = window.MANGA_READER_SUPABASE || {};
      if (!hasSession() || !config.url || !config.publishableKey) { showLogin(); return false; }
      if (!window.MangaVault) { showVault(); return false; }
      let active = MangaVault.loadActive();
      if (!active && typeof MangaVault.waitForActive === 'function') active = await MangaVault.waitForActive(2500);
      if (!active) { showVault(); return false; }
      let timer;
      try {
        await Promise.race([MangaVault.ensureSession(), new Promise((_, reject) => { timer = setTimeout(() => reject(new Error('session check timed out')), 5000); })]);
      } catch (error) {
        if (MangaVault.isSessionAuthError?.(error)) MangaVault.saveSession(null);
        showLogin(); return false;
      } finally { clearTimeout(timer); }
      document.documentElement.classList.remove('auth-pending');
      return true;
    })();
  </script>
  <script>
    (async () => {
      if (!await window.MangaReaderBootPromise) return;
      const itemId = window.MangaReaderTarget.itemIdFromLocation(location);
      const repository = ReaderItemRepositoryFactory.create({
        readItems() { try { const values = JSON.parse(localStorage.getItem('mangaReaderSavedItems') || '[]'); return Array.isArray(values) ? values : []; } catch (_) { return []; } },
        writeItems(items) { return MangaReaderStorage.safeWriteJson('mangaReaderSavedItems', items); },
        scheduleSync() {
          clearTimeout(window.__readerVaultSyncTimer);
          window.__readerVaultSyncTimer = setTimeout(() => {
            try { const payload = MangaVaultPayload.buildFromLocalStorage(); MangaVault.savePayload(payload).catch((error) => { document.getElementById('readerStatus').textContent = error?.message || '同期に失敗しました'; }); } catch (error) { document.getElementById('readerStatus').textContent = error?.message || '同期に失敗しました'; }
          }, 5000);
        },
      });
      let launchStorage = null;
      try { launchStorage = window.sessionStorage; } catch (_) {}
      const runtime = ReaderRuntimeFactory.create({ repository, target: MangaReaderTarget, sessionStorage: launchStorage, location, document, window });
      window.MangaReaderRuntime = runtime;
      if (!itemId) { runtime.close(); return; }
      const item = await runtime.start(itemId);
      if (item) document.getElementById('readerMessage').textContent = '';
    })().catch((error) => { const message = document.getElementById('readerMessage'); if (message) message.textContent = error?.message || 'Readerを起動できませんでした'; });
  </script>
</body>
</html>
