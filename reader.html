    readingGeneration++; // invalidate any still-running sequential detection loop
    baseUrl = '';
    currentResumeKey = 'custom:' + item.id;
    currentlyCustom = true;
    splitSpreads = !!item.splitSpreads;
    loadCurrentToc();
    hideNextVolumeBanner();
    try {
      pages = await loadPrivateLocalPages(item);
    } catch (error) {
      pages = [];
      els.spinner.style.display = 'none';
      els.imgWrap.style.display = 'none';
      els.placeholder.style.display = 'block';
      els.placeholder.textContent = error.message || '同期画像を読み込めませんでした。';
      els.status.textContent = '';
      updateCloseButtonVisibility();
      return;
    }
    detecting = false;
    detectionDone = true;
    detectionHitLimit = false;
    currentPage = 1;
    pendingResumePage = getResumePage(currentResumeKey);

    els.currentTitle.textContent = itemDisplayTitle(item);
    updateFavToggleButton();
    try { localStorage.setItem(LAST_URL_KEY, JSON.stringify({ kind: 'item', itemId: item.id })); } catch (e) {}

    if (!pages.length) {
      els.spinner.style.display = 'none';
      els.imgWrap.style.display = 'none';
      els.placeholder.style.display = 'block';
      els.placeholder.textContent = 'このアイテムにはページがありません。';
      els.status.textContent = '';
      updateCloseButtonVisibility();
      return;
    }

    if (!switchDirection) {
      els.placeholder.style.display = 'none';
      els.spinner.style.display = 'none';
    }
    els.imgWrap.style.display = 'block';
    els.controls.style.display = 'flex';
    const startPage = pendingResumePage || 1;
    pendingResumePage = null;
    showPage(startPage, switchDirection === 'up' ? 'swipeUp' : switchDirection === 'down' ? 'swipeDown' : switchDirection === 'left' ? 'swipeLeft' : switchDirection === 'right' ? 'swipeRight' : null);
    updateStatus();
    updateCloseButtonVisibility();
  }

  // Single entry point for opening a saved item, regardless of whether it's
  // a normal 連番ベースURL manga or a custom (explicit page list) manga
  // added via the 個別追加 dialog. Use this (not startReading
  // directly) for anything that opens an *item* object rather than a raw
  // typed-in URL.
  async function openItem(item, addToHistoryFlag, switchDirection) {
    recentlyClosedItemId = null;
    currentItem = item || null; // remembered for series/次の巻 lookups
    if (item && Array.isArray(item.pages) && item.pages.length) {
      startReadingCustom(item, switchDirection);
    } else {
      const candidates = [item && item.url].concat(Array.isArray(item && item.alternateUrls) ? item.alternateUrls : []).filter(Boolean);
      let selectedUrl = item && item.url;
      if (candidates.length > 1) {
        try {
          selectedUrl = await Promise.any(candidates.map(async (candidate) => {
            const first = await preloadFirstPage(candidate, item.numberWidth, candidate === item.url ? item.pagePattern : null);
            if (!first) throw new Error('unavailable');
            return candidate;
          }));
        } catch (e) {}
        if (currentItem !== item) return;
        if (selectedUrl && selectedUrl !== item.url) {
          item.alternateUrls = Array.from(new Set([item.url].concat(item.alternateUrls || []).filter((url) => url && url !== selectedUrl)));
          item.url = selectedUrl;
          persistItems();
        }
      }
      startReading(selectedUrl, addToHistoryFlag, switchDirection);
    }
  }

  // 表示中の漫画を閉じて、ビューアを「何も開いていない」状態に戻す。進行中の
  // ページ検出があれば readingGeneration を進めて無効化し、次回再読み込みでも
  // 閉じた漫画が復元されないよう LAST_URL_KEY も消す。何も開いていない状態に
  // なるので、リスト（保存したURL）を自動的に開く。
  function closeManga() {
    const returnView = readerReturnView;
    const closingItem = getCurrentItem();
    recentlyClosedItemId = closingItem ? closingItem.id : null;
    readerReturnView = null;
    // ここでpages/baseUrlがリセットされる前に、検出未完了分の引き継ぎを行う。
    handOffIncompleteDetection();
    readingGeneration++;
    clearLocalSyncObjectUrls();
    baseUrl = '';
    pages = [];
    splitSpreads = false;
    pageNumberWidth = 1;
    currentResumeKey = '';
    currentlyCustom = false;
    currentItem = null;
    currentToc = [];
    detecting = false;
    detectionDone = false;
    detectionHitLimit = false;
    clearReadingListContext();
    hideNextVolumeBanner();

    els.spinner.style.display = 'none';
    els.imgWrap.style.display = 'none';
    els.controls.style.display = 'none';
    releaseLocalEnhancements(els.pageStage);
    els.pageStage.innerHTML = '';
    els.placeholder.style.display = 'none';
    els.placeholder.innerHTML = '';
    els.status.textContent = '';
    els.currentTitle.textContent = '';
    updateFavToggleButton();
    updateCloseButtonVisibility();
    updateTocButtonVisibility();
    try { localStorage.removeItem(LAST_URL_KEY); } catch (e) {}

    // 本棚から開いた作品は、閉じたときにそのフォルダ／スマートリストへ戻す。
    // 新規URLや起動時のように閲覧元がない場合は、従来どおり本棚の先頭を表示する。
    if (returnView) {
      currentFolderView = returnView.folderId;
      currentSeriesView = returnView.seriesName;
      currentAuthorView = returnView.authorName || null;
      reorderMode = false;
      openSavedList(true, true);
    } else {
      openSavedList(true);
    }
  }

  function updateStatus() {
    if (detecting) {
      els.status.textContent = '検出中... ' + displayedPageCount() + 'ページ確認済み';
    } else if (detectionHitLimit) {
      els.status.textContent = displayedPageCount() + 'ページ以上（検出上限）';
    } else if (detectionDone) {
      els.status.textContent = '全 ' + displayedPageCount() + ' ページ';
    }
  }

  function flashStatus(msg) {
    els.status.textContent = msg;
    setTimeout(updateStatus, 1500);
  }

  // ---------- page rendering / navigation ----------
  function styleImg(img) {
    const mode = fitModes[fitIndex];
    img.style.maxWidth = '100%';
    img.style.maxHeight = '';
    img.style.width = '';
    img.style.height = '';
    img.style.objectFit = '';
    if (mode === 'fit-contain') {
      // Topbar/controls float on top of the viewer (not beside it), so the
      // image can always use the full viewport height; hiding the bars
      // reveals more of the image instead of leaving blank space.
      img.style.maxHeight = '100vh';
      img.style.width = 'auto';
      img.style.height = 'auto';
      img.style.objectFit = 'contain';
    } else if (mode === 'fit-width') {
      img.style.width = '100%';
      img.style.height = 'auto';
    } else { // fit-height
      img.style.height = '100vh';
      img.style.width = 'auto';
    }
  }

  function makeImgFromUrl(url, alt, splitHalf) {
    const img = document.createElement('img');
    img.className = 'pageimg';
    img.alt = alt || '';
    img.fetchPriority = 'high'; // this is the slide actually being shown — outrank any background preload() still in flight for other pages
    img.src = url;
    if (!splitHalf) {
      styleImg(img);
      return { node: img, img: img };
    }

    const crop = document.createElement('div');
    crop.className = 'spreadCrop';
    crop.appendChild(img);
    const layout = () => {
      if (!img.naturalWidth || !img.naturalHeight) return;
      const mode = fitModes[fitIndex];
      const width = window.innerWidth, height = window.innerHeight;
      const scale = mode === 'fit-width'
        ? (width * 2) / img.naturalWidth
        : mode === 'fit-height'
          ? height / img.naturalHeight
          : Math.min((width * 2) / img.naturalWidth, height / img.naturalHeight);
      const fullWidth = Math.max(1, Math.round(img.naturalWidth * scale));
      const fullHeight = Math.max(1, Math.round(img.naturalHeight * scale));
      crop.style.width = Math.ceil(fullWidth / 2) + 'px';
      crop.style.height = fullHeight + 'px';
      img.style.width = fullWidth + 'px';
      img.style.height = fullHeight + 'px';
      img.style.left = splitHalf === 'right' ? -Math.ceil(fullWidth / 2) + 'px' : '0';
    };
    img.addEventListener('load', layout, { once: true });
    if (img.complete) layout();
    return { node: crop, img: img };
  }
  function makeImg(pNum) {
    return makeImgFromUrl(sourceUrlForPage(pNum), 'page ' + pNum, splitHalfForPage(pNum));
  }
  // Builds a detached .pageSlide (not yet attached to the DOM) wrapping a
  // single image at the given URL. Used by the live-drag controller to show
  // a neighbor page/manga sliding in alongside the current one — unlike
  // renderPage(), this doesn't wait for the load event, since by drag time
  // the URL has almost always already been preloaded into the browser
  // cache (see preloadAdjacentManga/preload), so it paints immediately.
  function makeSlide(url, splitHalf) {
    const slide = document.createElement('div');
    slide.className = 'pageSlide';
    slide.appendChild(makeImgFromUrl(url, '', splitHalf).node);
    return slide;
  }

  // 'next'/'prev' are horizontal page turns within the same manga.
  // 'swipeUp'/'swipeDown' are vertical manga switches (一覧 swipe), entering
  // and exiting along Y instead of X — same crossfade-and-slide mechanism,
  // different axis, so it actually reads as a swipe instead of a hard cut.
  const DIR_TRANSFORMS = {
    next:      { enter: 'translateX(100%)',  exit: 'translateX(-100%)' },
    prev:      { enter: 'translateX(-100%)', exit: 'translateX(100%)' },
    swipeUp:   { enter: 'translateY(100%)',  exit: 'translateY(-100%)' },
    swipeDown: { enter: 'translateY(-100%)', exit: 'translateY(100%)' },
    pageUp:    { enter: 'translateY(100%)',  exit: 'translateY(-100%)' },
    pageDown:  { enter: 'translateY(-100%)', exit: 'translateY(100%)' },
    swipeLeft: { enter: 'translateX(100%)',  exit: 'translateX(-100%)' },
    swipeRight:{ enter: 'translateX(-100%)', exit: 'translateX(100%)' },
  };

  function nextPaint() {
    return new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  }

  async function waitForImageReady(img) {
    if (!img.complete) {
      await new Promise((resolve, reject) => {
        img.addEventListener('load', resolve, { once: true });
        img.addEventListener('error', reject, { once: true });
      });
    }
    if (!img.naturalWidth) throw new Error('画像を読み込めませんでした');
    if (typeof img.decode === 'function') {
      try { await img.decode(); } catch (e) { /* Safari may reject even when the loaded image is drawable. */ }
    }
    await nextPaint();
  }

  // Renders page n into the stage, but only once its image has actually
  // finished loading. Until then, whatever was previously on screen stays
  // visible instead of being replaced by a blank/black frame. If the page
  // changes again before this one finishes loading, the stale result is
  // dropped (latestRenderId guard) so a slow load can't clobber a newer page.
  function renderPage(n, direction) {
    if (verticalScrollEnabled) { renderVerticalPages(n); return; }
    if (suppressNextRenderAnim) {
      direction = null; // the live drag already animated this transition visually
      suppressNextRenderAnim = false;
    }
    const myId = ++latestRenderId;
    const targetUrl = sourceUrlForPage(n);
    const visual = makeImg(n);
    const img = visual.img;

    const doRender = () => {
      if (myId !== latestRenderId) return;

      preloadedPageUrls.add(targetUrl);

      const newSlide = document.createElement('div');
      newSlide.className = 'pageSlide';
      newSlide.appendChild(visual.node);

      const prevSlide = els.pageStage.querySelector('.pageSlide.current');
      const t = direction && DIR_TRANSFORMS[direction];

      if (animEnabled && t && prevSlide) {
        newSlide.style.transform = t.enter;
        els.pageStage.appendChild(newSlide);
        prevSlide.classList.remove('current');
        void newSlide.offsetWidth; // force layout before animating
        newSlide.style.transition = 'transform ' + ANIM_DURATION + 'ms ease';
        prevSlide.style.transition = 'transform ' + ANIM_DURATION + 'ms ease';
        requestAnimationFrame(() => {
          newSlide.style.transform = 'translate(0, 0)';
          prevSlide.style.transform = t.exit;
        });
        newSlide.classList.add('current');
        setTimeout(() => {
          if (prevSlide.parentNode) {
            releaseLocalEnhancements(prevSlide);
            prevSlide.parentNode.removeChild(prevSlide);
          }
        }, ANIM_DURATION + 60);
      } else {
        releaseLocalEnhancements(els.pageStage);
        els.pageStage.innerHTML = '';
        newSlide.classList.add('current');
        els.pageStage.appendChild(newSlide);
      }
      if (imageEnhanceEnabled && !safeModeEnabled) enhanceImageElement(img);
    };

    waitForImageReady(img).then(doRender).catch(() => {
      if (myId === latestRenderId) flashStatus('画像を読み込めませんでした');
    });
  }

  function renderVerticalPages(targetPage) {
    els.imgWrap.classList.add('vertical-scroll');
    els.pageStage.classList.add('vertical-scroll');
    releaseLocalEnhancements(els.pageStage);
    els.pageStage.innerHTML = '';
    const fragment = document.createDocumentFragment();
    for (let page = 1; page <= displayedPageCount(); page++) {
      const slide = document.createElement('div');
      slide.className = 'pageSlide vertical-page' + (page === targetPage ? ' current' : '');
      slide.dataset.page = String(page);
      const visual = makeImg(page);
      visual.img.loading = 'lazy';
      visual.img.fetchPriority = page === targetPage ? 'high' : 'low';
      slide.appendChild(visual.node);
      fragment.appendChild(slide);
    }
    els.pageStage.appendChild(fragment);
    requestAnimationFrame(() => {
      const target = els.pageStage.querySelector('[data-page="' + targetPage + '"]');
      if (target) els.pageStage.scrollTop = Math.max(0, target.offsetTop - 8);
      updateVerticalCurrentPage();
    });
  }

  function updateVerticalCurrentPage() {
    if (!verticalScrollEnabled) return;
    const stageTop = els.pageStage.getBoundingClientRect().top;
    let closest = null, distance = Infinity;
    els.pageStage.querySelectorAll('.vertical-page').forEach((slide) => {
      const distanceFromTop = Math.abs(slide.getBoundingClientRect().top - stageTop - 8);
      if (distanceFromTop < distance) { distance = distanceFromTop; closest = slide; }
    });
    if (!closest) return;
    const page = Number(closest.dataset.page) || 1;
    currentPage = page;
    if (currentPage < displayedPageCount()) hideNextVolumeBanner();
    else updateNextVolumeBanner();
    els.pageStage.querySelectorAll('.vertical-page.current').forEach((slide) => slide.classList.remove('current'));
    closest.classList.add('current');
    updateSlider();
    persistLastPage();
  }

  function updateSlider() {
    const count = displayedPageCount();
    els.pageSlider.max = Math.max(count, currentPage);
    els.pageSlider.value = currentPage;
    const totalLabel = detectionDone ? count : count + '+';
    els.pageLabel.textContent = currentPage + ' / ' + totalLabel;
    const progress = count > 1 ? ((currentPage - 1) / (count - 1)) * 100 : 0;
    els.readProgressBar.style.width = Math.max(0, Math.min(100, Math.round(progress))) + '%';
  }

  const preloadedPageUrls = new Set(); // URLs that have actually finished downloading — never re-fetch these
  const inFlightPreloads = new Map(); // url -> Image still in flight, so a stale one can be aborted (see pruneStalePreloads)
  function preload(pageNum) {
    if (pageNum >= 1 && pageNum <= displayedPageCount()) {
      const url = sourceUrlForPage(pageNum);
      if (preloadedPageUrls.has(url) || inFlightPreloads.has(url)) return;
      const img = new Image();
      img.fetchPriority = 'low'; // de-prioritize vs. the actually-visible page's own load (see makeImgFromUrl)
      inFlightPreloads.set(url, img);
      img.addEventListener('load', async () => {
        if (typeof img.decode === 'function') {
          try { await img.decode(); } catch (e) {}
        }
        await nextPaint();
        inFlightPreloads.delete(url);
        preloadedPageUrls.add(url);
      });
      img.addEventListener('error', () => { inFlightPreloads.delete(url); }); // allow a later retry instead of giving up forever
      img.src = url;
    }
  }

  // Cancels any preload still in flight for a URL that's no longer within
  // the current preload window (e.g. the user advanced several pages, or
  // jumped, since that preload was kicked off). Setting .src = '' triggers
  // the spec's "abort the image request" steps, freeing up one of the
  // browser's limited per-host connections — without this, requests for
  // pages the user has already scrolled past kept competing for bandwidth
  // with the page actually on screen now, which is what made it feel like
  // the *previous* page's preloading had to finish first.
  function pruneStalePreloads(neededUrls) {
    inFlightPreloads.forEach((img, url) => {
      if (!neededUrls.has(url)) {
        img.src = '';
        inFlightPreloads.delete(url);
      }
    });
  }

  // The set of page URLs that should still be considered "wanted" once the
  // current page becomes n — the page itself plus the same look-ahead/back
  // window preload()/showPage() already maintain. Anything in flight outside
  // this set is safe to cancel.
  function preloadWindowUrls(n) {
    const wanted = new Set();
    const count = displayedPageCount();
    if (n >= 1 && n <= count) wanted.add(sourceUrlForPage(n));
    for (let i = 1; i <= PRELOAD_AHEAD_COUNT; i++) {
      if (n + i >= 1 && n + i <= count) wanted.add(sourceUrlForPage(n + i));
    }
    if (n - 1 >= 1 && n - 1 <= count) wanted.add(sourceUrlForPage(n - 1));
    return wanted;
  }

  // Resolved URL of the page right after/before the one on screen, if known
  // yet — used by the live horizontal drag to build its neighbor slide. The
  // existing preload() calls in showPage() already keep a few pages ahead
  // warmed in the browser cache, so by drag time these are normally instant.
  function nextPageNeighborUrl() { return currentPage < displayedPageCount() ? sourceUrlForPage(currentPage + 1) : null; }
  function prevPageNeighborUrl() { return currentPage > 1 ? sourceUrlForPage(currentPage - 1) : null; }

  // Whether a URL has actually finished downloading into the browser's
  // cache already — as opposed to merely having a preload() request fired
  // for it at some point. Setting .src on a fresh <img> makes .complete turn
  // true in the same tick when (and only when) the resource is already
  // sitting in cache; naturalWidth additionally guards against a cached
  // broken/404 response reporting "complete" with nothing to show. Used to
  // make the live drag wait for a real load instead of dragging in a
  // blank/black slide that only fills in once the network catches up.
  function isUrlLoaded(url) {
    return preloadedPageUrls.has(url);
  }

  function showPage(n, forceDirection) {
    if (!pages.length) return;
    if (n < 1) n = 1;
    if (n > displayedPageCount()) n = displayedPageCount();
    const hasCurrent = !!els.pageStage.querySelector('.pageSlide');
    const pageChanged = hasCurrent && n !== currentPage;
    const direction = forceDirection || (!hasCurrent ? null : (n > currentPage ? 'next' : (n < currentPage ? 'prev' : null)));
    currentPage = n;
    pruneStalePreloads(preloadWindowUrls(n));
    renderPage(n, direction);
    updateSlider();
    for (let i = 1; i <= PRELOAD_AHEAD_COUNT; i++) preload(n + i);
    preload(n - 1);
    persistLastPage();
    markCurrentItemReadIfEligible();
    nextVolumeDismissed = false;
    updateNextVolumeBanner();
    // A real page turn should leave the image unobstructed. Initial opening
    // and resume jumps keep the controls visible so the reader remains clear.
    if (pageChanged) hideBars();
  }

  // Instant, non-animated jump used when resuming to a saved page on load.
  function jumpToPage(n) {
    if (!pages.length) return;
    if (n < 1) n = 1;
    if (n > displayedPageCount()) n = displayedPageCount();
    currentPage = n;
    pruneStalePreloads(preloadWindowUrls(n));
    renderPage(n, null);
    updateSlider();
    for (let i = 1; i <= PRELOAD_AHEAD_COUNT; i++) preload(n + i);
    preload(n - 1);
    persistLastPage();
    markCurrentItemReadIfEligible();
    nextVolumeDismissed = false;
    updateNextVolumeBanner();
  }

  function nextPage() { if (currentPage < displayedPageCount()) showPage(currentPage + 1); }
  function prevPage() { if (currentPage > 1) { hideNextVolumeBanner(); showPage(currentPage - 1); } }
  function goFirst() { showPage(1); }
  function goLast() { showPage(displayedPageCount()); }

  function refreshCurrentView() {
    if (pages.length) renderPage(currentPage, null);
  }

  function toggleBars() {
    els.topbar.classList.toggle('hidden');
    els.controls.classList.toggle('hidden');
  }

  function hideBars() {
    els.topbar.classList.add('hidden');
    els.controls.classList.add('hidden');
  }

  function toggleAnim() {
    animEnabled = !animEnabled;
    els.animBtn.classList.toggle('active', animEnabled);
    persistAnim();
  }

  // ---------- vertical swipe in reader: jump to next/prev manga in list ----------
  function goToReadingListOffset(offset) {
    if (!readingListItems.length) return; // opened without folder/feed context; nothing to swipe to
    const newIndex = readingListIndex + offset;
    if (newIndex < 0 || newIndex >= readingListItems.length) {
      flashStatus(offset > 0 ? 'これが最後の作品です' : 'これが最初の作品です');
      return;
    }
    readingListIndex = newIndex;
    preloadAdjacentManga();
    const item = readingListItems[newIndex];
    // offset > 0 (swiped up, moving to the next item) slides the new page in
    // from the bottom; offset < 0 (swiped down, previous item) from the top.
    // openItem dispatches to startReading or startReadingCustom depending on
    // whether this item has a fixed (explicit page-list) page list.
    openItem(item, false, verticalScrollEnabled ? (offset > 0 ? 'left' : 'right') : (offset > 0 ? 'up' : 'down'));
  }

  // ---------- live drag (TikTok-style connected swipe) ----------
  // Both axes share one drag controller: horizontal drags turn pages within
  // the current manga, vertical drags step through readingListItems (the
  // folder/feed the reader was opened from). While dragging, the current
  // page and the neighbor page/manga slide together 1:1 with the finger —
  // they're rigidly "attached" like a filmstrip, so it reads as one
  // continuous strip of content rather than a page flipping in place. On
  // release, the drag either finishes the transition (if dragged far or
  // fast enough) or springs back. This only runs when animEnabled is true;
  // with animations off, the legacy "decide-at-release, no live preview"
  // behavior below is used instead (cheaper, no DOM churn mid-drag).
  let touchStartX = 0, touchStartY = 0, touchActive = false;
  let dragAxis = null;       // null | 'x' | 'y' — locked once the gesture's dominant axis is clear
  let dragInfo = null;       // { kind:'page'|'manga', dir, offset?, blocked?, reason? }
  let dragCurrentSlide = null;
  let dragNeighborSlide = null;
  let lastMoveX = 0, lastMoveY = 0, lastMoveTime = 0;
  let dragRafId = null;       // pending requestAnimationFrame id for the coalesced style write below, or null
  let pendingDragDelta = 0;   // latest dx (axis 'x') or dy (axis 'y') waiting to be applied on the next frame
  const VERTICAL_SWIPE_THRESHOLD = 60; // px — legacy-mode commit distance, and the "did they really mean it" gate for the boundary flash message in blocked drags
  const AXIS_LOCK_PX = 10;          // px of movement before committing to horizontal vs vertical
  const DRAG_COMMIT_FRACTION = 0.22; // must drag past 22% of the viewport dimension to commit (if not flicked)
  const DRAG_FLING_VELOCITY = 0.55;  // px/ms — a fast flick commits even with little travel distance
  const DRAG_FLING_MIN_PX = 24;      // minimum travel before a "fling" is trusted (filters out jitter)
  const RUBBER_BAND_FACTOR = 0.3;    // damping applied when dragging past a boundary (no neighbor to show)
  const MIN_DRAG_ANIM_MS = 80;

  function resetDragState() {
    if (dragRafId !== null) { cancelAnimationFrame(dragRafId); dragRafId = null; }
    dragAxis = null;
    dragInfo = null;
    dragCurrentSlide = null;
    dragNeighborSlide = null;
  }

  // touchmove can fire faster than the screen actually repaints; writing
  // style.transform synchronously on every single event does work that never
  // gets to show up on screen. This coalesces same-frame moves into one
  // style write via rAF, applying only the most recent dx/dy once per frame.
  function scheduleDragFrame(axis, delta) {
    pendingDragDelta = delta;
    if (dragRafId !== null) return;
    dragRafId = requestAnimationFrame(() => {
      dragRafId = null;
      if (axis === 'x') updateDragX(pendingDragDelta); else updateDragY(pendingDragDelta);
    });
  }

  function beginDrag(axis, dx, dy) {
    const current = els.pageStage.querySelector('.pageSlide.current');
    if (!current) return; // nothing on screen to drag (e.g. spinner) — dragAxis stays null, caller bails
    dragCurrentSlide = current;
    dragCurrentSlide.style.transition = 'none';
    dragAxis = axis;
    const pageAxis = verticalScrollEnabled ? 'y' : 'x';
    if (axis === pageAxis) {
      const pageDelta = axis === 'x' ? dx : dy;
      const dir = pageDelta < 0 ? 'next' : 'prev';
      const url = dir === 'next' ? nextPageNeighborUrl() : prevPageNeighborUrl();
      if (!url) { dragInfo = { kind: 'page', dir, blocked: true }; return; }
      if (!isUrlLoaded(url)) {
        // It's not actually downloaded yet (preload() may still be in
        // flight) — drag this like a blocked boundary (rubber-band, no page
        // change) instead of sliding in a slide that's still blank, which is
        // what was causing the momentary black flash. The background
        // preload keeps running, so the very next swipe attempt finds it
        // ready.
        dragInfo = { kind: 'page', dir, blocked: true, reason: 'loading' };
        return;
      }
      dragInfo = { kind: 'page', dir };
      dragNeighborSlide = makeSlide(url, splitHalfForPage(dir === 'next' ? currentPage + 1 : currentPage - 1));
      dragNeighborSlide.style.transform = axis === 'x'
        ? (dir === 'next' ? 'translateX(100%)' : 'translateX(-100%)')
        : (dir === 'next' ? 'translateY(100%)' : 'translateY(-100%)');
    } else {
      const mangaDelta = axis === 'x' ? dx : dy;
      const offset = mangaDelta < 0 ? 1 : -1;
      const dir = axis === 'x' ? (offset > 0 ? 'swipeLeft' : 'swipeRight') : (offset > 0 ? 'swipeUp' : 'swipeDown');
      const idx = readingListIndex + offset;
      const inBounds = idx >= 0 && idx < readingListItems.length;
      const url = inBounds ? resolvedListPageUrl.get(idx) : null;
      if (!url) { dragInfo = { kind: 'manga', dir, offset, blocked: true, reason: inBounds ? 'notReady' : 'edge' }; return; }
      dragInfo = { kind: 'manga', dir, offset };
      const neighborItem = readingListItems[idx];
      dragNeighborSlide = makeSlide(url, neighborItem && neighborItem.splitSpreads ? 'right' : null);
      dragNeighborSlide.style.transform = axis === 'x'
        ? (dir === 'swipeLeft' ? 'translateX(100%)' : 'translateX(-100%)')
        : (dir === 'swipeUp' ? 'translateY(100%)' : 'translateY(-100%)');
    }
    dragNeighborSlide.style.transition = 'none';
    els.pageStage.appendChild(dragNeighborSlide);
  }

  function updateDragX(dx) {
    if (dragInfo.blocked) { dragCurrentSlide.style.transform = 'translateX(0)'; return; }
    if (dragInfo.kind !== 'page') {
      const clampedManga = dragInfo.dir === 'swipeLeft' ? Math.min(dx, 0) : Math.max(dx, 0);
      dragCurrentSlide.style.transform = 'translateX(' + clampedManga + 'px)';
      dragNeighborSlide.style.transform = 'translateX(calc(' + (dragInfo.dir === 'swipeLeft' ? '100%' : '-100%') + ' + ' + clampedManga + 'px))';
      return;
    }
    const clamped = dragInfo.dir === 'next' ? Math.min(dx, 0) : Math.max(dx, 0);
    dragCurrentSlide.style.transform = 'translateX(' + clamped + 'px)';
    const base = dragInfo.dir === 'next' ? '100%' : '-100%';
    dragNeighborSlide.style.transform = 'translateX(calc(' + base + ' + ' + clamped + 'px))';
  }
  function updateDragY(dy) {
    if (dragInfo.blocked) { dragCurrentSlide.style.transform = 'translateY(0)'; return; }
    if (dragInfo.kind !== 'page') {
      const clampedManga = dragInfo.dir === 'swipeUp' ? Math.min(dy, 0) : Math.max(dy, 0);
      dragCurrentSlide.style.transform = 'translateY(' + clampedManga + 'px)';
      dragNeighborSlide.style.transform = 'translateY(calc(' + (dragInfo.dir === 'swipeUp' ? '100%' : '-100%') + ' + ' + clampedManga + 'px))';
      return;
    }
    const clamped = dragInfo.dir === 'next' ? Math.min(dy, 0) : Math.max(dy, 0);
    dragCurrentSlide.style.transform = 'translateY(' + clamped + 'px)';
    const base = dragInfo.dir === 'swipeUp' ? '100%' : '-100%';
    dragNeighborSlide.style.transform = 'translateY(calc(' + base + ' + ' + clamped + 'px))';
  }

  // Applies the rest of showPage()'s / goToReadingListOffset()'s state
  // changes once a drag's own slide-in animation has visually finished —
  // the DOM swap already happened in commitDrag(), so this only updates
  // page/list bookkeeping (and, for manga switches, hands off to the
  // normal async open pipeline with suppressNextRenderAnim set so it
  // doesn't replay the transition a second time).
  function finalizeDragCommit(info) {
    if (info.kind === 'page') {
      currentPage = info.dir === 'next' ? currentPage + 1 : currentPage - 1;
      pruneStalePreloads(preloadWindowUrls(currentPage));
      updateSlider();
      for (let i = 1; i <= PRELOAD_AHEAD_COUNT; i++) preload(currentPage + i);
      preload(currentPage - 1);
      persistLastPage();
      nextVolumeDismissed = false;
      updateNextVolumeBanner();
    } else {
      suppressNextRenderAnim = true;
      goToReadingListOffset(info.offset);
    }
  }

  function commitDrag(axis, info, delta, dim) {
    const current = dragCurrentSlide, neighbor = dragNeighborSlide;
    // Hand off the "current" marker immediately (not after the animation
    // finishes) so a fast follow-up swipe started mid-transition queries
    // the right slide via .pageSlide.current — mirrors how renderPage()'s
    // own tap/keyboard-triggered transitions already do this synchronously.
    current.classList.remove('current');
    neighbor.classList.add('current');
    const finalCurrent = info.kind === 'page'
      ? (axis === 'x'
        ? (info.dir === 'next' ? 'translateX(-100%)' : 'translateX(100%)')
        : (info.dir === 'next' ? 'translateY(-100%)' : 'translateY(100%)'))
      : (axis === 'x'
        ? (info.dir === 'swipeLeft' ? 'translateX(-100%)' : 'translateX(100%)')
        : (info.dir === 'swipeUp' ? 'translateY(-100%)' : 'translateY(100%)'));
    const remaining = Math.max(dim - Math.abs(delta), 0);
    const duration = Math.max(MIN_DRAG_ANIM_MS, Math.round(ANIM_DURATION * (remaining / dim)));
    current.style.transition = 'transform ' + duration + 'ms ease';
    neighbor.style.transition = 'transform ' + duration + 'ms ease';
    requestAnimationFrame(() => {
      current.style.transform = finalCurrent;
      neighbor.style.transform = 'translate(0, 0)';
    });
    setTimeout(() => {
      neighbor.style.transition = '';
      neighbor.style.transform = '';
      if (current.parentNode) current.parentNode.removeChild(current);
      finalizeDragCommit(info);
    }, duration + 30);
  }

  function cancelDrag(axis, info, delta, dim) {
    const current = dragCurrentSlide, neighbor = dragNeighborSlide;
    const neighborStart = info.kind === 'page'
      ? (axis === 'x'
        ? (info.dir === 'next' ? 'translateX(100%)' : 'translateX(-100%)')
        : (info.dir === 'next' ? 'translateY(100%)' : 'translateY(-100%)'))
      : (axis === 'x'
        ? (info.dir === 'swipeLeft' ? 'translateX(100%)' : 'translateX(-100%)')
        : (info.dir === 'swipeUp' ? 'translateY(100%)' : 'translateY(-100%)'));
    const duration = Math.max(MIN_DRAG_ANIM_MS, Math.round(ANIM_DURATION * (Math.abs(delta) / dim)));
    current.style.transition = 'transform ' + duration + 'ms ease';
    neighbor.style.transition = 'transform ' + duration + 'ms ease';
    requestAnimationFrame(() => {
      current.style.transform = 'translate(0, 0)';
      neighbor.style.transform = neighborStart;
    });
    setTimeout(() => {
      if (neighbor.parentNode) neighbor.parentNode.removeChild(neighbor);
      current.style.transition = '';
      current.style.transform = '';
    }, duration + 30);
  }

  // No neighbor available (page/list boundary, or the adjacent manga's
  // first page hasn't resolved yet) — spring the current slide back to
  // rest. Only flashes the "最初/最後の作品です" message for a genuine
  // list boundary that was dragged with real intent, matching the
  // threshold the old (non-live) swipe used.
  function finishBlockedDrag(delta, info) {
    const current = dragCurrentSlide;
    current.style.transition = 'transform ' + MIN_DRAG_ANIM_MS + 'ms ease';
    requestAnimationFrame(() => { current.style.transform = 'translate(0, 0)'; });
    setTimeout(() => { current.style.transition = ''; current.style.transform = ''; }, MIN_DRAG_ANIM_MS + 30);
    if (info.kind === 'manga' && info.reason === 'edge' && Math.abs(delta) > VERTICAL_SWIPE_THRESHOLD) {
      flashStatus(info.offset > 0 ? 'これが最後の作品です' : 'これが最初の作品です');
    } else if (info.kind === 'page' && info.reason === 'loading' && Math.abs(delta) > VERTICAL_SWIPE_THRESHOLD) {
      flashStatus('読み込み中...');
    }
  }

  function onReaderTouchStart(e) {
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    lastMoveX = touchStartX; lastMoveY = touchStartY; lastMoveTime = performance.now();
    touchActive = true;
    resetDragState();
    // Cheap retry: if an earlier preload attempt for a neighbor manga timed
    // out or failed (slow/throttled server, lost race with other in-flight
    // requests), nothing was re-triggering it except a successful swipe —
    // so a manga that failed once stayed permanently "blocked" even though
    // a fresh attempt might well succeed. preloadAdjacentManga() is a no-op
    // for anything already resolved or currently in flight, so calling it
    // on every touch start is safe and gives every gesture a fresh chance.
    preloadAdjacentManga();
  }
  function onReaderTouchMove(e) {
    if (!touchActive || e.touches.length !== 1) return;
    if (!animEnabled) { legacyOnReaderTouchMove(e); return; }
    const x = e.touches[0].clientX, y = e.touches[0].clientY;
    const dx = x - touchStartX, dy = y - touchStartY;
    if (verticalScrollEnabled && Math.abs(dy) >= Math.abs(dx)) return;
    if (dragAxis === null) {
      if (Math.abs(dx) < AXIS_LOCK_PX && Math.abs(dy) < AXIS_LOCK_PX) return; // not enough movement to decide yet
      beginDrag(Math.abs(dx) > Math.abs(dy) ? 'x' : 'y', dx, dy);
      if (dragAxis === null) return; // nothing draggable on screen right now
    }
    e.preventDefault(); // a real drag — don't let the browser also scroll/bounce
    scheduleDragFrame(dragAxis, dragAxis === 'x' ? dx : dy);
    lastMoveX = x; lastMoveY = y; lastMoveTime = performance.now();
  }
  function onReaderTouchEnd(e) {
    if (!touchActive) return;
    touchActive = false;
    if (!animEnabled) { legacyOnReaderTouchEnd(e); return; }
    const touch = e.changedTouches[0];
    if (!touch || dragAxis === null) { resetDragState(); return; } // a plain tap — let the click zones handle it
    if (verticalScrollEnabled && Math.abs(touch.clientY - touchStartY) >= Math.abs(touch.clientX - touchStartX)) { resetDragState(); return; }
    e.preventDefault(); // a real drag, not a tap — don't also trigger the tap-zone click
    const axis = dragAxis, info = dragInfo;
    const dx = touch.clientX - touchStartX, dy = touch.clientY - touchStartY;
    const delta = axis === 'x' ? dx : dy;
    const dim = axis === 'x' ? els.pageStage.clientWidth : els.pageStage.clientHeight;
    if (info.blocked) {
      finishBlockedDrag(delta, info);
    } else {
      const dt = Math.max(performance.now() - lastMoveTime, 1);
      const recentDelta = axis === 'x' ? (touch.clientX - lastMoveX) : (touch.clientY - lastMoveY);
      const velocity = Math.abs(recentDelta) / dt;
      const progress = Math.min(Math.abs(delta) / dim, 1);
      const shouldCommit = progress > DRAG_COMMIT_FRACTION ||
        (Math.abs(delta) > DRAG_FLING_MIN_PX && velocity > DRAG_FLING_VELOCITY);
      if (shouldCommit) commitDrag(axis, info, delta, dim);
      else cancelDrag(axis, info, delta, dim);
    }
    resetDragState();
  }

  // ---------- legacy (animEnabled === false) touch handling ----------
  // No live preview, no preloading dependency — decides everything at
  // touchend, same as before this feature existed. Kept as the fallback so
  // turning animations off still gives the cheapest possible interaction.
  function legacyOnReaderTouchMove(e) {
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 10) e.preventDefault();
  }
  function legacyOnReaderTouchEnd(e) {
    const touch = e.changedTouches[0];
    if (!touch) return;
    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;
    if (verticalScrollEnabled) {
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > VERTICAL_SWIPE_THRESHOLD) {
        e.preventDefault(); goToReadingListOffset(dx < 0 ? 1 : -1);
      } else if (Math.abs(dy) > VERTICAL_SWIPE_THRESHOLD) {
        e.preventDefault(); dy < 0 ? nextPage() : prevPage();
      }
    } else if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > VERTICAL_SWIPE_THRESHOLD) {
      e.preventDefault(); goToReadingListOffset(dy < 0 ? 1 : -1);
    }
  }

  els.imgWrap.addEventListener('touchstart', onReaderTouchStart, { passive: true });
  els.imgWrap.addEventListener('touchmove', onReaderTouchMove, { passive: false });
  els.imgWrap.addEventListener('touchend', onReaderTouchEnd, { passive: false });
  els.pageStage.addEventListener('scroll', () => {
    if (verticalScrollEnabled) updateVerticalCurrentPage();
  }, { passive: true });

  function renderSeriesOptions(selectEl, selectedSeries) {
    const names = Array.from(new Set(savedItems.map((it) => (it.series || '').trim()).filter(Boolean)))
      .sort((a, b) => a.localeCompare(b, 'ja'));
    if (selectedSeries && !names.includes(selectedSeries)) names.push(selectedSeries);
    selectEl.innerHTML = '';
    const none = document.createElement('option');
    none.value = '';
    none.textContent = 'シリーズなし';
    selectEl.appendChild(none);
    names.forEach((name) => {
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      selectEl.appendChild(option);
    });
    const add = document.createElement('option');
    add.value = '__new__';
    add.textContent = '+ 新しいシリーズを作成';
    selectEl.appendChild(add);
    selectEl.value = selectedSeries || '';
  }

  function selectedSeriesName(selectEl, newInput) {
    return (selectEl.value === '__new__' ? newInput.value : selectEl.value).trim();
  }

  function renderSourceWorkOptions(selectEl, selectedWork) {
    const names = Array.from(new Set(savedItems.map((it) => (it.sourceWork || '').trim()).filter(Boolean)))
      .sort((a, b) => a.localeCompare(b, 'ja'));
    if (selectedWork && !names.includes(selectedWork)) names.push(selectedWork);
    selectEl.innerHTML = '';
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = '元ネタの作品名を選択';
    selectEl.appendChild(placeholder);
    names.forEach((name) => {
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      selectEl.appendChild(option);
    });
    const add = document.createElement('option');
    add.value = '__new__';
    add.textContent = '+ 新しい元ネタの作品名を追加';
    selectEl.appendChild(add);
    selectEl.value = selectedWork || '';
  }

  function selectedSourceWorkName(selectEl, newInput) {
    return (selectEl.value === '__new__' ? newInput.value : selectEl.value).trim().slice(0, 100);
  }

  function updateDoujinForm(checkEl, rowEl, selectEl, newRowEl) {
    const enabled = checkEl.checked;
    rowEl.style.display = enabled ? 'block' : 'none';
    newRowEl.style.display = enabled && selectEl.value === '__new__' ? 'block' : 'none';
  }

  function readDoujinForm(checkEl, selectEl, newInput) {
    if (!checkEl.checked) return { isDoujin: false, sourceWork: '' };
    const sourceWork = selectedSourceWorkName(selectEl, newInput);
    if (!sourceWork) {
      flashStatus('元ネタの作品名を選択または入力してください');
      return null;
    }
    return { isDoujin: true, sourceWork: sourceWork };
  }

  function seriesTitle(series, volume) {
    const numericVolume = Number(volume);
    return '第' + volume + (Number.isInteger(numericVolume) ? '巻' : '話') + ' ' + series;
  }

  function updateSeriesForm(selectEl, newRow, newInput, volumeInput, titleInput) {
    const hasSeries = !!selectEl.value;
    const isNew = selectEl.value === '__new__';
    const hadSeries = titleInput.dataset.seriesActive === '1';
    if (hasSeries && !hadSeries) titleInput.dataset.manualTitle = titleInput.value;
    newRow.style.display = isNew ? 'block' : 'none';
    volumeInput.disabled = !hasSeries;
    titleInput.readOnly = hasSeries;
    if (hasSeries) {
      const name = selectedSeriesName(selectEl, newInput);
      const volume = Number(volumeInput.value);
      titleInput.value = name && volume > 0 ? seriesTitle(name, volume) : '';
      titleInput.placeholder = 'シリーズ名と巻数から自動設定';
    } else {
      if (hadSeries) titleInput.value = titleInput.dataset.manualTitle || '';
      volumeInput.value = '';
      titleInput.placeholder = '例: ○○ 第1巻';
    }
    titleInput.dataset.seriesActive = hasSeries ? '1' : '0';
  }

  function hasDuplicateSeriesVolume(series, volume, excludedItemId) {
    return savedItems.some((it) => it.id !== excludedItemId && it.series === series && Number(it.volume) === volume);
  }

  function readSeriesForm(selectEl, newInput, volumeInput, excludedItemId) {
    const series = selectedSeriesName(selectEl, newInput);
    if (!selectEl.value) return { series: null, volume: null, title: null };
    if (!series) { flashStatus('新しいシリーズ名を入力してください'); return null; }
    const volume = Number(volumeInput.value);
    if (!volumeInput.value || isNaN(volume) || volume <= 0) {
      flashStatus('シリーズ設定時は巻数を入力してください');
      return null;
    }
    if (hasDuplicateSeriesVolume(series, volume, excludedItemId)) {
      flashStatus('同じシリーズに第' + volume + '巻が既にあります');
      return null;
    }
    return { series, volume, title: seriesTitle(series, volume) };
  }

  function normalizedAuthor(value) {
    return String(value || '').trim().slice(0, 100);
  }

  function seriesAuthorFor(series) {
    if (!series) return '';
    const matchingItems = savedItems.filter((item) => item.series === series);
    return matchingItems.map((item) => normalizedAuthor(item.author)).find(Boolean) || '';
  }

  function updateSeriesAuthorForm(selectEl, newSeriesInput, rowEl, newAuthorInput, noAuthorInput, authorInput) {
    const hasSeries = !!selectEl.value;
    const isNew = selectEl.value === '__new__';
    const hadSeries = authorInput.dataset.seriesAuthorActive === '1';
    if (hasSeries && !hadSeries) authorInput.dataset.manualAuthor = authorInput.value;

    rowEl.style.display = isNew ? 'block' : 'none';
    authorInput.disabled = hasSeries;
    if (!hasSeries) {
      if (hadSeries) authorInput.value = authorInput.dataset.manualAuthor || '';
    } else if (isNew) {
      newAuthorInput.disabled = noAuthorInput.checked;
      authorInput.value = noAuthorInput.checked ? '' : normalizedAuthor(newAuthorInput.value);
    } else {
      authorInput.value = seriesAuthorFor(selectedSeriesName(selectEl, newSeriesInput));
    }
    authorInput.dataset.seriesAuthorActive = hasSeries ? '1' : '0';
  }

  function readSeriesAuthorForm(selectEl, newSeriesInput, newAuthorInput, noAuthorInput, authorInput) {
    if (!selectEl.value) return normalizedAuthor(authorInput.value);
    const series = selectedSeriesName(selectEl, newSeriesInput);
    if (selectEl.value !== '__new__' || savedItems.some((item) => item.series === series)) return seriesAuthorFor(series);
    if (noAuthorInput.checked) return '';
    const author = normalizedAuthor(newAuthorInput.value);
    if (!author) {
      flashStatus('シリーズの作者を入力するか、「作者を指定しない」を選択してください');
      return null;
    }
    return author;
  }

  function applySeriesAuthor(series, author) {
    if (!series) return;
    savedItems.forEach((item) => {
      if (item.series === series) item.author = author;
    });
  }

  function parseTags(value) {
    const seen = new Set();
    return String(value || '').split(/[,，\n]/).map((tag) => tag.trim()).filter((tag) => {
      const key = tag.toLocaleLowerCase();
      if (!tag || seen.has(key)) return false;
      seen.add(key);
      return true;
    }).slice(0, 12).map((tag) => tag.slice(0, 40));
  }

  function tagsText(tags) {
    return Array.isArray(tags) ? tags.filter(Boolean).join(', ') : '';
  }

  function metadataCandidates(kind) {
    const values = kind === 'author'
      ? savedItems.map((item) => normalizedAuthor(item.author))
      : savedItems.flatMap((item) => Array.isArray(item.tags) ? item.tags : []);
    const seen = new Set();
    return values.filter((value) => {
      const text = String(value || '').trim();
      const key = text.toLocaleLowerCase();
      if (!text || seen.has(key)) return false;
      seen.add(key);
      return true;
    }).sort((a, b) => a.localeCompare(b, 'ja'));
  }

  function activeMetadataQuery(input, kind) {
    if (kind === 'author') return input.value.trim();
    const value = input.value;
    const lastSeparator = Math.max(value.lastIndexOf(','), value.lastIndexOf('，'), value.lastIndexOf('\n'));
    return value.slice(lastSeparator + 1).trim();
  }

  function hideMetadataSuggestions() {
    els.metadataSuggestions.classList.remove('show');
    els.metadataSuggestions.replaceChildren();
  }

  function applyMetadataSuggestion(input, kind, value) {
    if (kind === 'author') {
      input.value = value;
    } else {
      const source = input.value;
      const lastSeparator = Math.max(source.lastIndexOf(','), source.lastIndexOf('，'), source.lastIndexOf('\n'));
      input.value = (lastSeparator < 0 ? '' : source.slice(0, lastSeparator + 1) + ' ') + value;
    }
    hideMetadataSuggestions();
    input.focus();
  }

  function showMetadataSuggestions(input, kind) {
    const query = activeMetadataQuery(input, kind).toLocaleLowerCase();
    const matches = metadataCandidates(kind)
      .filter((value) => !query || value.toLocaleLowerCase().includes(query))
      .sort((a, b) => {
        const aStarts = a.toLocaleLowerCase().startsWith(query);
        const bStarts = b.toLocaleLowerCase().startsWith(query);
        return Number(bStarts) - Number(aStarts) || a.localeCompare(b, 'ja');
      })
      .slice(0, 8);
    if (!matches.length) { hideMetadataSuggestions(); return; }

    const rect = input.getBoundingClientRect();
    els.metadataSuggestions.replaceChildren();
    matches.forEach((value) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'metadataSuggestion';
      button.setAttribute('role', 'option');
      button.textContent = value;
      button.addEventListener('mousedown', (event) => {
        event.preventDefault();
        applyMetadataSuggestion(input, kind, value);
      });
      els.metadataSuggestions.appendChild(button);
    });
    els.metadataSuggestions.style.left = rect.left + 'px';
    els.metadataSuggestions.style.top = (rect.bottom + 4) + 'px';
    els.metadataSuggestions.style.width = rect.width + 'px';
    els.metadataSuggestions.classList.add('show');
  }

  function bindMetadataSuggestions(input, kind) {
    input.addEventListener('focus', () => showMetadataSuggestions(input, kind));
    input.addEventListener('input', () => showMetadataSuggestions(input, kind));
    input.addEventListener('blur', () => window.setTimeout(hideMetadataSuggestions, 120));
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') hideMetadataSuggestions();
    });
  }

  [
    [els.saveAuthorInput, 'author'], [els.customAuthorInput, 'author'], [els.editAuthorInput, 'author'],
    [els.saveTagsInput, 'tag'], [els.customTagsInput, 'tag'], [els.editTagsInput, 'tag'],
  ].forEach(([input, kind]) => bindMetadataSuggestions(input, kind));

  function openSaveDialog() {
    if (!baseUrl) { flashStatus('表示中の作品がありません'); return; }
    pendingSaveUrl = baseUrl;
    els.saveTitleInput.value = deriveTitleFromUrl(pendingSaveUrl);
    els.saveAuthorInput.value = '';
    els.saveAuthorInput.dataset.manualAuthor = '';
    els.saveAuthorInput.dataset.seriesAuthorActive = '0';
    els.saveTagsInput.value = '';
    els.saveDoujinInput.checked = false;
    renderSourceWorkOptions(els.saveSourceWorkInput, '');
    els.saveNewSourceWorkInput.value = '';
    updateDoujinForm(els.saveDoujinInput, els.saveDoujinSourceRow, els.saveSourceWorkInput, els.saveNewSourceWorkRow);
    els.saveSplitSpreadsInput.checked = false;
    els.saveTitleInput.dataset.manualTitle = els.saveTitleInput.value;
    els.saveTitleInput.dataset.seriesActive = '0';
    renderFolderOptions(els.saveFolderSelect, '');
    els.newFolderRow.style.display = 'none';
    els.newFolderInput.value = '';
    renderSeriesOptions(els.saveSeriesInput, '');
    els.saveNewSeriesInput.value = '';
    els.saveNewSeriesAuthorInput.value = '';
    els.saveSeriesNoAuthorInput.checked = false;
    els.saveVolumeInput.value = '';
    updateSeriesForm(els.saveSeriesInput, els.saveNewSeriesRow, els.saveNewSeriesInput, els.saveVolumeInput, els.saveTitleInput);
    updateSeriesAuthorForm(els.saveSeriesInput, els.saveNewSeriesInput, els.saveSeriesAuthorRow, els.saveNewSeriesAuthorInput, els.saveSeriesNoAuthorInput, els.saveAuthorInput);
    els.saveDialogOverlay.classList.add('show');
    els.saveTitleInput.focus();
  }
  function closeSaveDialog() {
    els.saveDialogOverlay.classList.remove('show');
    pendingSaveUrl = null;
  }
  function isSaveDialogOpen() { return els.saveDialogOverlay.classList.contains('show'); }

  function confirmSave() {
    if (!pendingSaveUrl) { closeSaveDialog(); return; }
    let folderId = els.saveFolderSelect.value;
    if (folderId === '__new__') folderId = '';
    // 履歴 entries don't count as "already saved" — every 新規-opened manga is
    // auto-recorded there, but that shouldn't block the user from also saving
    // it into a real folder. Only block if it's already saved somewhere else.
    const alreadySavedElsewhere = savedItems.some(
      (it) => it.folderId !== HISTORY_FOLDER_ID && baseUrlKey(it.url) === baseUrlKey(pendingSaveUrl)
    );
    if (alreadySavedElsewhere) {
      flashStatus('既に保存済みです');
      closeSaveDialog();
      return;
    }
    const seriesData = readSeriesForm(els.saveSeriesInput, els.saveNewSeriesInput, els.saveVolumeInput, null);
    if (!seriesData) return;
    const seriesAuthor = readSeriesAuthorForm(els.saveSeriesInput, els.saveNewSeriesInput, els.saveNewSeriesAuthorInput, els.saveSeriesNoAuthorInput, els.saveAuthorInput);
    if (seriesAuthor === null) return;
    ensureAuthorCardForName(seriesAuthor);
    const doujinData = readDoujinForm(els.saveDoujinInput, els.saveSourceWorkInput, els.saveNewSourceWorkInput);
    if (!doujinData) return;
    const title = seriesData.title || els.saveTitleInput.value.trim() || deriveTitleFromUrl(pendingSaveUrl);
    const readingSource = getCurrentItem();
    const savedUrl = pendingSaveUrl;
    const savedItem = {
      id: genId('i'),
      url: savedUrl,
      title: title,
      author: seriesAuthor,
      tags: parseTags(els.saveTagsInput.value),
      isDoujin: doujinData.isDoujin,
      sourceWork: doujinData.sourceWork,
      splitSpreads: els.saveSplitSpreadsInput.checked,
      numberWidth: pageNumberWidth,
      pagePattern: pagePattern,
      folderId: folderId || null,
      series: seriesData.series,
      volume: seriesData.volume,
      favorite: false,
      lastReadAt: readingSource ? (Number(readingSource.lastReadAt) || null) : null,
      readCount: readingSource ? (Number(readingSource.readCount) || 0) : 0,
      addedAt: Date.now(),
    };
    savedItems.unshift(savedItem);
    applySeriesAuthor(seriesData.series, seriesAuthor);

    // 分割表示を新たに有効にした場合は、現在読んでいる元画像の右半分を
    // 続きとして開く。保存後に同じ作品を開き直すことで、保存した設定を
    // リーダー全体（ページ数・スライダー・画像表示）へ一貫して反映する。
    if (savedItem.splitSpreads && baseUrlKey(baseUrl) === baseUrlKey(savedUrl)) {
      try {
        const map = JSON.parse(localStorage.getItem(LAST_PAGE_KEY) || '{}');
        map[savedUrl] = {
          page: Math.max(1, currentPage * 2 - 1),
          wasLast: false,
          savedAt: Date.now(),
        };
        localStorage.setItem(LAST_PAGE_KEY, JSON.stringify(map));
      } catch (e) {}
    }
    persistAll();
    updateCurrentTitleDisplay();
    updateSaveButtonVisibility();
    closeSaveDialog();
    if (savedItem.splitSpreads) openItem(savedItem, false);
    flashStatus('保存しました');
  }

  // ---------- custom (explicit page-list) manga add dialog ----------
  // Lets the user add a manga whose pages aren't sequentially-numbered files

  function openCustomAddDialog() {

    els.customTitleInput.value = '';

  async function removeLocalSyncStorage(item) {
    if (!item.localSync) return;
    const session = JSON.parse(localStorage.getItem('mangaReaderSupabaseSession') || 'null');
    const config = window.MANGA_READER_SUPABASE || {};
    const paths = (Array.isArray(item.storagePaths) && item.storagePaths.length ? item.storagePaths : (item.pages || []).map(localStoragePathFromUrl)).filter(Boolean);
    if (!session || !session.access_token || !config.url || !paths.length) throw new Error('同期画像の保存先を確認できません。');
    const response = await fetch(config.url + '/storage/v1/object/remove', {
      method: 'POST',
      headers: { apikey: config.publishableKey, Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ prefixes: paths })
    });
    if (!response.ok) throw new Error('Storage上の画像を削除できませんでした。先にStorage権限を確認してください。');
  }

  async function reconcileLocalSyncItemsFromStorage() {
    const session = JSON.parse(localStorage.getItem('mangaReaderSupabaseSession') || 'null');
    const config = window.MANGA_READER_SUPABASE || {};
    if (!session || !session.access_token || !session.user || !config.url) throw new Error('ログイン状態を確認できません。');
    const headers = { apikey: config.publishableKey, Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json' };
    const listObjects = async (prefix) => {
      const response = await fetch(config.url + '/storage/v1/object/list/local-manga', { method: 'POST', headers, body: JSON.stringify({ prefix, limit: 1000, offset: 0, sortBy: { column: 'name', order: 'asc' } }) });
      if (!response.ok) throw new Error('Storageのフォルダ一覧を取得できませんでした。');
      return response.json();
    };
    const relativeName = (value, prefix) => {
      const raw = String(value || '');
      if (raw.startsWith(prefix)) return raw.slice(prefix.length).replace(/^\/+/, '');
      return raw.replace(/^\/+/, '').split('/').filter(Boolean).pop() || '';
    };
    const root = await listObjects(session.user.id + '/');
    const rootPrefix = session.user.id + '/';
    const folderNames = root.map((entry) => relativeName(entry.name, rootPrefix)).filter((name) => name.startsWith('local-') && !name.includes('/'));
    const existingByFolder = new Map(savedItems.filter((item) => item.localSync && item.folderId).map((item) => [item.folderId, item]));
    const storageItems = [];
    for (const folderId of folderNames) {
      const entries = await listObjects(session.user.id + '/' + folderId + '/');
      const folderPrefix = session.user.id + '/' + folderId + '/';
      const names = entries.map((entry) => relativeName(entry.name, folderPrefix)).filter((name) => !name.endsWith('/') && !name.includes('/') && /\.(avif|bmp|gif|jpe?g|png|webp)$/i.test(name));
      if (!names.length) continue;
      const paths = names.map((name) => session.user.id + '/' + folderId + '/' + name);
      const old = existingByFolder.get(folderId);
      const item = old ? Object.assign({}, old, { pages: paths.map((path) => config.url + '/storage/v1/object/public/local-manga/' + path.split('/').map((part) => encodeURIComponent(part)).join('/')), storagePaths: paths }) : { id: 'local-item-' + folderId, title: folderId, folderId, pages: paths.map((path) => config.url + '/storage/v1/object/public/local-manga/' + path.split('/').map((part) => encodeURIComponent(part)).join('/')), storagePaths: paths, pageMeta: [], favoriteOnly: false, addedAt: Date.now(), localSync: true };
      storageItems.push(item);
    }
    const nonLocalItems = savedItems.filter((item) => !item.localSync);
    savedItems = nonLocalItems.concat(storageItems);
    const storageFolderIds = new Set(storageItems.map((item) => item.folderId));
    savedFolders = savedFolders.filter((folder) => !String(folder.id || '').startsWith('local-') || storageFolderIds.has(folder.id));
    storageItems.forEach((item) => { if (!savedFolders.some((folder) => folder.id === item.folderId)) savedFolders.push({ id: item.folderId, name: item.title, addedAt: item.addedAt }); });
    localStorage.setItem(SAVED_ITEMS_KEY, JSON.stringify(savedItems));
    localStorage.setItem(SAVED_FOLDERS_KEY, JSON.stringify(savedFolders));
    try { await MangaVault.savePayload(buildSyncPayload()); } catch (_) {}
    return storageItems.length;
  }

  async function deleteEditingItem() {
    const item = savedItems.find((it) => it.id === editingItemId);

    const prompt = item.localSync

      : '「' + itemDisplayTitle(item) + '」を削除します。本当によろしいですか？';
