
<!DOCTYPE html>
<html lang="ja" class="auth-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>漫画リーダー</title>
<link rel="icon" type="image/png" href="icon-bookshelf.png">
<!-- Home screen (Add to Home Screen) icon and label for iOS Safari -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<meta name="apple-mobile-web-app-title" content="Books">
<style>
  html.auth-pending body { visibility: hidden; }
  :root {
    --bg: #0a0c11;
    --bg-soft: #0f1218;
    --panel: #161a23;
    --panel-2: #1d2230;
    --border: #262b38;
    --accent: #ff6b4a;
    --accent-2: #46d9c2;
    --accent-dim: rgba(255,107,74,0.16);
    --text: #f1f2f6;
    --sub: #8d93a3;
    --radius: 10px;
    --radius-sm: 7px;
    --shadow-sm: 0 2px 10px rgba(0,0,0,0.4);
    --shadow-md: 0 10px 30px rgba(0,0,0,0.55);
    --ease: cubic-bezier(.22,.85,.32,1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #app {
    position: relative; height: 100vh; overflow: hidden;
    background: radial-gradient(ellipse 120% 80% at 50% -10%, #161a26 0%, var(--bg) 55%);
  }
  ::selection { background: var(--accent-dim); color: var(--text); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Custom scrollbars for the dark theme (WebKit) */
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2c313f; border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a4051; }

  /* Thin reading-progress line across the very top edge — width tracks
     currentPage / pages.length. Sits above #topbar (so it stays visible even
     when the bars are toggled hidden) and is unaffected by toggleBars(). */
  #readProgressBar {
    position: absolute; top: 0; left: 0; height: 3px; width: 0%;
    background: var(--accent);
    z-index: 12; transition: width 0.25s var(--ease);
    box-shadow: 0 0 8px var(--accent-dim);
  }

  /* Top bar (overlays the viewer; hiding it does not change viewer's size) */
  #topbar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; row-gap: 6px;
    padding: 11px 14px; background: rgba(14,16,22,0.68);
    backdrop-filter: blur(10px) saturate(140%); -webkit-backdrop-filter: blur(10px) saturate(140%);
    border-bottom: 1px solid var(--border);
    transition: transform 0.3s var(--ease), opacity 0.3s var(--ease);
    z-index: 10;
  }
  #topbar.hidden { transform: translateY(-100%); opacity: 0; }
  .ctrlBtn, .primaryBtn {
    padding: 8px 15px; border-radius: var(--radius-sm); border: 1px solid transparent;
    font-size: 13.5px; font-weight: 500; cursor: pointer; white-space: nowrap;
    transition: filter 0.15s ease, transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .primaryBtn {
    background: linear-gradient(135deg, var(--accent), #ff8a5c); color: #1a0c08;
    box-shadow: 0 2px 10px rgba(255,107,74,0.35); font-weight: 600;
  }
  .ctrlBtn { background: var(--panel-2); color: var(--text); border-color: var(--border); }
  .ctrlBtn.active { background: var(--accent-dim); color: var(--accent); border-color: rgba(255,107,74,0.4); }
  /* リーダー上部のお気に入りトグル。アイコン画像1つだけを中央表示する。 */
  .favToggleBtn { display: inline-flex; align-items: center; justify-content: center; padding: 8px 12px; }
  .favToggleBtn img { width: 17px; height: 17px; }
  .themeIcon { display: block; width: 17px; height: 17px; }
  .ctrlBtn:hover, .primaryBtn:hover { filter: brightness(1.12); transform: translateY(-1px); }
  .ctrlBtn:active, .primaryBtn:active { transform: translateY(0); filter: brightness(0.97); }
  .ctrlBtn:disabled, .primaryBtn:disabled { opacity: 0.38; cursor: not-allowed; transform: none; }
  #status { font-size: 12px; color: var(--sub); min-width: 90px; letter-spacing: 0.01em; }
  #currentTitle {
    font-size: 13px; font-weight: 600; color: var(--text);
    max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #readerMeta {
    display: flex; align-items: center; justify-content: flex-end; gap: 8px;
    min-width: 0; margin-left: auto; flex: 1 1 180px;
  }
  #moreBtn, #mobileMoreMenu { display: none; }

  /* Viewer: always fills the full app area. Topbar/controls float on top of
     it, so hiding them reveals more of the image instead of leaving blank
     space behind. */
  #viewer {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    background: #000; overflow: hidden;
  }
  /* touch-action:none stops the browser from also starting its own native
     scroll/bounce/zoom on this element. Without it, on the first few px of a
     touchmove (before our drag controller has locked an axis and started
     calling preventDefault) iOS Safari can begin its own elastic scroll, and
     that fights visibly with our live drag for the rest of the gesture. */
  #imgWrap { position: relative; width: 100%; height: 100%; touch-action: none; }
  #pageStage { position: absolute; inset: 0; overflow: hidden; }
  #pageStage.vertical-scroll { position: relative; inset: auto; height: 100%; overflow-y: auto; overflow-x: hidden; display: block; -webkit-overflow-scrolling: touch; }
  #imgWrap.vertical-scroll { touch-action: pan-y; overflow: hidden; }
  #imgWrap.vertical-scroll .clickzone { display: none; }
  #imgWrap.vertical-scroll #pageStage { z-index: 1; touch-action: pan-y; overflow-y: scroll; }
  #pageStage.vertical-scroll .pageSlide { position: relative; inset: auto; width: 100%; min-height: 0; display: flex; transform: none !important; transition: none !important; background: #000; }
  #pageStage.vertical-scroll .pageimg { width: 100% !important; height: auto !important; max-width: 100%; max-height: none; object-fit: contain; }
  #pageStage.vertical-scroll .pageSlide.current { outline: 2px solid var(--accent); outline-offset: -2px; }
  .pageSlide {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    will-change: transform; background: #000;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
  }
  .pageimg { display: block; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  .spreadCrop { position: relative; overflow: hidden; flex: 0 0 auto; }
  .spreadCrop .pageimg { position: absolute; top: 0; max-width: none; max-height: none; }

  /* セーフモード: 漫画の画像（リーダーのページ・本棚の表紙サムネイル）にだけ
     モザイク(ぼかし)をかける。フォルダ/お気に入り/シリーズのアイコン
     （folder-cover内の生成アイコンなど）は実際の表紙ではないため対象外。 */
  body.safe-mode .pageimg,
  body.safe-mode .book-cover:not(.folder-cover) img {
    filter: blur(24px);
  }
  /* Readability preset: applied to the displayed page only. The source image
     stays untouched and is never uploaded or rewritten. */
  body.image-enhance .pageimg:not([data-local-enhanced="true"]) {
    filter: brightness(1.08) contrast(1.16) saturate(.92);
  }
  body.safe-mode.image-enhance .pageimg:not([data-local-enhanced="true"]) {
    filter: blur(24px) brightness(1.08) contrast(1.16) saturate(.92);
  }

  .clickzone { position: absolute; top: 0; bottom: 0; cursor: pointer; }
  .clickzone.left { left: 0; width: 38%; }
  .clickzone.right { right: 0; width: 38%; }
  .clickzone.mid { left: 38%; width: 24%; cursor: default; }

  #placeholder {
    color: var(--sub); font-size: 15px; text-align: center; padding: 20px;
    line-height: 1.8;
  }
  #placeholder code { background: var(--panel-2); border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; }

  #spinner {
    display: none; width: 38px; height: 38px;
    border: 3px solid #262b38; border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Bottom controls (also overlays the viewer; see #topbar comment above) */
  #controls {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; row-gap: 6px;
    padding: 10px 14px; background: rgba(14,16,22,0.68);
    backdrop-filter: blur(10px) saturate(140%); -webkit-backdrop-filter: blur(10px) saturate(140%);
    border-top: 1px solid var(--border);
    transition: transform 0.3s var(--ease), opacity 0.3s var(--ease);
    z-index: 10;
  }
  #controls.hidden { transform: translateY(100%); opacity: 0; }
  #pageSlider { flex: 1; min-width: 80px; }
  #pageLabel { font-size: 13px; color: var(--sub); min-width: 70px; text-align: center; white-space: nowrap; }

  /* Custom range-slider styling so the page scrubber matches the theme
     instead of the browser's default grey track/thumb. */
  input[type="range"] {
    -webkit-appearance: none; appearance: none; height: 4px; border-radius: 3px;
    background: var(--panel-2); outline: none; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: 2px solid #1a0c08;
    box-shadow: 0 0 0 3px var(--accent-dim);
    transition: transform 0.15s ease;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.12); }
  input[type="range"]::-moz-range-track { background: var(--panel-2); height: 4px; border-radius: 3px; }
  input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%; background: var(--accent);
    border: 2px solid #1a0c08; box-shadow: 0 0 0 3px var(--accent-dim);
  }

  /* "次の巻" banner: appears over the viewer, above #controls, once the
     reader reaches the true last page of a series-tagged manga and a saved
     item exists for series volume+1. */
  #nextVolumeBanner {
    position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%);
    display: none; align-items: center; gap: 10px;
    background: rgba(18,21,29,0.94); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: var(--radius); padding: 11px 16px; z-index: 15; width: min(520px, 94vw);
    box-shadow: var(--shadow-md);
    animation: bannerRise 0.25s var(--ease);
  }
  @keyframes bannerRise { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  #nextVolumeBanner.show { display: flex; }
  #nextVolumeText {
    flex: 1; min-width: 0; font-size: 13px; color: var(--text); white-space: normal; overflow-wrap: anywhere; line-height: 1.4;
  }
  #nextVolumeCover { width: 48px; height: 72px; flex: 0 0 48px; object-fit: cover; border-radius: 5px; background: var(--panel-2); }

  /* Full-screen task views (not popups) */
  .modalOverlay {
    position: fixed; inset: 0; background: var(--bg);
    display: none; overflow: auto; z-index: 50;
  }
  .modalOverlay.show { display: block; }
  .modalPanel {
    background: var(--bg); border-radius: 0; width: 100%; min-height: 100dvh;
    display: flex; flex-direction: column; padding: 28px max(24px, env(safe-area-inset-right)) 32px max(24px, env(safe-area-inset-left));
    border: 0; box-shadow: none;
  }
  #metadataSuggestions {
    position: fixed; display: none; z-index: 70; max-height: 210px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm);
    box-shadow: var(--shadow-md); padding: 4px;
  }
  #metadataSuggestions.show { display: block; }
  .metadataSuggestion {
    display: block; width: 100%; padding: 9px 10px; border: 0; border-radius: 7px;
    background: transparent; color: var(--text); text-align: left; font: inherit; cursor: pointer;
  }
  .metadataSuggestion:hover, .metadataSuggestion:focus { background: var(--accent-dim); outline: none; }
  .panel-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    padding-bottom: 10px; border-bottom: 1px solid var(--border);
  }

  /* Save dialog */
  .field-label { font-size: 12px; color: var(--sub); display: block; margin-top: 10px; letter-spacing: 0.01em; }
  #saveDialogPanel input[type="text"], #saveDialogPanel select,
  #customAddPanel input[type="text"], #customAddPanel select,
  #editItemPanel input[type="text"], #editItemPanel select {
    width: 100%; padding: 9px 11px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--bg-soft); color: var(--text); font-size: 16px; margin-top: 4px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #saveDialogPanel input[type="text"]:focus, #saveDialogPanel select:focus,
  #customAddPanel input[type="text"]:focus, #customAddPanel select:focus,
  #editItemPanel input[type="text"]:focus, #editItemPanel select:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); outline: none;
  }
  #customAddPanel textarea, #editItemPanel textarea {
    width: 100%; padding: 9px 11px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--bg-soft); color: var(--text); font-size: 14px; margin-top: 4px;
    font-family: inherit; resize: vertical;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #customAddPanel textarea:focus, #editItemPanel textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); outline: none;
  }
  #newFolderRow, #customNewFolderRow, #editNewFolderRow { display: none; gap: 8px; margin-top: 8px; }
  #newFolderRow input, #customNewFolderRow input, #editNewFolderRow input { flex: 1; }
  .seriesNewRow { display: none; margin-top: 8px; }
  .seriesNewRow input { width: 100%; }
  .doujinSourceRow { display: none; }
  input[readonly] { color: var(--sub) !important; background: var(--panel-2) !important; }
  input:disabled { opacity: .55; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  /* Saved list */
  #savedListPanel, #mangaListSection, #videoListSection { background: var(--bg); }
  #listToolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  #listFolderTitle { flex: 1; font-size: 14px; font-weight: 700; }
  #listNewFolderRow { display: none; gap: 8px; margin-bottom: 10px; }
  #listNewFolderRow input {
    flex: 1; padding: 9px 11px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--bg-soft); color: var(--text); font-size: 16px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #listNewFolderRow input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); outline: none; }
  #savedListItems { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 7px; background: var(--bg); }
  .saved-item {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 11px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .saved-item:hover { border-color: #353c4c; background: var(--panel-2); }
  .saved-item .url-text, .saved-item .item-text {
    flex: 1; overflow: hidden; cursor: pointer; min-width: 0;
  }
  .folder-name { font-size: 14px; font-weight: 700; }
  .saved-item .item-title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .saved-item .item-url { font-size: 11px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .saved-item .url-text:hover, .saved-item .item-text:hover .item-title { color: var(--accent); }
  .chevron { color: var(--sub); font-size: 16px; }
  .saved-item button {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 5px;
    padding: 4px 9px; cursor: pointer; font-size: 12px; white-space: nowrap; flex-shrink: 0;
    transition: filter 0.15s ease;
  }
  .saved-item button:hover { filter: brightness(1.2); }
  #savedListEmpty { color: var(--sub); font-size: 13px; text-align: center; padding: 24px 0; }

  /* Table of contents (目次) list */
  #tocListItems { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 7px; }
  .toc-item {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 11px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .toc-item:hover { border-color: #353c4c; background: var(--panel-2); }
  .toc-item .toc-text { flex: 1; overflow: hidden; cursor: pointer; min-width: 0; }
  .toc-item .toc-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toc-item .toc-page { font-size: 11px; color: var(--sub); }
  .toc-item .toc-text:hover .toc-name { color: var(--accent); }
  .toc-item button {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 5px;
    padding: 4px 9px; cursor: pointer; font-size: 12px; white-space: nowrap; flex-shrink: 0;
    transition: filter 0.15s ease;
  }
  .toc-item button:hover { filter: brightness(1.2); }
  #tocListEmpty { color: var(--sub); font-size: 13px; text-align: center; padding: 24px 0; }

  /* Bookshelf grid: shown inside a folder, like a Kindle library — page-1
     cover thumbnails lined up instead of plain text rows. */
  #savedListItems.bookshelf {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr));
    gap: 18px 12px; align-items: start;
  }
  .book-card {
    cursor: pointer; display: flex; flex-direction: column; gap: 6px;
    animation: bookFadeIn 0.25s var(--ease) both;
  }
  @keyframes bookFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .book-card.reorder-card { cursor: default; }
  .book-card.just-closed .book-cover {
    border: 3px solid #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.24), 0 5px 16px rgba(34,197,94,.28);
  }
  .book-card.just-closed .book-title { color: #15803d; font-weight: 800; }
  .book-cover {
    position: relative; width: 100%; aspect-ratio: 2 / 3; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 9px; overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: transform 0.18s var(--ease), box-shadow 0.18s var(--ease), border-color 0.18s var(--ease);
  }
  .book-card:not(.reorder-card):hover .book-cover {
    transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: #3a4156;
  }
  .book-card:not(.reorder-card):active .book-cover { transform: scale(0.96) translateY(0); }
  .book-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .book-title {
    font-size: 11.5px; color: var(--text); text-align: center;
    white-space: normal; overflow: visible; overflow-wrap: anywhere;
  }
  .book-series {
    font-size: 10px; color: var(--accent-2); text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: rgba(70,217,194,0.14); border-radius: 8px; padding: 1px 7px;
    align-self: center; max-width: 100%;
  }
  .book-author { font-size: 10px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .book-tags { display: flex; flex-wrap: wrap; gap: 3px; min-height: 0; }
  .book-tag { max-width: 100%; padding: 2px 5px; border-radius: 6px; background: #edf2ff; color: #3657a7; font-size: 9px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .checkRow { display: flex; align-items: center; gap: 9px; margin: 14px 0 4px; font-size: 13px; color: var(--text); cursor: pointer; }
  .checkRow input { width: 18px; height: 18px; accent-color: var(--accent); flex: 0 0 auto; }
  .book-delBtn {
    position: absolute; top: 4px; right: 4px; width: 21px; height: 21px; line-height: 19px;
    text-align: center; border-radius: 50%; background: rgba(10,12,17,0.78); color: var(--text);
    border: 1px solid rgba(255,255,255,0.08); font-size: 13px; cursor: pointer; padding: 0;
    backdrop-filter: blur(3px); transition: filter 0.15s ease;
  }
  .book-delBtn:hover { filter: brightness(1.3); }
  .book-favBtn {
    position: absolute; bottom: 4px; right: 4px; width: 23px; height: 23px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; background: rgba(10,12,17,0.78); color: var(--text);
    border: 1px solid rgba(255,255,255,0.08); cursor: pointer; padding: 0;
    backdrop-filter: blur(3px); transition: filter 0.15s ease, transform 0.15s ease;
  }
  .book-favBtn:hover { filter: brightness(1.3); transform: scale(1.08); }
  .book-favBtn img { width: 13px; height: 13px; }
  /* 本棚は横並びのため、編集時は左右の大きな移動ボタンを表示する。 */
  .book-moveBtn {
    position: absolute; top: 50%; width: 34px; height: 38px; line-height: 34px;
    text-align: center; border-radius: 10px; background: rgba(255,255,255,.96); color: #1d1d1f;
    border: 1px solid rgba(0,0,0,.14); box-shadow: 0 2px 8px rgba(0,0,0,.28);
    font-size: 23px; font-weight: 800; cursor: pointer; padding: 0; transform: translateY(-50%);
    transition: filter 0.15s ease, transform 0.15s ease;
  }
  .book-moveBtn:hover { filter: brightness(1.06); transform: translateY(-50%) scale(1.06); }
  .book-moveUpBtn { left: 5px; }
  .book-moveDownBtn { right: 5px; }
  .book-moveBtn:disabled { opacity: 0.3; cursor: not-allowed; }
  /* Folder card: same Kindle-shelf card shape as a book, but shows a folder
     glyph instead of a page-1 cover thumbnail (used at every level now, not
     just inside a folder). */
  .folder-cover {
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, var(--panel-2), var(--bg-soft));
  }
  .folder-cover img { width: 40%; height: auto; opacity: 0.85; }

  /* Export/import */
  #exportImportRow {

  }

  /* ---- Video feature ---- */
  /* Tab row inside savedListPanel */
  #listTabRow {
    display: flex; gap: 0; border-bottom: 1px solid var(--border);
    margin: 0 -18px 12px; padding: 0 18px;
  }
  .listTab {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--sub); cursor: pointer; font-size: 13.5px; font-weight: 500;
    padding: 8px 16px; margin-bottom: -1px;
    transition: color 0.15s, border-color 0.15s;
  }
  .listTab.active { color: var(--accent); border-bottom-color: var(--accent); }
  /* Manga section / video section both fill the flex column and scroll */
  #mangaListSection { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
  #videoListSection { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
  #videoListToolbar {
    display: flex; gap: 8px; padding: 6px 0 10px;
    border-bottom: 1px solid var(--border); margin-bottom: 8px; flex-shrink: 0;
  }
  #videoListItems { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  #videoListEmpty { color: var(--sub); font-size: 13px; padding: 20px 0; text-align: center; }
  .videoGroup { margin-bottom: 14px; }
  .videoGroupHeader {
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    color: var(--sub); padding: 3px 0 6px; border-bottom: 1px solid var(--border); margin-bottom: 6px;
  }
  .videoItem {
    display: flex; align-items: center; gap: 8px; padding: 9px 11px;
    border-radius: var(--radius-sm); background: var(--bg-soft); cursor: pointer;
    border: 1px solid var(--border); transition: background 0.15s, border-color 0.15s;
  }
  .videoItem:hover { background: var(--panel-2); border-color: var(--accent); }
  .videoItemTitle { flex: 1; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .videoItemId { font-size: 11px; color: var(--sub); flex-shrink: 0; }
  .videoDeleteBtn {
    background: none; border: none; color: var(--sub); cursor: pointer;
    font-size: 13px; padding: 3px 6px; border-radius: 4px; flex-shrink: 0;
    transition: color 0.15s, background 0.15s;
  }
  .videoDeleteBtn:hover { color: var(--accent); background: var(--accent-dim); }
  /* Video add dialog */
  #videoAddPanel input[type="text"] {
    width: 100%; padding: 9px 11px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--bg-soft); color: var(--text); font-size: 16px; margin-top: 4px;
    transition: border-color 0.15s ease;
  }
  #videoAddPanel input[type="text"]:focus {
    border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-dim);
  }
  #videoPreviewUrl { font-size: 11px; color: var(--sub); margin-top: 8px; word-break: break-all; min-height: 16px; }
  #videoAddActions { display: flex; justify-content: flex-end; margin-top: 16px; }
  /* Video player overlay — sits above other modals */
  #videoPlayerOverlay { z-index: 60; }
  #videoPlayerPanel {
    background: var(--panel); border-radius: 14px;
    width: min(900px, 95vw); display: flex; flex-direction: column;
    border: 1px solid var(--border); box-shadow: var(--shadow-md);
    animation: panelRise 0.22s var(--ease); overflow: hidden;
  }
  #videoPlayerHeader {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    font-size: 14px; font-weight: 600;
  }
  /* 16:9 responsive iframe container */
  #videoPlayerFrame { position: relative; width: 100%; padding-bottom: 56.25%; }
  #videoPlayerIframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

  /* 2026 responsive refresh: calm, native-feeling surfaces with iPhone-first density. */

  .book-delBtn, .book-favBtn {

  input, select, textarea { border-color: var(--border) !important; background: #fff !important; color: var(--text) !important; }

  @media (max-width: 600px) {
    /* Keep the reader controls inside the viewport on narrow phones.
       The old horizontal scroller was especially awkward on iPhone SE. */
    #topbar {

    #mobileMoreMenu { position: absolute; top: calc(100% + 6px); right: 8px; display: none; flex-direction: column; gap: 5px; min-width: 150px; padding: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-md); z-index: 30; }

    #currentTitle { min-width: 0; max-width: 100%; flex: 1 1 auto; }
    #controls {
      display: grid !important; grid-template-columns: 28px 28px minmax(40px, 1fr) 42px 28px 28px 34px;
      gap: 4px; overflow: hidden; padding-left: 6px; padding-right: 6px;

    #pageSlider { width: 100%; min-width: 0; flex: none; }

    #nextVolumeBanner { bottom: 76px; gap: 8px; padding: 8px 10px; }

    #savedListPanel { height: auto; }
    #listTabRow { margin-left: -14px; margin-right: -14px; padding-left: 14px; }

    #smartListRow { gap: 6px; padding-bottom: 10px; }

    #savedListItems.bookshelf { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px 8px; }
    .book-cover { border-radius: 9px; }
    .book-delBtn, .book-favBtn { width: 28px; height: 28px; min-width: 28px; min-height: 28px; }
    .book-delBtn { top: 4px; right: 4px; }
    .book-favBtn { right: 4px; bottom: 4px; }
    .book-title { font-size: 10.5px; }
    .book-series { font-size: 8px; }
    .book-reading { font-size: 8px; }
    .dialog-actions { position: sticky; bottom: 0; padding-top: 10px; background: linear-gradient(transparent, var(--panel) 25%); }
  }

<script src="vault-session.js?v=20260813-vault-state"></script>
<script>
(() => {
  const sessionKey = 'mangaReaderSupabaseSession';
  const loginUrl = 'index.html';
  const vaultUrl = 'sync.html';
  const showLogin = () => window.location.replace(loginUrl);
  try {
    const session = JSON.parse(localStorage.getItem(sessionKey) || 'null');
    const config = window.MANGA_READER_SUPABASE || {};
    if (!session || !session.refresh_token || !config.url || !config.publishableKey) { showLogin(); return; }
    if (!window.MangaVault || !MangaVault.loadActive()) { window.location.replace(vaultUrl); return; }
    fetch(config.url + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', headers: { apikey: config.publishableKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    }).then(async (response) => {
      if (!response.ok) throw new Error('session expired');
      localStorage.setItem(sessionKey, JSON.stringify(await response.json()));
      document.documentElement.classList.remove('auth-pending');
    }).catch(() => { localStorage.removeItem(sessionKey); showLogin(); });
  } catch (_) { localStorage.removeItem(sessionKey); showLogin(); }
})();
</script>

    <div class="panel-header">
      <span>動画を追加</span>
      <button class="ctrlBtn" id="cancelVideoAddBtn" type="button">キャンセル</button>
    </div>
    <label class="field-label" for="videoUrlInput">URLから自動入力（任意）</label>
    <input id="videoUrlInput" type="url" placeholder="https://www.example.com/v/0000/...">
    <label class="field-label" for="videoTitleInput">タイトル（省略可）</label>
    <input id="videoTitleInput" type="text" placeholder="タイトル">
    <label class="field-label" for="videoAInput">A（サービス名・英数字）</label>
    <input id="videoAInput" type="text" placeholder="例: youtube">
    <label class="field-label" for="videoBInput">B（動画ID・数字）</label>
    <input id="videoBInput" type="text" inputmode="numeric" placeholder="例: 12345678">
    <div id="videoPreviewUrl"></div>
    <div id="videoAddActions">
      <button class="primaryBtn" id="confirmVideoAddBtn" type="button">追加</button>
    </div>
  </div>
</div>

<!-- Video player overlay -->
<div id="videoPlayerOverlay" class="modalOverlay">
  <div id="videoPlayerPanel">
    <div id="videoPlayerHeader">
      <span id="videoPlayerTitle"></span>
      <button class="ctrlBtn" id="closeVideoPlayerBtn" type="button">閉じる</button>
    </div>
    <div id="videoPlayerFrame">
      <iframe id="videoPlayerIframe" frameborder="0" allowfullscreen
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
      </iframe>
    </div>
  </div>
</div>

  function clampByte(value) {
    return Math.max(0, Math.min(255, Math.round(value)));
  }

  function histogramPercentile(histogram, total, percentile) {
    const target = Math.max(1, Math.floor(total * percentile));
    let count = 0;
    for (let value = 0; value < histogram.length; value++) {
      count += histogram[value];
      if (count >= target) return value;
    }
    return histogram.length - 1;
  }

  // Analyze luminance locally, then apply conservative auto-levels while
  // preserving each pixel's color ratio. This improves washed-out or dark
  // scans without sending the source image anywhere.
  function autoCorrectImageData(imageData) {
    const data = imageData.data;
    const pixelCount = data.length / 4;
    if (!pixelCount) return false;

    const histogram = new Uint32Array(256);
    const sampleStride = Math.max(1, Math.ceil(pixelCount / IMAGE_ENHANCE_SAMPLE_LIMIT));
    let sampleCount = 0;
    let luminanceSum = 0;
    for (let pixel = 0; pixel < pixelCount; pixel += sampleStride) {
      const offset = pixel * 4;
      const luminance = 0.2126 * data[offset] + 0.7152 * data[offset + 1] + 0.0722 * data[offset + 2];
      histogram[Math.max(0, Math.min(255, Math.round(luminance)))]++;
      luminanceSum += luminance;
      sampleCount++;
    }

    const blackPoint = histogramPercentile(histogram, sampleCount, 0.02);
    const whitePoint = histogramPercentile(histogram, sampleCount, 0.98);
    const range = Math.max(32, whitePoint - blackPoint);
    const mean = luminanceSum / Math.max(1, sampleCount) / 255;
    const normalizedMean = Math.max(0.08, Math.min(0.92, (mean * 255 - blackPoint) / range));
    const gamma = normalizedMean < 0.42
      ? Math.max(0.84, Math.min(1, Math.log(0.52) / Math.log(normalizedMean)))
      : 1;
    const shouldChange = blackPoint > 8 || whitePoint < 247 || gamma !== 1;
    if (!shouldChange) return false;

    for (let offset = 0; offset < data.length; offset += 4) {
      const luminance = 0.2126 * data[offset] + 0.7152 * data[offset + 1] + 0.0722 * data[offset + 2];
      const normalized = Math.max(0, Math.min(1, (luminance - blackPoint) / range));
      const corrected = Math.pow(normalized, gamma);
      const source = luminance / 255;
      const ratio = source > 0.015 ? corrected / source : corrected > 0 ? corrected / 0.015 : 0;
      data[offset] = clampByte(data[offset] * ratio);
      data[offset + 1] = clampByte(data[offset + 1] * ratio);
      data[offset + 2] = clampByte(data[offset + 2] * ratio);
    }
    return true;
  }

  function loadEnhancementSource(src) {
    return new Promise((resolve, reject) => {
      const source = new Image();
      let settled = false;
      const finish = (callback, value) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        callback(value);

      source.decoding = 'async';

      source.onload = () => finish(resolve, source);

    const source = await loadEnhancementSource(src);

    if (!sourcePixels) return null;
    const scale = Math.min(1, Math.sqrt(IMAGE_ENHANCE_MAX_PIXELS / sourcePixels));
    const width = Math.max(1, Math.round(source.naturalWidth * scale));
    const height = Math.max(1, Math.round(source.naturalHeight * scale));
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const context = canvas.getContext('2d', { willReadFrequently: true });
    if (!context) return null;
    context.drawImage(source, 0, 0, width, height);
    let imageData;
    try {
      imageData = context.getImageData(0, 0, width, height);
    } catch (error) {
      return null;

    if (!autoCorrectImageData(imageData)) return { url: '', analyzed: true };
    context.putImageData(imageData, 0, 0);
    const blob = await canvasToBlob(canvas);
    return { url: blob ? URL.createObjectURL(blob) : '', analyzed: true };

  // ---------- standalone page-count detection (independent of the reader) ----------
  // detectMorePages() drives the *currently open* manga's `pages` array and
  // deliberately aborts the moment readingGeneration changes (closeManga,
  // switching manga, etc.) — that's correct for it, since continuing would
  // mean writing into a `pages` array nobody is looking at anymore. But it
  // means: open a brand-new manga just to bookmark it, close it right away,
  // and the page count may only be partially detected.
  //
  // These helpers probe a manga purely by its key (the normalized base URL,
  // i.e. what mangaCacheKeyFor()/parseInputUrl() produce) and never touch
  // pages/baseUrl/preferredExt/readingGeneration. IMPORTANT: never start one
  // of these while detectMorePages is still actively working on the *same*
  // manga — running both at once doubles the parallel image requests for the
  // same page numbers, which can exceed the browser's per-origin connection
  // limit and make a perfectly real page time out and look "missing" (seen
  // in practice: a manga with dozens of pages getting stuck at 3). So this is
  // only ever kicked off (a) once detectMorePages has already stopped for
  // that manga (see handOffIncompleteDetection, called right before
  // readingGeneration changes in startReading/closeManga), continuing from
  // pages.length+1 — never page 1 again — or (b) for an item that isn't the
  // one currently open at all (編集 dialog's 「ページ数を取得」 button).
  const pageCountDetectionInProgress = new Set();

  async function probePageAt(key, n, extHint, numberWidth, pattern) {
    const order = extHint != null
      ? [extHint, ...EXT_CANDIDATES.map((_, i) => i).filter((i) => i !== extHint)]
      : EXT_CANDIDATES.map((_, i) => i);
    let timedOut = false;
    for (const idx of order) {
      const url = pageUrlFor(key, n, idx, numberWidth, pattern);
      const result = await loadImageResult(url);
      if (result === 'loaded') return { kind: 'found', url: url, ext: idx };
      if (result === 'timeout') timedOut = true;
    }
    return { kind: timedOut ? 'timeout' : 'missing' };
  }

  // Probes forward from page `fromCount + 1`, batching DETECT_BATCH_SIZE at a
  // time exactly like detectMorePages. onProgress(count, ext), if given, is
  // called after every batch so callers can persist partial progress as it
  // happens (not just at the very end).
  async function runPageCountLoop(key, fromCount, ext, numberWidth, onProgress, pattern) {
    let count = fromCount;
    let curExt = ext;
    while (true) {
      const batchNums = [];
      for (let n = count + 1; n <= count + DETECT_BATCH_SIZE && n <= MAX_PAGES_SAFETY; n++) batchNums.push(n);
      if (!batchNums.length) return { count, ext: curExt, hitLimit: true, state: 'complete', retryFrom: null };
      const results = await Promise.all(batchNums.map((n) => probePageAt(key, n, curExt, numberWidth, pattern)));
      let endState = null;
      for (const r of results) {
        if (r.kind !== 'found') { endState = r.kind; break; }
        curExt = r.ext;
        count++;
      }
      if (onProgress) onProgress(count, curExt);
      if (endState) return { count, ext: curExt, hitLimit: false, state: endState === 'timeout' ? 'retryable' : 'complete', retryFrom: endState === 'timeout' ? count + 1 : null };
      if (count >= MAX_PAGES_SAFETY) return { count, ext: curExt, hitLimit: true, state: 'complete', retryFrom: null };
    }
  }

  async function detectPageCountForKey(key, fromCount, extHint, numberWidth, onProgress, pattern) {
    if (fromCount > 0) return runPageCountLoop(key, fromCount, extHint, numberWidth, onProgress, pattern);
    const first = await probePageAt(key, 1, null, numberWidth, pattern);
    if (first.kind !== 'found') return { count: 0, ext: 0, hitLimit: false, state: first.kind === 'timeout' ? 'retryable' : 'unavailable', retryFrom: first.kind === 'timeout' ? 1 : null };
    return runPageCountLoop(key, 1, first.ext, numberWidth, onProgress, pattern);
  }

  // opts.force: 既にキャッシュ済みでも取得し直す（編集ダイアログの明示ボタン用）。
  // opts.onDone(result|null): 完了時コールバック（result===nullは1ページ目すら
  // 見つからなかった場合）。同じkeyに対して同時に1つだけ走らせる。
  function ensurePageCountDetected(key, opts) {
    const o = opts || {};
    if (!key || pageCountDetectionInProgress.has(key)) {
      if (o.onDone) o.onDone(undefined); // already running — caller can ignore
      return Promise.resolve(undefined);
    }
    const cached = getCachedMangaInfo(key);
    if (!o.force && cached && cached.state !== 'retryable') {
      if (o.onDone) o.onDone(cached);
      return Promise.resolve(cached);
    }
    const fromCount = o.retry && cached ? Number(cached.count) || 0 : 0;
    const extHint = o.retry && cached ? cached.ext : null;
    const numberWidth = Math.max(1, Number(o.numberWidth || (cached && cached.numberWidth)) || 1);
    const pattern = o.pattern || (cached && cached.pattern) || null;
    pageCountDetectionInProgress.add(key);
    const task = detectPageCountForKey(key, fromCount, extHint, numberWidth, (count, ext) => {
      setCachedMangaInfo(key, { ext: ext, count: count, numberWidth: numberWidth, pattern: pattern, hitLimit: false, state: 'retryable', retryFrom: count + 1 });
      if (o.onProgress) o.onProgress(count, ext);
    }, pattern)
      .then((result) => {
        if (result) setCachedMangaInfo(key, { ext: result.ext, count: result.count, numberWidth: numberWidth, pattern: pattern, hitLimit: result.hitLimit, state: result.state || 'complete', retryFrom: result.retryFrom || null });
        if (o.onDone) o.onDone(result);
        return result;
      })
      .catch(() => { if (o.onDone) o.onDone(null); })
      .finally(() => { pageCountDetectionInProgress.delete(key); });
    return task;
  }

  // detectMorePagesがreadingGenerationの変化で中断された直後にだけ呼ぶ想定の
  // 引き継ぎ専用ルート。pages.length（既に確定済みの最後のページ）の続きから
  // 始めるので、止まった時点のページをもう一度確認したりはしない。
  function continuePageCountDetection(key, fromCount, ext, numberWidth, pattern) {
    if (!key || fromCount <= 0 || pageCountDetectionInProgress.has(key)) return;
    pageCountDetectionInProgress.add(key);
    runPageCountLoop(key, fromCount, ext, numberWidth, (count, curExt) => {
      setCachedMangaInfo(key, { ext: curExt, count, numberWidth, pattern: pattern, hitLimit: false, state: 'retryable', retryFrom: count + 1 });
    }, pattern)
      .then((result) => {
        setCachedMangaInfo(key, { ext: result.ext, count: result.count, numberWidth, pattern: pattern, hitLimit: result.hitLimit, state: result.state || 'complete', retryFrom: result.retryFrom || null });
      })
      .catch(() => {})
      .finally(() => { pageCountDetectionInProgress.delete(key); });
  }

  // detectMorePagesがまだ終わっていない状態でreadingGenerationが変わる
  // （別の漫画を開く／閉じる）直前に呼ぶ。続きをcontinuePageCountDetectionに
  // 引き継いでから呼び出し元がgenerationを進める想定なので、detectMorePages
  // 自身とは絶対に同時に走らない。
  function handOffIncompleteDetection() {
    if (detecting && !detectionDone && baseUrl && pages.length > 0) {
      continuePageCountDetection(baseUrl, pages.length, preferredExt, pageNumberWidth, pagePattern);
    }
  }

  // Normalizes a raw URL (which might be missing a scheme, have a trailing
  // page filename, a stray query string, etc.) to the same baseUrl key that
  // startReading() itself will end up using — so a cache entry written while
  // actually reading a manga is reliably found again when later just
  // preloading/previewing it as a swipe neighbor, and vice versa.
  function mangaCacheKeyFor(url) {
    const parsed = parseInputUrl(url);
    return parsed ? parsed.baseUrl : (url || '');
  }

  // ---------- table of contents (目次) ----------
  // Chapter markers are stored per-manga, keyed the same way as the resume
  // page (currentResumeKey: baseUrl for normal manga, 'custom:<id>' for a
  // 個別追加 manga), so each manga keeps its own independent 目次.
  function loadTocMap() {
    try { return JSON.parse(localStorage.getItem(TOC_KEY) || '{}'); } catch (e) { return {}; }
  }
  function persistTocMap(map) {
    try { localStorage.setItem(TOC_KEY, JSON.stringify(map)); } catch (e) {}
    scheduleCloudSync();
  }
  function loadCurrentToc() {
    const map = loadTocMap();
    currentToc = (map[currentResumeKey] || []).slice().sort((a, b) => a.page - b.page);
    updateTocButtonVisibility();
  }
  function saveCurrentToc() {
    const map = loadTocMap();
    if (currentToc.length) map[currentResumeKey] = currentToc;
    else delete map[currentResumeKey];
    persistTocMap(map);
    updateTocButtonVisibility();
  }
  function updateTocButtonVisibility() {
    els.tocBtn.style.display = currentToc.length ? '' : 'none';
  }

  function addTocEntry() {
    if (!pages.length) { flashStatus('表示中の作品がありません'); return; }
    const existing = currentToc.find((t) => t.page === currentPage);
    const defaultName = existing ? existing.name : ('第' + (currentToc.length + 1) + '章');
    const name = window.prompt('目次名を入力してください（' + currentPage + 'ページ目をここで区切ります）', defaultName);
    if (name === null) return; // cancelled
    const trimmed = name.trim() || defaultName;
    currentToc = currentToc.filter((t) => t.page !== currentPage);
    currentToc.push({ page: currentPage, name: trimmed });
    currentToc.sort((a, b) => a.page - b.page);
    saveCurrentToc();
    flashStatus('目次に追加しました');
  }

  // Cuts out the page range from toc entry `t` (inclusive) up to (but not
  // including) the next toc entry's page — or to the manga's last page if
  // `t` is the last entry — and saves that slice as its own independent
  // "custom" (explicit page-list) item in the saved list, so a long manga
  // split into 目次 chapters can be pulled out chapter-by-chapter into its
  // own bookshelf entry.
  function saveTocRangeAsBook(t, idx) {
    if (!pages.length) { flashStatus('表示中の作品がありません'); return; }
    const nextEntry = currentToc[idx + 1];
    const endPage = nextEntry ? nextEntry.page - 1 : displayedPageCount();
    if (endPage < t.page) { flashStatus('ページ範囲が不正です'); return; }
    const pageUrls = pages.slice(sourcePageIndex(t.page), sourcePageIndex(endPage) + 1);
    const title = window.prompt('切り出して保存する本のタイトルを入力してください（' + t.page + '〜' + endPage + 'ページ）', t.name);
    if (title === null) return; // cancelled
    const trimmed = title.trim() || t.name;
    savedItems.unshift({
      id: genId('i'),
      title: trimmed,
      folderId: null,
      pages: pageUrls,
      splitSpreads: splitSpreads,
      addedAt: Date.now(),
    });
    persistAll();
    flashStatus(pageUrls.length + 'ページを「' + trimmed + '」として保存しました');
  }

  function renderTocList() {
    els.tocListItems.innerHTML = '';
    if (!currentToc.length) {
      els.tocListEmpty.style.display = 'block';
      return;
    }
    els.tocListEmpty.style.display = 'none';
    const tocFrag = document.createDocumentFragment();
    currentToc.forEach((t, idx) => {
      const row = document.createElement('div');
      row.className = 'toc-item';

      const text = document.createElement('div');
      text.className = 'toc-text';
      const nameEl = document.createElement('div');
      nameEl.className = 'toc-name';
      nameEl.textContent = t.name;
      const pageEl = document.createElement('div');
      pageEl.className = 'toc-page';
      pageEl.textContent = t.page + 'ページ';
      text.appendChild(nameEl);
      text.appendChild(pageEl);
      text.addEventListener('click', () => {
        closeTocList();
        jumpToPage(t.page);
      });

      const saveBtn = document.createElement('button');
      saveBtn.textContent = '切り出して保存';
      saveBtn.title = 'この目次から次の目次の前までを1つの本として保存';
      saveBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        saveTocRangeAsBook(t, idx);
      });

      const delBtn = document.createElement('button');
      delBtn.textContent = '削除';
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!confirm('「' + t.name + '」を目次から削除します。本当によろしいですか？')) return;
        currentToc = currentToc.filter((x) => x !== t);
        saveCurrentToc();
        renderTocList();
      });

      row.appendChild(text);
      row.appendChild(saveBtn);
      row.appendChild(delBtn);
      tocFrag.appendChild(row);
    });
    els.tocListItems.appendChild(tocFrag);
  }

  function openTocList() {
    if (!currentToc.length) { flashStatus('目次はまだ追加されていません'); return; }
    renderTocList();
    els.tocOverlay.classList.add('show');
  }
  function closeTocList() { els.tocOverlay.classList.remove('show'); }
  function isTocListOpen() { return els.tocOverlay.classList.contains('show'); }

  // ---------- series / next-volume (シリーズ・次の巻) ----------
  // Resolves the series/volume of whatever manga is currently open. Prefers
  // currentItem (set by openItem whenever the manga was opened from a saved
  // item — folder, list, feed, 履歴, resume-as-item, or the 次の巻 banner
  // itself); falls back to matching savedItems by base URL for a manga
  // opened directly via 新規 or a plain-URL resume, so series info still
  // works even without going through the saved list first.
  // Resolves the saved item object behind whatever manga is currently open —
  // prefers currentItem (set by openItem), and otherwise falls back to
  // matching savedItems by base URL, so a manga opened directly via 新規 (or
  // resumed as a plain URL) still resolves to its 履歴 entry once one exists.
  // Returns null for a custom manga with no baseUrl, or a manga that simply
  // has no corresponding saved item at all. Shared by the series/次の巻 lookup
  // and the reader's お気に入り toggle.
  function getCurrentItem() {
    if (currentItem) return currentItem;
    if (currentlyCustom || !baseUrl) return null;
    return savedItems.find((it) => !Array.isArray(it.pages) && it.url && baseUrlKey(it.url) === baseUrlKey(baseUrl)) || null;
  }

  function getCurrentSeriesInfo() {
    const item = getCurrentItem();
    if (!item || !item.series || !item.volume) return null;
    return { series: item.series, volume: item.volume };
  }

  // Keeps the reader's topbar favorite button in sync with the underlying saved
  // item's favorite flag. Hidden entirely when the manga on screen doesn't
  // correspond to any saved item yet (e.g. a brand-new 新規 URL before its
  // 履歴 entry exists).
  function updateFavToggleButton() {
    const item = getCurrentItem();
    if (!item) {
      els.favToggleBtn.style.display = 'none';
      els.readerEditBtn.style.display = 'none';
      updateSaveButtonVisibility();
      return;
    }
    els.favToggleBtn.style.display = '';
    els.readerEditBtn.style.display = '';
    els.favToggleBtn.innerHTML = '';
    els.favToggleBtn.appendChild(makeHeartIcon(!!item.favorite));
    els.favToggleBtn.title = item.favorite ? 'お気に入りから外す' : 'お気に入りに追加';
    updateSaveButtonVisibility();
  }

  // 履歴は読書記録であって、本棚への保存先ではない。履歴しかない作品には
  // 「URLを保存」を出し、いずれかの本棚／フォルダに保存済みなら隠す。
  function hasUnsavedCurrentUrl() {
    const savedToBookshelf = !!baseUrl && savedItems.some((item) =>
      item.folderId !== HISTORY_FOLDER_ID && !Array.isArray(item.pages) && item.url &&
      baseUrlKey(item.url) === baseUrlKey(baseUrl)
    );
    return !!baseUrl && !currentlyCustom && !savedToBookshelf;
  }

  function updateSaveButtonVisibility() {
    els.saveBtn.style.display = hasUnsavedCurrentUrl() ? '' : 'none';
    updateCloseButtonVisibility();
  }

  // リーダーを開いている間は常に閉じるボタンを出す。保存済みかどうかは
  // 表示条件ではなく、閉じる際に確認を出すかだけに使う。
  function updateCloseButtonVisibility() {
    const readerIsOpen = !!baseUrl || currentlyCustom || !!currentItem || pages.length > 0;
    els.closeBtn.style.display = readerIsOpen ? '' : 'none';
  }

  function findNextVolumeItem(seriesInfo) {
    if (!seriesInfo) return null;
    const currentVolume = Number(seriesInfo.volume);
    return savedItems
      .filter((item) => item.series === seriesInfo.series && Number(item.volume) > currentVolume)
      .sort((a, b) => Number(a.volume) - Number(b.volume))[0] || null;
  }

  // Shows/hides the "次の巻" banner based on whether we're truly sitting on
  // the manga's last page (for a normal 連番URL manga, only once page
  // detection has finished — otherwise "last page so far" could just mean
  // detection hasn't caught up yet) and whether a saved item for the next
  // volume of the same series exists.
  function setNextVolumeCover(item) {
    if (!item || !els.nextVolumeCover) return;
    els.nextVolumeCover.alt = itemDisplayTitle(item);
    if (Array.isArray(item.pages) && item.pages.length) els.nextVolumeCover.src = item.pages[0];
    else setupFeedImage(els.nextVolumeCover, item.url, item.numberWidth, item.pagePattern);
  }

  function updateNextVolumeBanner() {
    const atLastPage = pages.length > 0 && currentPage === displayedPageCount() && (currentlyCustom || detectionDone);
    if (!atLastPage || nextVolumeDismissed) { hideNextVolumeBanner(); return; }
    const nextItem = findNextVolumeItem(getCurrentSeriesInfo());
    if (!nextItem) {
      const currentId = getCurrentItem() && getCurrentItem().id;
      const recommendation = savedItems.filter((item) => item.id !== currentId && !Array.isArray(item.pages))
        .sort((a, b) => Number(!a.lastReadAt) - Number(!b.lastReadAt) || Number(!!b.favorite) - Number(!!a.favorite) || Number(b.updatedAt || b.addedAt) - Number(a.updatedAt || a.addedAt))[0];
      if (recommendation) {
        pendingNextVolumeItem = recommendation;
        setNextVolumeCover(recommendation);
        els.nextVolumeText.textContent = 'おすすめ: ' + itemDisplayTitle(recommendation);
        els.nextVolumeBtn.textContent = '読む';
        els.nextVolumeBanner.classList.add('show');
        return;
      }
      hideNextVolumeBanner(); return;
    }
    pendingNextVolumeItem = nextItem;
    setNextVolumeCover(nextItem);
    els.nextVolumeBtn.textContent = '次の巻を読む';
    els.nextVolumeText.textContent = '次の巻: ' + itemDisplayTitle(nextItem);
    els.nextVolumeBanner.classList.add('show');
  }
  function hideNextVolumeBanner() {
    pendingNextVolumeItem = null;
    if (els.nextVolumeCover) els.nextVolumeCover.removeAttribute('src');
    els.nextVolumeBanner.classList.remove('show');
  }

  // folders/items/videos に加えて per-manga info cache（拡張子・既知ページ数）も同梱する。
  // 書き出し/読み込みとクラウド同期の両方で使う共通ペイロード組み立て。
  function buildSyncPayload() {
    return { folders: savedFolders, items: savedItems, videos: savedVideos, authorCards: authorCards, mangaInfo: loadMangaInfoCache(), toc: loadTocMap(), lastPages: (() => { try { return JSON.parse(localStorage.getItem(LAST_PAGE_KEY) || '{}'); } catch (e) { return {}; } })(), theme: document.documentElement.dataset.theme === 'light' ? 'light' : 'dark' };
  }

  // remoteInfo の各エントリでローカルの mangaInfoCache を上書きマージする
  // （ローカルにしかないエントリは消さない）。setCachedMangaInfo と同じ要領で
  // 一度 delete してから入れ直し、最近性の順序を保つ。
  function mergeMangaInfoCache(remoteInfo) {
    if (!remoteInfo || typeof remoteInfo !== 'object') return;
    const cache = loadMangaInfoCache();
    Object.keys(remoteInfo).forEach((key) => {
      delete cache[key];
      cache[key] = remoteInfo[key];
    });
    const keys = Object.keys(cache);
    if (keys.length > MANGA_INFO_CACHE_MAX) {
      keys.slice(0, keys.length - MANGA_INFO_CACHE_MAX).forEach((k) => delete cache[k]);
    }
    persistMangaInfoCache();
  }

  function exportData() {
    const data = buildSyncPayload();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'manga_reader_backup.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // Shared by 読み込み (file import) and クラウドからの読み込み: validates the
  // {folders, items, videos} shape, confirms with the user, then replaces the local
  // list and persists/re-renders. Returns whether the replace happened.
  function applyImportedData(data) {
    if (!data || !Array.isArray(data.folders) || !Array.isArray(data.items)) {
      flashStatus('データの形式が正しくありません');
      return false;
    }
    if (!confirm('読み込んだ内容でローカルのリストを置き換えます。よろしいですか？')) return false;
    savedFolders = data.folders;
    savedItems = data.items;
    if (Array.isArray(data.authorCards)) authorCards = data.authorCards;
    if (Array.isArray(data.videos)) savedVideos = data.videos;
    removeHistoryFolderRecord();
    persistFolders();
    persistItems();
    persistAuthorCards();
    persistSavedVideos();
    if (data.toc && typeof data.toc === 'object') localStorage.setItem(TOC_KEY, JSON.stringify(data.toc));
    if (data.lastPages && typeof data.lastPages === 'object') localStorage.setItem(LAST_PAGE_KEY, JSON.stringify(data.lastPages));
    // ページ数キャッシュは「置き換え」ではなくマージ：他端末で既に読んで
    // ページ数が分かっている作品の情報を取り込みつつ、ローカルにしかない
    // キャッシュは消さない。
    if (data.mangaInfo) mergeMangaInfoCache(data.mangaInfo);
    if (isSavedListOpen()) {
      renderSavedList();
      if (activeListTab === 'video') renderVideoList();
    }
    return true;
  }

  function importDataFromFile(file) {
    file.text().then((text) => {
      let data;
      try { data = JSON.parse(text); } catch (e) { flashStatus('ファイル形式が正しくありません'); return; }
      if (applyImportedData(data)) flashStatus('読み込みました');
    }).catch(() => flashStatus('読み込みに失敗しました'));
  }

  // Cloud synchronization lives in sync.html so the reader itself has no account or vault dialog.
  // Normalizes a base URL for identity comparisons: scheme (http/https) and
  // host case differences shouldn't make two saves count as "different".
  function baseUrlKey(url) {
    try {
      const u = new URL(url);
      return u.hostname.toLowerCase() + u.pathname;
    } catch (e) {
      return (url || '').trim().replace(/^https?:\/\//i, '').toLowerCase();
    }
  }

  // 履歴 is a smart list, not a user-editable folder. Older data may still
  // contain its former folder record, so remove only that display record while
  // preserving the history items themselves.
  function removeHistoryFolderRecord() {
    const before = savedFolders.length;
    savedFolders = savedFolders.filter((folder) => folder.id !== HISTORY_FOLDER_ID);
    return before !== savedFolders.length;
  }

  function relatedReadingItems(item) {
    if (!item) return [];
    if (item.url) {
      const key = baseUrlKey(item.url);
      return savedItems.filter((it) => it.url && baseUrlKey(it.url) === key);
    }
    return [item];
  }

  function recordReading(item) {
    const related = relatedReadingItems(item);
    if (!related.length) return;
    const now = Date.now();
    const lastReadAt = Math.max(0, ...related.map((it) => Number(it.lastReadAt) || 0));
    const previousCount = Math.max(0, ...related.map((it) => Number(it.readCount) || 0));
    const readCount = !lastReadAt || now - lastReadAt >= READING_SESSION_MS ? previousCount + 1 : previousCount;
    related.forEach((it) => {
      it.lastReadAt = now;
      it.readCount = readCount;
    });
    persistItems();
  }

  // A work becomes read after page 5. For a completed short work, its final
  // page is the threshold instead. Until the end is known, a 1–4 page work
  // remains unread rather than being marked early.
  function markCurrentItemReadIfEligible() {
    const item = getCurrentItem();
    if (!item || !pages.length) return;
    const threshold = (currentlyCustom || detectionDone) ? Math.min(5, displayedPageCount()) : 5;
    if (currentPage >= threshold) recordReading(item);
  }

  function unreadOrderItems() {
    // History entries are automatically created reading records, not books to
    // work through. They must never appear in the unread-priority list.
    return savedItems.filter((item) => item.folderId !== HISTORY_FOLDER_ID).sort((a, b) => {
      const aLast = Number(a.lastReadAt) || 0;
      const bLast = Number(b.lastReadAt) || 0;
      if (!aLast && bLast) return -1;
      if (aLast && !bLast) return 1;
      const countDiff = (Number(a.readCount) || 0) - (Number(b.readCount) || 0);
      if (countDiff) return countDiff;
      if (aLast !== bLast) return aLast - bLast;
      return (Number(a.addedAt) || 0) - (Number(b.addedAt) || 0);
    });
  }

  // Auto-adds a newly opened manga to 履歴 (no title prompt: title is derived
  // from the URL). Re-opening the same manga moves its history entry to the
  // top instead of piling up duplicates.
  function addToHistory(url) {
    let historyItem = savedItems.find((it) => it.folderId === HISTORY_FOLDER_ID && baseUrlKey(it.url) === baseUrlKey(url));
    if (historyItem) {
      savedItems = savedItems.filter((it) => it !== historyItem);
    } else {
      historyItem = { id: genId('i'), url, title: deriveTitleFromUrl(url), folderId: HISTORY_FOLDER_ID, addedAt: Date.now() };
    }
    historyItem.numberWidth = pageNumberWidth;
    savedItems.unshift(historyItem);
    persistItems();
    updateCurrentTitleDisplay();
  }

  // If the URL currently being viewed matches a saved item (by base URL),
  // show that item's title in the header; otherwise clear it.
  function updateCurrentTitleDisplay() {
    // Custom items (explicit page list) set their own title directly in
    // startReadingCustom; baseUrl is empty for them, so don't let this
    // baseUrl-keyed lookup clear it (e.g. when an unrelated item is deleted
    // from the saved list while a custom manga is on screen). The favorite
    // button is still refreshed below regardless, since getCurrentItem()
    // handles the custom case itself (via currentItem).
    if (!currentlyCustom) {
      if (!baseUrl) {
        els.currentTitle.textContent = '';
      } else {
        const match = savedItems.find((it) => baseUrlKey(it.url) === baseUrlKey(baseUrl));
        els.currentTitle.textContent = match ? itemDisplayTitle(match) : '';
      }
    }
    updateFavToggleButton();
  }

  function deriveTitleFromUrl(url) {
    try {
      const u = new URL(url);
      const path = u.pathname.replace(/\/+$/, '');
      const seg = path.split('/').filter(Boolean).pop();
      return seg ? decodeURIComponent(seg) : u.hostname;
    } catch (e) { return url; }
  }

  function loadSaved() {
    try { savedFolders = JSON.parse(localStorage.getItem(SAVED_FOLDERS_KEY) || '[]'); }
    catch (e) { savedFolders = []; }
    try { savedItems = JSON.parse(localStorage.getItem(SAVED_ITEMS_KEY) || '[]'); }
    catch (e) { savedItems = []; }

    // migrate from the older flat URL-list format if present and nothing migrated yet
    if (savedItems.length === 0) {
      try {
        const legacy = JSON.parse(localStorage.getItem(LEGACY_SAVED_URLS_KEY) || '[]');
        if (Array.isArray(legacy) && legacy.length) {
          savedItems = legacy.map((it) => ({
            id: genId('i'),
            url: it.url,
            title: deriveTitleFromUrl(it.url),
            folderId: null,
            addedAt: it.addedAt || Date.now(),
          }));
          persistItems();
        }
      } catch (e) {}
    }
    if (removeHistoryFolderRecord()) persistFolders();
    try { savedVideos = JSON.parse(localStorage.getItem(SAVED_VIDEOS_KEY) || '[]'); }
    catch (e) { savedVideos = []; }
    try { authorCards = JSON.parse(localStorage.getItem(AUTHOR_CARDS_KEY) || '[]'); }
    catch (e) { authorCards = []; }
  }
  loadSaved();
  syncAuthorCardsFromSavedItems();

  // ---------- URL parsing ----------
  // Accepts either a folder URL ("https://example.com/manga/test/") or a direct
  // link to a numbered page ("https://example.com/manga/test/1.jpg") and returns
  // the normalized folder URL (always ending in "/") plus an extension hint.
  function parseInputUrl(input) {
    let v = (input || '').trim();
    if (!v) return null;
    if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
    let hintExt = null;
    const m = v.match(/^(.*\/)([^\/]*?)(\d+)([^\/]*)\.([A-Za-z0-9]+)(?:[?#].*)?$/);
    if (m) {
      v = m[1];
      const idx = EXT_CANDIDATES.indexOf(m[5].toLowerCase());
      if (idx !== -1) hintExt = idx;
    } else {
      // strip any query/hash if the user pasted a folder URL with one
      v = v.replace(/[?#].*$/, '');
    }
    if (!v.endsWith('/')) v += '/';
    let numberWidth = m ? m[3].length : null;
    let pattern = null;
    if (m) {
      let prefix = m[2];
      let suffix = m[4];
      // Long numeric identifiers often end with a three-digit page number:
      // ****2026080519001.jpg -> prefix ****2026080519 + page 001.
      // Keep the identifier intact while numbering the final 001/002/... part.
      if (!suffix && m[3].length >= 7 && /[^0-9]/.test(prefix)) {
        prefix += m[3].slice(0, -3);
        numberWidth = 3;
      }
      if (prefix || suffix) pattern = { prefix: prefix, suffix: suffix, width: numberWidth };
    }
    return { baseUrl: v, hintExt: hintExt, numberWidth: numberWidth, pattern: pattern };
  }

  // ---------- image loading / detection ----------
  function loadImageResult(url) {
    return new Promise((resolve) => {
      const img = new Image();
      let done = false;
      const timer = setTimeout(() => {
        if (!done) { done = true; img.src = ''; resolve('timeout'); }
      }, LOAD_TIMEOUT_MS);
      img.onload = () => { if (!done) { done = true; clearTimeout(timer); resolve('loaded'); } };
      img.onerror = () => { if (!done) { done = true; clearTimeout(timer); resolve('missing'); } };
      img.src = url;
    });
  }
  async function loadImage(url) { return (await loadImageResult(url)) === 'loaded'; }

  async function findPageResult(pageNum) {
    const order = [preferredExt, ...EXT_CANDIDATES.map((_, i) => i).filter((i) => i !== preferredExt)];
    let timedOut = false;
    for (const idx of order) {
      const ext = EXT_CANDIDATES[idx];
      const url = pageUrlFor(baseUrl, pageNum, idx, pageNumberWidth, pagePattern);
      const result = await loadImageResult(url);
      if (result === 'loaded') { preferredExt = idx; return { kind: 'found', url: url }; }
      if (result === 'timeout') timedOut = true;
    }
    return { kind: timedOut ? 'timeout' : 'missing', url: null };
  }
  async function findPageUrl(pageNum) { return (await findPageResult(pageNum)).url; }

  // Preloads just page 1 of another manga (used for swipe-list neighbors).
  // Doesn't know the right extension ahead of time, so it cascades through
  // EXT_CANDIDATES like findPageUrl. A successful loadImage() call leaves
  // the browser's image cache primed, so the actual <img> shown later by
  // startReading()/renderPage() (or a live drag neighbor slide) loads
  // instantly. Returns the resolved URL (with extension) once found, or
  // null if none of the candidates loaded — callers use this to populate
  // resolvedListPageUrl for the live vertical drag.
  async function preloadFirstPage(rawUrlForItem, savedNumberWidth, savedPattern) {
    const parsed = parseInputUrl(rawUrlForItem);
    const key = parsed ? parsed.baseUrl : mangaCacheKeyFor(rawUrlForItem);
    const cached = getCachedMangaInfo(key);
    const pattern = savedPattern || (parsed && parsed.pattern) || (cached && cached.pattern) || null;
    const numberWidth = Math.max(1, Number((parsed && parsed.numberWidth) || savedNumberWidth || (cached && cached.numberWidth)) || 1);
    if (cached) {
      // Known from a previous visit — try that extension first instead of
      // blindly cascading through all of them again. Still a real
      // loadImage() check (not a blind guess), so a stale/changed manga
      // falls straight through to the normal cascade below.
      const url = pageUrlFor(key, 1, cached.ext, numberWidth, pattern);
      const ok = await loadImage(url);
      if (ok) return url;
    }
    for (const ext of EXT_CANDIDATES) {
      const url = pageUrlFor(key, 1, EXT_CANDIDATES.indexOf(ext), numberWidth, pattern);
      const ok = await loadImage(url);
      if (ok) return url;
    }
    return null;
  }

  // url: the manga's folder/page URL. addToHistoryFlag: true when this open
  // should be auto-recorded into 履歴 (used for the "新規" button only).
  // switchDirection ('up'/'down') means this call was triggered by a
  // vertical swipe inside the reader (see goToReadingListOffset). In that
  // case we keep the outgoing manga's page on screen instead of blanking to
  // a spinner, so renderPage can do a real vertical slide once the new
  // manga's first page is ready — that's what makes the swipe feel live
  // instead of an instant cut.
  async function startReading(url, addToHistoryFlag, switchDirection) {
    const parsed = parseInputUrl(url);
    if (!parsed) return;
    // Before we move on to the next manga, give the one we were just reading
    // a chance to finish its page count in the background if detectMorePages
    // hadn't gotten there yet (see handOffIncompleteDetection's comment).
    handOffIncompleteDetection();
    // Each call gets its own "generation" number. If a newer startReading()
    // call comes in before this one finishes (e.g. the user opens another
    // manga, or re-opens one from 履歴/list, while the previous one is still
    // detecting pages in the background), the stale call's still-pending
    // findPageUrl()/detectMorePages() work must not be allowed to keep
    // pushing into the shared `pages` array — that's what was causing pages
    // to occasionally show up twice. Every await below is followed by a
    // check that this call is still the current generation.
    const myGeneration = ++readingGeneration;
    baseUrl = parsed.baseUrl;
    pagePattern = parsed.pattern || null;
    currentResumeKey = baseUrl;
    currentlyCustom = false;
    splitSpreads = !!(currentItem && currentItem.splitSpreads);
    pageNumberWidth = Math.max(1, Number(parsed.numberWidth || (currentItem && currentItem.numberWidth)) || 1);
    loadCurrentToc();
    hideNextVolumeBanner();
    preferredExt = parsed.hintExt !== null ? parsed.hintExt : 0;
    try { localStorage.setItem(LAST_URL_KEY, JSON.stringify({ kind: 'url', value: baseUrl })); } catch (e) {}
    updateCurrentTitleDisplay();
    if (addToHistoryFlag) addToHistory(baseUrl);

    pages = [];
    detecting = true;
    detectionDone = false;
    detectionHitLimit = false;
    currentPage = 1;
    pendingResumePage = getResumePage(baseUrl);
    els.readProgressBar.style.width = '0%'; // avoid a stale bar from the previous manga flashing during the lookup

    // Already know this manga from a previous visit — skip the probing
    // entirely and render immediately using the remembered extension/page
    // count. A single background check confirms it's still accurate (and
    // looks for pages added since); see verifyCachedMangaInBackground.
    const cached = getCachedMangaInfo(baseUrl);
    if (cached && cached.count > 0) {
      preferredExt = cached.ext;
      pagePattern = parsed.pattern || cached.pattern || null;
      pageNumberWidth = Math.max(1, Number(parsed.numberWidth || (currentItem && currentItem.numberWidth) || cached.numberWidth) || 1);
      if (Number(cached.numberWidth) !== pageNumberWidth) {
      setCachedMangaInfo(baseUrl, { ...cached, numberWidth: pageNumberWidth, pattern: pagePattern || cached.pattern || null });
      }
      pages = Array.from({ length: cached.count }, (_, i) => pageUrlFor(baseUrl, i + 1, cached.ext, pageNumberWidth, pagePattern));
      els.placeholder.style.display = 'none';
      els.spinner.style.display = 'none';
      els.imgWrap.style.display = 'block';
      els.controls.style.display = 'flex';
      const startPage = pendingResumePage || 1;
      pendingResumePage = null;
      showPage(startPage, switchDirection === 'up' ? 'swipeUp' : switchDirection === 'down' ? 'swipeDown' : switchDirection === 'left' ? 'swipeLeft' : switchDirection === 'right' ? 'swipeRight' : null);
      updateStatus();
      updateCloseButtonVisibility();
      verifyCachedMangaInBackground(myGeneration);
      return;
    }

    if (!switchDirection) {
      // Normal open (新規/list/resume): no prior page to keep showing, so
      // blank to a spinner while page 1 is located, same as always.
      els.placeholder.style.display = 'none';
      els.imgWrap.style.display = 'none';
      els.spinner.style.display = 'block';
    }
    els.status.textContent = '1ページ目を確認中...';

    const firstResult = await findPageResult(1);
    const firstUrl = firstResult.url;
    if (myGeneration !== readingGeneration) return; // superseded while we were checking page 1
    if (!firstUrl) {
      if (firstResult.kind === 'missing') {
        reopenMangaUrlEntry();
        return;
      }
      if (firstResult.kind === 'timeout') {
        // Keep the timeout visible to the bulk retry tool even when page 1
        // could not be obtained. A later retry starts at page 1.
        setCachedMangaInfo(baseUrl, { ext: preferredExt, count: 0, numberWidth: pageNumberWidth, pattern: pagePattern, hitLimit: false, state: 'retryable', retryFrom: 1 });
      }
      els.spinner.style.display = 'none';
      els.imgWrap.style.display = 'none';
      els.placeholder.style.display = 'block';
      els.placeholder.innerHTML =
        (firstResult.kind === 'timeout' ? '1ページ目の読み込みがタイムアウトしました。時間をおいて再試行してください。<br>' : '1ページ目が見つかりませんでした。<br>') +
        '試したURL: ' + EXT_CANDIDATES.map((e) => '<code>' + baseUrl + formatPageNumber(1, pageNumberWidth) + '.' + e + '</code>').join(' / ') + '<br>' +
        'URLや拡張子を確認してください。';
      els.status.textContent = '';
      detecting = false;
      updateCloseButtonVisibility();
      return;
    }

    pages.push(firstUrl);
    els.spinner.style.display = 'none';
    els.imgWrap.style.display = 'block';
    els.controls.style.display = 'flex';
    showPage(1, switchDirection === 'up' ? 'swipeUp' : switchDirection === 'down' ? 'swipeDown' : switchDirection === 'left' ? 'swipeLeft' : switchDirection === 'right' ? 'swipeRight' : null);
    updateStatus();
    updateCloseButtonVisibility();
    detectMorePages(2, myGeneration);
  }

  // ページ番号を1件ずつではなくDETECT_BATCH_SIZE件ずつ並列で確認し、存在しない
  // ページが出てきたバッチでおしまい。バッチ単位でだけUI更新・キャッシュ保存を
  // 行う（毎ページごとの更新はしない＝A-1のスロットリングは維持）。
  async function detectMorePages(startPage, generation) {
    let pageNum = startPage;
    while (true) {
      if (generation !== readingGeneration) return;
      const batchEnd = Math.min(pageNum + DETECT_BATCH_SIZE - 1, MAX_PAGES_SAFETY);
      const batchNums = [];
      for (let n = pageNum; n <= batchEnd; n++) batchNums.push(n);
      const results = await Promise.all(batchNums.map((n) => findPageResult(n)));
      if (generation !== readingGeneration) return;

      let brokeEarly = false;
      let endState = null;
      for (const result of results) {
        if (result.kind !== 'found') { brokeEarly = true; endState = result.kind; break; }
        pages.push(result.url);
        pageNum++;
        if (pendingResumePage !== null && displayedPageCount() >= pendingResumePage) {
          jumpToPage(pendingResumePage);
          pendingResumePage = null;
        }
      }
      updateStatus();
      updateSlider();
      setCachedMangaInfo(baseUrl, { ext: preferredExt, count: pages.length, numberWidth: pageNumberWidth, pattern: pagePattern, hitLimit: false, state: endState === 'missing' ? 'complete' : 'retryable', retryFrom: endState === 'missing' ? null : pages.length + 1 });

      if (brokeEarly || pageNum > MAX_PAGES_SAFETY) {
        detectionHitLimit = pageNum > MAX_PAGES_SAFETY;
        detectionDone = true;
        detecting = false;
        updateStatus();
        updateSlider();
        persistLastPage();
        updateNextVolumeBanner();
        markCurrentItemReadIfEligible();
        setCachedMangaInfo(baseUrl, { ext: preferredExt, count: pages.length, numberWidth: pageNumberWidth, pattern: pagePattern, hitLimit: detectionHitLimit, state: endState === 'timeout' ? 'retryable' : 'complete', retryFrom: endState === 'timeout' ? pages.length + 1 : null });
        return;
      }
    }
  }

  // Once a cached manga (see startReading) has been rendered instantly from
  // the remembered extension/page count, this confirms it's still accurate
  // and looks for anything new past the cached count — without redoing the
  // expensive full probe from page 1. If even page 1 no longer loads (the
  // cache was stale — site moved/changed), falls back to a full re-detection
  // from scratch, same as a never-before-seen manga.
  async function verifyCachedMangaInBackground(generation) {
    const firstResult = await loadImageResult(pages[0]);
    if (generation !== readingGeneration) return;
    if (firstResult === 'timeout') return;
    if (firstResult !== 'loaded') {
      clearCachedMangaInfo(baseUrl);
      pages = [];
      currentPage = 1;
      detecting = true;
      detectionDone = false;
      detectionHitLimit = false;
      els.status.textContent = 'キャッシュが古いようです。再確認中...';
      const recheckedFirst = await findPageResult(1);
      const firstUrl = recheckedFirst.url;
      if (generation !== readingGeneration) return;
      if (!firstUrl) {
        if (recheckedFirst.kind === 'missing') {
          reopenMangaUrlEntry();
          return;
        }
        detecting = false;
        els.imgWrap.style.display = 'none';
        els.placeholder.style.display = 'block';
        els.placeholder.innerHTML =
          '1ページ目の読み込みがタイムアウトしました。時間をおいて再試行してください。<br>' +
          '試したURL: ' + EXT_CANDIDATES.map((e) => '<code>' + baseUrl + formatPageNumber(1, pageNumberWidth) + '.' + e + '</code>').join(' / ') + '<br>' +
          'URLや拡張子を確認してください。';
        els.status.textContent = '';
        updateCloseButtonVisibility();
        return;
      }
      pages = [firstUrl];
      els.placeholder.style.display = 'none';
      els.imgWrap.style.display = 'block';
      els.controls.style.display = 'flex';
      showPage(1, null);
      updateStatus();
      updateCloseButtonVisibility();
      detectMorePages(2, generation);
      return;
    }
    // detectMorePages自身は完了/中断のどちらでもdetecting=falseにするので、ここで
    // trueにしておかないとhandOffIncompleteDetection()がこの続き探索中の中断を
    // 検出できない。
    detecting = true;
    detectionDone = false;
    detectMorePages(pages.length + 1, generation);
  }

  // Opens a "custom" manga: one whose pages were supplied as an explicit,
  // non-sequential URL list via the 個別追加 dialog (see
  // confirmCustomAdd) rather than a base URL + guessed-extension sequence.
  // All pages are already known up front, so there's no async detection
  // loop — just show the (resume) page immediately. switchDirection mirrors
  // startReading's vertical-swipe handling so swiping into a custom manga
  // animates the same way.
  function clearLocalSyncObjectUrls() {
    localSyncObjectUrls.forEach((url) => URL.revokeObjectURL(url));
    localSyncObjectUrls = [];
  }

  function clearLocalCoverObjectUrls() {
    localCoverObjectUrls.forEach((url) => URL.revokeObjectURL(url));
    localCoverObjectUrls = [];
  }

  async function loadLocalCover(item, img) {
    try {
      const session = JSON.parse(localStorage.getItem('mangaReaderSupabaseSession') || 'null');
      const config = window.MANGA_READER_SUPABASE || {};
      const path = (Array.isArray(item.storagePaths) && item.storagePaths[0]) || localStoragePathFromUrl(item.pages && item.pages[0]);
      if (!session || !session.access_token || !path || !config.url) return;
      const encodedPath = path.split('/').map((part) => encodeURIComponent(part)).join('/');
      const blob = await fetchPrivateLocalObject(config, session.access_token, encodedPath);
      if (!blob) return;
      const objectUrl = URL.createObjectURL(blob);
      if (img.isConnected) {
        localCoverObjectUrls.push(objectUrl);
        img.src = objectUrl;
      } else {
        URL.revokeObjectURL(objectUrl);
      }
    } catch (_) {}
  }

  async function fetchPrivateLocalObject(config, token, encodedPath) {
    const headers = { apikey: config.publishableKey, Authorization: 'Bearer ' + token };
    let lastStatus = 0;
    for (const endpoint of ['/storage/v1/object/download/local-manga/', '/storage/v1/object/local-manga/']) {
      const response = await fetch(config.url + endpoint + encodedPath, { headers });
      lastStatus = response.status;
      if (response.ok) return response.blob();
    }
    throw new Error('Storage画像の取得に失敗しました（HTTP ' + lastStatus + '）。');
  }

  function localStoragePathFromUrl(value) {
    try {
      const pathname = new URL(value).pathname;
      const marker = '/storage/v1/object/public/local-manga/';
      if (!pathname.includes(marker)) return '';
      return pathname.slice(pathname.indexOf(marker) + marker.length).split('/').map((part) => decodeURIComponent(part)).join('/');
    } catch (_) { return ''; }
  }

  async function loadPrivateLocalPages(item) {
    if (!item.localSync) return (item.pages || []).slice();
    const session = JSON.parse(localStorage.getItem('mangaReaderSupabaseSession') || 'null');
    const config = window.MANGA_READER_SUPABASE || {};
    const paths = (Array.isArray(item.storagePaths) && item.storagePaths.length ? item.storagePaths : (item.pages || []).map(localStoragePathFromUrl)).filter(Boolean);
    if (!session || !session.access_token || !config.url || paths.length !== (item.pages || []).length) throw new Error('同期画像の保存先情報がありません。もう一度同期してください。');
    clearLocalSyncObjectUrls();
    const urls = [];
    for (const path of paths) {
      const encodedPath = path.split('/').map((part) => encodeURIComponent(part)).join('/');
      const objectUrl = URL.createObjectURL(await fetchPrivateLocalObject(config, session.access_token, encodedPath));
      localSyncObjectUrls.push(objectUrl); urls.push(objectUrl);
    }
    return urls;
  }

  async function startReadingCustom(item, switchDirection) {
    handOffIncompleteDetection(); // 直前の漫画の検出未完了分を引き継ぐ（generationを進める前に）
