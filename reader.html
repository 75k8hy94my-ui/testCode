  // Swaps `item` with its neighbor (direction -1 = up/earlier, +1 =
  // down/later) within `list` (the same flat array currently rendered for
  // this view) by finding both items' real positions in the underlying
  // savedItems array and swapping just those two slots. This works
  // regardless of where the items actually sit in savedItems, since a
  // folder's display order is simply whatever order its items happen to
  // appear in within savedItems.
  function moveItemInList(item, list, direction) {
    const idx = list.indexOf(item);
    const swapIdx = idx + direction;
    if (idx === -1 || swapIdx < 0 || swapIdx >= list.length) return;
    const other = list[swapIdx];
    const realIdxA = savedItems.indexOf(item);
    const realIdxB = savedItems.indexOf(other);
    if (realIdxA === -1 || realIdxB === -1) return;
    savedItems[realIdxA] = other;
    savedItems[realIdxB] = item;
    persistAll();
    renderSavedList();
  }

  function moveFolderInList(folder, list, direction) {
    const idx = list.indexOf(folder);
    const swapIdx = idx + direction;
    if (idx === -1 || swapIdx < 0 || swapIdx >= list.length) return;
    const other = list[swapIdx];
    const realIdxA = savedFolders.indexOf(folder);
    const realIdxB = savedFolders.indexOf(other);
    if (realIdxA === -1 || realIdxB === -1) return;
    savedFolders[realIdxA] = other;
    savedFolders[realIdxB] = folder;
    persistFolders();
    renderSavedList();
  }

  // item.url is undefined for "custom" (explicit page list) items, so
  // title/tooltip fallbacks need to handle that case too.
  function itemDisplayTitle(item) {
    if (item.series && Number(item.volume) > 0) return seriesTitle(item.series, Number(item.volume));
    return item.title || (item.url ? deriveTitleFromUrl(item.url) : '無題');
  }
  function itemSubtext(item) {
    const doujinText = item.isDoujin && item.sourceWork ? '同人誌 ・ 元ネタ: ' + item.sourceWork : '';
    if (item.url) return doujinText ? doujinText + '\n' + item.url : item.url;
    if (Array.isArray(item.pages)) return '個別URL ・ ' + (item.splitSpreads ? item.pages.length * 2 : item.pages.length) + 'ページ';
    return '';
  }

  function itemPageCountText(item) {
    if (Array.isArray(item.pages) && item.pages.length) return (item.splitSpreads ? item.pages.length * 2 : item.pages.length) + 'ページ';
    if (!item.url) return '';
    const info = getCachedMangaInfo(mangaCacheKeyFor(item.url));
    if (!info) return 'ページ数未取得';
    const count = (Number(info.count) || 0) * (item.splitSpreads ? 2 : 1);
    if (info.state === 'retryable') return count ? count + 'ページまで確認済み' : '再試行待ち';
    if (info.state === 'unavailable') return 'ページ数を確認できません';
    return count ? count + 'ページ' : 'ページ数未取得';
  }

  function readingRecordText(item) {
    const lastReadAt = Number(item.lastReadAt) || 0;
    if (!lastReadAt) return '未読';
    const d = new Date(lastReadAt);
    return (Number(item.readCount) || 1) + '回 ・ ' + (d.getMonth() + 1) + '/' + d.getDate();
  }

  // Manga are shown as a Kindle-bookshelf-style grid of page-1 cover
  // thumbnails. Reuses the same cascading-extension cover lookup as the 一覧
  // feed view. Item metadata is edited only from the reader's top-bar button.
  // reorderMode: when true, shows
  // 上下移動 (move up/down) buttons, and disables tap-to-open — so taps in
  // 並べ替え mode can't accidentally open a manga while the user is busy
  // rearranging the shelf.
  function buildBookCard(item, list, reorderMode) {
    const card = document.createElement('div');
    card.className = 'book-card' + (reorderMode ? ' reorder-card' : '') + (item.id === recentlyClosedItemId ? ' just-closed' : '');
    card.title = itemSubtext(item);
    if (bulkEditMode) {
      const select = document.createElement('input');
      select.type = 'checkbox'; select.className = 'bulk-select'; select.checked = bulkSelectedIds.has(item.id);
      select.title = '一括編集の対象にする';
      select.addEventListener('click', (e) => e.stopPropagation());
      select.addEventListener('change', () => { if (select.checked) bulkSelectedIds.add(item.id); else bulkSelectedIds.delete(item.id); updateBulkEditButton(); });
      card.appendChild(select);
    }

    const cover = document.createElement('div');
    cover.className = 'book-cover';
    const img = document.createElement('img');
    img.alt = itemDisplayTitle(item);
    img.loading = 'eager';
    img.decoding = 'async';
    img.fetchPriority = 'low';
    if (Array.isArray(item.pages) && item.pages.length) {
      const source = item.pages[0];
      if (item.localSync) {
        loadLocalCover(item, img);
      } else {
        img.src = coverSourceCache.get(source) || source; // exact URL already known; no extension cascade needed
        img.addEventListener('load', () => coverSourceCache.set(source, img.currentSrc || img.src), { once: true });
      }
    } else {
      setupFeedImage(img, item.url, item.numberWidth, item.pagePattern);
    }
    cover.appendChild(img);

    if (reorderMode) {
      const idx = list.indexOf(item);
      const upBtn = document.createElement('button');
      upBtn.className = 'book-moveBtn book-moveUpBtn';
      upBtn.textContent = '←';
      upBtn.title = '左へ移動';
      upBtn.disabled = idx <= 0;
      upBtn.addEventListener('click', (e) => { e.stopPropagation(); moveItemInList(item, list, -1); });
      cover.appendChild(upBtn);

      const downBtn = document.createElement('button');
      downBtn.className = 'book-moveBtn book-moveDownBtn';
      downBtn.textContent = '→';
      downBtn.title = '右へ移動';
      downBtn.disabled = idx >= list.length - 1;
      downBtn.addEventListener('click', (e) => { e.stopPropagation(); moveItemInList(item, list, 1); });
      cover.appendChild(downBtn);
    } else {
      const favBtn = document.createElement('button');
      favBtn.className = 'book-favBtn';
      const updateFavoriteButton = () => {
        favBtn.replaceChildren(makeHeartIcon(!!item.favorite));
        favBtn.classList.toggle('is-favorite', !!item.favorite);
        favBtn.title = item.favorite ? 'お気に入りから外す' : 'お気に入りに追加';
        favBtn.setAttribute('aria-label', favBtn.title);
        favBtn.setAttribute('aria-pressed', item.favorite ? 'true' : 'false');
      };
      updateFavoriteButton();
      favBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        item.favorite = !item.favorite;
        persistAll();
        updateFavoriteButton();
        if (currentFolderView === FAVORITES_FOLDER_ID && !item.favorite) {
          card.style.transition = 'opacity .16s ease, transform .16s ease';
          card.style.opacity = '0';
          card.style.transform = 'scale(.94)';
          window.setTimeout(() => {
            card.remove();
            if (!els.savedListItems.children.length) {
              els.savedListEmpty.textContent = 'お気に入りはまだ追加されていません';
              els.savedListEmpty.style.display = 'block';
            }
          }, 160);
        }
      });
      cover.appendChild(favBtn);
    }

    const title = document.createElement('div');
    title.className = 'book-title';
    title.textContent = itemDisplayTitle(item);

    card.appendChild(cover);
    card.appendChild(title);
    if (item.series) {
      const seriesEl = document.createElement('div');
      seriesEl.className = 'book-series';
      seriesEl.textContent = 'シリーズ';
      card.appendChild(seriesEl);
    }
    if (item.author) {
      const authorEl = document.createElement('div');
      authorEl.className = 'book-author';
      authorEl.textContent = item.author;
      authorEl.title = item.author;
      card.appendChild(authorEl);
    }
    if (item.isDoujin && item.sourceWork) {
      const sourceWorkEl = document.createElement('div');
      sourceWorkEl.className = 'book-author';
      sourceWorkEl.textContent = '同人誌 ・ ' + item.sourceWork;
      sourceWorkEl.title = '元ネタの作品名: ' + item.sourceWork;
      card.appendChild(sourceWorkEl);
    }
    const tags = Array.isArray(item.tags) ? item.tags.filter(Boolean) : [];
    if (tags.length) {
      const tagsEl = document.createElement('div');
      tagsEl.className = 'book-tags';
      tagsEl.title = tags.join(', ');
      tags.slice(0, 3).forEach((tag) => {
        const tagEl = document.createElement('span');
        tagEl.className = 'book-tag';
        tagEl.textContent = tag;
        tagsEl.appendChild(tagEl);
      });
      if (tags.length > 3) {
        const moreEl = document.createElement('span');
        moreEl.className = 'book-tag';
        moreEl.textContent = '+' + (tags.length - 3);
        tagsEl.appendChild(moreEl);
      }
      card.appendChild(tagsEl);
    }
    const readingEl = document.createElement('div');
    readingEl.className = 'book-reading' + (item.lastReadAt ? '' : ' unread');
    readingEl.textContent = readingRecordText(item) + ' ・ ' + itemPageCountText(item);
    readingEl.title = item.lastReadAt
      ? '最終読書: ' + new Date(Number(item.lastReadAt)).toLocaleString('ja-JP') + ' / ' + (Number(item.readCount) || 1) + '回'
      : 'まだ読んでいません';
    card.appendChild(readingEl);
    if (item.lastReadAt) readingEl.remove();
    else readingEl.textContent = '未読';
    if (!reorderMode && !bulkEditMode) {
      card.addEventListener('click', () => {
        rememberReaderReturnView();
        closeSavedList();
        setReadingListContext(list, list.indexOf(item));
        openItem(item, false);
      });
    }
    return card;
  }

  function normalizeAuthorLinks(links) {
    return (Array.isArray(links) ? links : []).map((link) => ({
      label: String(link && link.label || '').trim(),
      url: String(link && link.url || '').trim()
    })).filter((link) => link.label && /^https?:\/\//i.test(link.url));
  }
  function ensureAuthorCardForName(authorName) {
    const name = String(authorName || '').trim();
    if (!name) return;
    const exists = authorCards.some((card) => card.name === name || card.circleName === name);
    if (exists) return;
    authorCards.unshift({ id: genId('a'), name: name, circleName: '', links: [], createdAt: Date.now() });
    persistAuthorCards();
  }
  function syncAuthorCardsFromSavedItems() {
    let changed = false;
    savedItems.forEach((item) => {
      const name = String(item.author || '').trim();
      if (!name || authorCards.some((card) => card.name === name || card.circleName === name)) return;
      authorCards.unshift({ id: genId('a'), name: name, circleName: '', links: [], createdAt: Date.now() });
      changed = true;
    });
    if (changed) persistAuthorCards();
  }
  function addAuthorLinkRow(link) {
    const row = document.createElement('div');
    row.className = 'author-link-row';
    const label = document.createElement('input');
    label.type = 'text'; label.placeholder = 'サービス名'; label.value = link && link.label || '';
    const url = document.createElement('input');
    url.type = 'url'; url.placeholder = 'https://...'; url.value = link && link.url || '';
    const remove = document.createElement('button');
    remove.type = 'button'; remove.className = 'ctrlBtn author-link-remove'; remove.textContent = '削除';
    remove.addEventListener('click', () => row.remove());
    row.append(label, url, remove);
    els.authorLinksEditor.appendChild(row);
  }
  function openAuthorCardEditor(card) {
    editingAuthorCardId = card ? card.id : null;
    els.authorCardEditorTitle.textContent = card ? '作者カードを編集' : '作者カードを作成';
    els.authorCardNameInput.value = card ? card.name : '';
    els.authorCardCircleInput.value = card ? (card.circleName || '') : '';
    els.authorLinksEditor.replaceChildren();
    (card ? card.links : []).forEach(addAuthorLinkRow);
    if (!card) addAuthorLinkRow();
    els.authorCardEditor.style.display = 'block';
    els.authorCardNameInput.focus();
  }
  function closeAuthorCardEditor() {
    editingAuthorCardId = null;
    els.authorCardEditor.style.display = 'none';
  }
  function renderAuthorCards() {
    els.authorCardList.replaceChildren();
    els.authorCardEmpty.style.display = authorCards.length ? 'none' : 'block';
    authorCards.forEach((card) => {
      const box = document.createElement('div'); box.className = 'author-card';
      const name = document.createElement('div'); name.className = 'author-card-name';
      name.textContent = card.circleName ? card.name + '（' + card.circleName + '）' : card.name;
      const links = document.createElement('div'); links.className = 'author-card-links';
      normalizeAuthorLinks(card.links).forEach((link) => {
        const a = document.createElement('a'); a.href = link.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.textContent = link.label; links.appendChild(a);
      });
      if (!links.children.length) { const empty = document.createElement('span'); empty.style.color = 'var(--sub)'; empty.textContent = 'リンクなし'; links.appendChild(empty); }
      const actions = document.createElement('div'); actions.className = 'author-card-actions';
      const edit = document.createElement('button'); edit.type = 'button'; edit.className = 'ctrlBtn'; edit.textContent = '編集'; edit.addEventListener('click', () => openAuthorCardEditor(card));
      const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'ctrlBtn dangerBtn'; remove.textContent = '削除';
      remove.addEventListener('click', () => { if (!confirm('この作者カードを削除しますか？')) return; authorCards = authorCards.filter((item) => item.id !== card.id); persistAuthorCards(); renderAuthorCards(); });
      actions.append(edit, remove); box.append(name, links, actions);
      box.addEventListener('click', (event) => {
        if (event.target.closest('button, a')) return;
        openAuthorWorks(card);
      });
      els.authorCardList.appendChild(box);
    });
  }
  function openAuthorCards() {
    authorCardReturnToList = isSavedListOpen();
    closeSavedList(); closeAuthorCardEditor(); renderAuthorCards(); els.authorCardOverlay.classList.add('show');
  }
  function closeAuthorCards() {
    closeAuthorCardEditor();
    els.authorCardOverlay.classList.remove('show');
    if (authorCardReturnToList) { authorCardReturnToList = false; openSavedList(false, true); }
  }
  function openAuthorWorks(card) {
    currentFolderView = null;
    currentSeriesView = null;
    currentAuthorView = card.name;
    closeAuthorCards();
    renderSavedList();
  }
  function buildAuthorGroupCard(group) {
    const card = document.createElement('div');
    card.className = 'author-group-card';
    const covers = document.createElement('div'); covers.className = 'author-group-covers';
    group.items.slice(0, 2).forEach((item) => {
      const img = document.createElement('img'); img.alt = itemDisplayTitle(item); img.loading = 'lazy';
      if (Array.isArray(item.pages) && item.pages.length) img.src = item.pages[0];
      else setupFeedImage(img, item.url, item.numberWidth, item.pagePattern);
      covers.appendChild(img);
    });
    const name = document.createElement('div'); name.className = 'author-group-name'; name.textContent = group.name;
    const count = document.createElement('div'); count.className = 'author-group-count'; count.textContent = group.items.length + '作品';
    card.append(covers, name, count);
    card.addEventListener('click', () => openAuthorWorks({ name: group.name }));
    return card;
  }
  function saveAuthorCard() {
    const name = els.authorCardNameInput.value.trim();
    const circleName = els.authorCardCircleInput.value.trim();
    if (!name) { els.authorCardNameInput.focus(); flashStatus('作者名を入力してください'); return; }
    const links = Array.from(els.authorLinksEditor.querySelectorAll('.author-link-row')).map((row) => ({ label: row.children[0].value, url: row.children[1].value }));
    const validLinks = normalizeAuthorLinks(links);
    const duplicate = authorCards.find((card) => card.id !== editingAuthorCardId && [card.name, card.circleName].filter(Boolean).some((value) => value === name || value === circleName));
    if (duplicate) { flashStatus('同じ作者名のカードがすでにあります'); return; }
    if (editingAuthorCardId) {
      const card = authorCards.find((item) => item.id === editingAuthorCardId);
      if (card) { card.name = name; card.circleName = circleName; card.links = validLinks; }
    } else authorCards.unshift({ id: genId('a'), name, circleName, links: validLinks, createdAt: Date.now() });
    persistAuthorCards(); closeAuthorCardEditor(); renderAuthorCards(); flashStatus('作者カードを保存しました');
  }

  function updateBulkEditButton() {
    els.bulkEditBtn.textContent = bulkEditMode ? '選択完了 (' + bulkSelectedIds.size + ')' : '一括編集';
    els.bulkEditBtn.classList.toggle('active', bulkEditMode);
    els.undoBulkEditBtn.style.display = bulkEditUndoSnapshot ? '' : 'none';
  }
  function openBulkEditDialog() {
    if (!bulkSelectedIds.size) { flashStatus('編集する作品を選択してください'); return; }
    renderFolderOptions(els.bulkFolderSelect, '');
    const first = document.createElement('option'); first.value = ''; first.textContent = '変更しない';
    els.bulkFolderSelect.insertBefore(first, els.bulkFolderSelect.firstChild);
    els.bulkAuthorInput.value = ''; els.bulkTagsInput.value = ''; els.bulkSourceInput.value = ''; els.bulkSeriesInput.value = ''; els.bulkVolumeInput.value = '';
    els.bulkFavoriteSelect.value = ''; els.bulkSplitSelect.value = '';
    els.bulkEditSelectionText.textContent = bulkSelectedIds.size + '作品を一括編集します。空欄・「変更しない」は変更されません。';
    els.bulkEditOverlay.classList.add('show');
  }
  function closeBulkEditDialog() { els.bulkEditOverlay.classList.remove('show'); }
  function applyBulkEdit() {
    const targets = savedItems.filter((item) => bulkSelectedIds.has(item.id));
    if (!targets.length) return closeBulkEditDialog();
    bulkEditUndoSnapshot = targets.map((item) => ({ id: item.id, data: JSON.parse(JSON.stringify(item)) }));
    const author = els.bulkAuthorInput.value.trim();
    const tagsTextValue = els.bulkTagsInput.value.trim();
    const source = els.bulkSourceInput.value.trim();
    const series = els.bulkSeriesInput.value.trim();
    const volume = els.bulkVolumeInput.value.trim();
    targets.forEach((item) => {
      if (author) item.author = author;
      if (tagsTextValue) item.tags = parseTags(tagsTextValue);
      if (source) { item.sourceWork = source; item.isDoujin = true; }
      if (series) item.series = series;
      if (volume) item.volume = Number(volume);
      if (els.bulkFolderSelect.value) item.folderId = els.bulkFolderSelect.value === '__none__' ? null : els.bulkFolderSelect.value;
      if (els.bulkFavoriteSelect.value) item.favorite = els.bulkFavoriteSelect.value === '1';
      if (els.bulkSplitSelect.value) item.splitSpreads = els.bulkSplitSelect.value === '1';
    });
    if (author) ensureAuthorCardForName(author);
    persistAll(); closeBulkEditDialog(); bulkEditMode = false; bulkSelectedIds.clear(); updateBulkEditButton(); renderSavedList();
    flashStatus('一括編集しました。「もとに戻す」で取り消せます');
  }
  function undoBulkEdit() {
    if (!bulkEditUndoSnapshot) return;
    bulkEditUndoSnapshot.forEach((entry) => {
      const index = savedItems.findIndex((item) => item.id === entry.id);
      if (index !== -1) savedItems[index] = entry.data;
    });
    bulkEditUndoSnapshot = null; persistAll(); updateBulkEditButton(); renderSavedList(); flashStatus('一括編集をもとに戻しました');
  }

  function renderSavedList() {
    clearLocalCoverObjectUrls();
    const inSeriesGroup = currentFolderView === SERIES_FOLDER_ID && !!currentSeriesView;
    const inSeriesRoot = currentFolderView === SERIES_FOLDER_ID && !currentSeriesView;
    const inAuthorView = !!currentAuthorView;

    const atRoot = !currentFolderView && !inAuthorView;
    const isRealFolder = !!currentFolderView && currentFolderView !== FAVORITES_FOLDER_ID &&
      currentFolderView !== UNREAD_FOLDER_ID && currentFolderView !== SYNCED_FOLDER_ID && currentFolderView !== HISTORY_FOLDER_ID &&
      currentFolderView !== SERIES_FOLDER_ID;
    const canOrganize = atRoot || isRealFolder;
    const showOrganizeControls = canOrganize && reorderMode;

    els.listBackBtn.style.display = currentFolderView || inAuthorView ? '' : 'none';
    els.listNewFolderBtn.style.display = atRoot ? '' : 'none';
    els.editShelfBtn.style.display = canOrganize ? '' : 'none';
    els.editShelfBtn.classList.toggle('active', showOrganizeControls);
    els.editShelfBtn.textContent = showOrganizeControls ? '編集完了' : '編集';
    updateBulkEditButton();
    els.listNewFolderRow.style.display = 'none';

    if (currentFolderView === HISTORY_FOLDER_ID) {
      els.listFolderTitle.textContent = HISTORY_FOLDER_NAME;
    } else if (currentFolderView === FAVORITES_FOLDER_ID) {
      els.listFolderTitle.textContent = FAVORITES_FOLDER_NAME;
    } else if (currentFolderView === UNREAD_FOLDER_ID) {
      els.listFolderTitle.textContent = UNREAD_FOLDER_NAME;
    } else if (currentFolderView === SYNCED_FOLDER_ID) {
      els.listFolderTitle.textContent = SYNCED_FOLDER_NAME;
    } else if (inSeriesGroup) {
      els.listFolderTitle.textContent = currentSeriesView;
    } else if (inSeriesRoot) {
      els.listFolderTitle.textContent = SERIES_FOLDER_NAME;
    } else if (inAuthorView) {
      els.listFolderTitle.textContent = currentAuthorView;
    } else if (currentFolderView) {
      const folder = savedFolders.find((f) => f.id === currentFolderView);
      els.listFolderTitle.textContent = folder ? folder.name : '';
    } else {
      els.listFolderTitle.textContent = '';
    }

    els.savedListItems.innerHTML = '';
    els.savedListItems.classList.add('bookshelf'); // bookshelf grid at every level now

    let itemsList = []; // flat item list for the current view; doubles as swipe context
    let folderCards = [];
    let seriesGroupCards = []; // [{name, items}], only populated at the シリーズ root (list of series names)
    let authorGroupCards = [];
    let showFavoritesCard = false;
    let showSeriesCard = false;

    if (inAuthorView) {
      const authorCard = authorCards.find((card) => card.name === currentAuthorView || card.circleName === currentAuthorView);
      const names = authorCard ? [authorCard.name, authorCard.circleName].filter(Boolean) : [currentAuthorView];
      itemsList = savedItems.filter((it) => names.includes(String(it.author || '').trim()));
    } else if (!currentFolderView) {
      // Series-tagged works belong to the virtual シリーズ shelf at the
      // root. Do not also render them as individual cards beside that shelf;
      // works with the same series name are grouped there automatically.
      itemsList = savedItems.filter((it) => (!it.folderId || it.localSync) && !it.series);
      folderCards = savedFolders.filter((folder) => folder.id !== HISTORY_FOLDER_ID && !String(folder.id || '').startsWith('local-'));
      showFavoritesCard = true;
      showSeriesCard = true;
    } else if (currentFolderView === FAVORITES_FOLDER_ID) {
      // Virtual view: aggregates favorited items regardless of which real
      // folder they actually live in, instead of filtering by folderId.
      itemsList = savedItems.filter((it) => it.favorite);
    } else if (currentFolderView === UNREAD_FOLDER_ID) {
      itemsList = unreadOrderItems();
    } else if (currentFolderView === SYNCED_FOLDER_ID) {
      itemsList = savedItems.filter((it) => it.localSync);
    } else if (inSeriesRoot) {
      // Virtual view: groups every series-tagged item by series name
      // regardless of which real folder it lives in. Each group's items are
      // pre-sorted by volume so drilling in shows volume 1, 2, 3... in order.
      const groups = new Map();
      savedItems.forEach((it) => {
        if (!it.series) return;
        if (!groups.has(it.series)) groups.set(it.series, []);
        groups.get(it.series).push(it);
      });
      seriesGroupCards = Array.from(groups.entries())
        .map(([name, items]) => ({ name, items: items.slice().sort((a, b) => (a.volume || 0) - (b.volume || 0)) }))
        .sort((a, b) => a.name.localeCompare(b.name, 'ja'));
    } else if (inSeriesGroup) {
      itemsList = savedItems.filter((it) => it.series === currentSeriesView)
        .sort((a, b) => (a.volume || 0) - (b.volume || 0));
    } else {
      itemsList = savedItems.filter((it) => it.folderId === currentFolderView);
    }

    if (groupByAuthorEnabled && !bulkEditMode && !inAuthorView && !inSeriesRoot && itemsList.length) {
      const groups = new Map();
      itemsList.forEach((item) => {
        const name = String(item.author || '').trim();
        if (!name) return;
        if (!groups.has(name)) groups.set(name, []);
        groups.get(name).push(item);
      });
      authorGroupCards = Array.from(groups.entries()).map(([name, items]) => ({ name, items }));
    }
    const normalizedFilter = (value) => String(value || '').trim().toLocaleLowerCase('ja');
    itemsList = itemsList.filter((item) => {
      const tags = Array.isArray(item.tags) ? item.tags.join(' ') : '';
      return (!shelfFilters.series || normalizedFilter(item.series).includes(normalizedFilter(shelfFilters.series))) &&
        (!shelfFilters.author || normalizedFilter(item.author).includes(normalizedFilter(shelfFilters.author))) &&
        (!shelfFilters.tags || normalizedFilter(tags).includes(normalizedFilter(shelfFilters.tags))) &&
        (!shelfFilters.source || normalizedFilter(item.sourceWork).includes(normalizedFilter(shelfFilters.source)));
    });
    if (shelfSort === 'title-asc') {
      itemsList.sort((a, b) => itemDisplayTitle(a).localeCompare(itemDisplayTitle(b), 'ja'));
    } else if (shelfSort === 'synced-first') {
      itemsList.sort((a, b) => Number(!!b.localSync) - Number(!!a.localSync) || (Number(b.addedAt) || 0) - (Number(a.addedAt) || 0));
    } else {
      itemsList.sort((a, b) => (Number(b.addedAt) || 0) - (Number(a.addedAt) || 0));
    }
    if (groupByAuthorEnabled && !bulkEditMode && !inAuthorView && !inSeriesRoot) {
      const groups = new Map();
      itemsList.forEach((item) => {
        const name = String(item.author || '').trim();
        if (name) { if (!groups.has(name)) groups.set(name, []); groups.get(name).push(item); }
      });
      authorGroupCards = Array.from(groups.entries()).map(([name, items]) => ({ name, items }));
    }
    const ungroupedItems = itemsList.filter((item) => !String(item.author || '').trim());
    const pagedEntries = groupByAuthorEnabled && !bulkEditMode && !inAuthorView && !inSeriesRoot
      ? authorGroupCards.concat(ungroupedItems)
      : itemsList;
    const totalShelfPages = Math.max(1, Math.ceil(pagedEntries.length / BOOKSHELF_PAGE_SIZE));
    bookshelfPage = Math.min(Math.max(1, bookshelfPage), totalShelfPages);
    const pageStart = (bookshelfPage - 1) * BOOKSHELF_PAGE_SIZE;
    const visibleEntries = pagedEntries.slice(pageStart, pageStart + BOOKSHELF_PAGE_SIZE);
    const visibleAuthorGroups = visibleEntries.filter((entry) => entry && Array.isArray(entry.items));
    const visibleItems = visibleEntries.filter((entry) => !Array.isArray(entry.items));
    els.bookshelfPagination.style.display = totalShelfPages > 1 ? 'flex' : 'none';
    els.bookshelfPrevBtn.disabled = bookshelfPage <= 1;
    els.bookshelfNextBtn.disabled = bookshelfPage >= totalShelfPages;
    els.bookshelfPageLabel.textContent = bookshelfPage + ' / ' + totalShelfPages;
    const isEmpty = folderCards.length === 0 && itemsList.length === 0 && seriesGroupCards.length === 0 &&
      !showFavoritesCard && !showSeriesCard;
    if (isEmpty) {
      els.savedListEmpty.style.display = 'block';
      els.savedListEmpty.textContent = currentFolderView === FAVORITES_FOLDER_ID
        ? 'お気に入りはまだ追加されていません'
        : currentFolderView === UNREAD_FOLDER_ID
          ? '保存された漫画はまだありません'
        : currentFolderView === SYNCED_FOLDER_ID
          ? '同期済みの漫画はまだありません'
        : inSeriesRoot
          ? 'シリーズはまだ設定されていません'
          : (currentFolderView ? 'このフォルダにはまだ何もありません' : '保存されたURLはまだありません');
    } else {
      els.savedListEmpty.style.display = 'none';
      // Build every card into an off-DOM fragment first and append it once —
      // appending each card straight onto the live, already-visible container
      // forces a layout/reflow per card, which adds up once a folder has a
      // few dozen items.
      const frag = document.createDocumentFragment();
      if (showFavoritesCard) frag.appendChild(buildFavoritesFolderCard());
      if (showSeriesCard) frag.appendChild(buildSeriesFolderCard());
      folderCards.forEach((f) => frag.appendChild(buildFolderCard(f, folderCards, showOrganizeControls)));
      seriesGroupCards.forEach((g) => frag.appendChild(buildSeriesGroupCard(g)));
      if (groupByAuthorEnabled && !bulkEditMode && authorGroupCards.length) {
        visibleAuthorGroups.forEach((group) => frag.appendChild(buildAuthorGroupCard(group)));
        visibleItems.forEach((it) => frag.appendChild(buildBookCard(it, itemsList, showOrganizeControls)));
      } else {
        visibleItems.forEach((it) => frag.appendChild(buildBookCard(it, itemsList, showOrganizeControls)));
      }
      els.savedListItems.appendChild(frag);
    }

    els.smartListRow.style.display = atRoot ? 'flex' : 'none';
    if (atRoot) {
      const historyCount = savedItems.filter((item) => item.folderId === HISTORY_FOLDER_ID).length;
      const unreadCount = unreadOrderItems().filter((item) => !Number(item.lastReadAt)).length;
      els.historyListBtn.textContent = '履歴 (' + historyCount + ')';

  // A saved item only stores the manga's base URL, not which file extension
  // its pages use, so the cover image is found the same cascading way page
  // detection works: try .jpg, then .jpeg/.png/.webp on error, in order.
  // Used by the bookshelf grid (buildBookCard) for cover thumbnails.
  function setupFeedImage(imgEl, baseUrlForItem, numberWidth, itemPattern) {
    const parsed = parseInputUrl(baseUrlForItem);
    const folderUrl = parsed ? parsed.baseUrl : baseUrlForItem;
    const cached = getCachedMangaInfo(folderUrl);
    const pattern = itemPattern || (parsed && parsed.pattern) || (cached && cached.pattern) || null;
    const resolvedWidth = numberWidth || (cached && cached.numberWidth) || 1;
    const cacheKey = baseUrlForItem + '|' + String(numberWidth || 1);
    const cachedSource = coverSourceCache.get(cacheKey);
    if (cachedSource) {
      imgEl.src = cachedSource;
      return;
    }
    let idx = 0;
    function tryNext() {
      if (idx >= EXT_CANDIDATES.length) return;
      imgEl.src = pageUrlFor(folderUrl, 1, idx, resolvedWidth, pattern);
      idx++;
    }
    imgEl.addEventListener('load', () => {
      coverSourceCache.set(cacheKey, imgEl.currentSrc || imgEl.src);
    }, { once: true });
    imgEl.addEventListener('error', tryNext);
    tryNext();
  }

  let bulkDetectRunning = false;
  let bulkDetectCancelRequested = false;

  function bulkDetectCandidates(mode) {
    const unique = new Map();
    savedItems.forEach((item) => {
      if (!item.url || (Array.isArray(item.pages) && item.pages.length)) return;
      const key = mangaCacheKeyFor(item.url);
      if (!key || unique.has(key)) return;
      const cache = getCachedMangaInfo(key);
      const include = mode === 'retry'
        ? cache && cache.state === 'retryable'
        : !cache;
      if (include) unique.set(key, { key: key, item: item, cache: cache });
    });
    return Array.from(unique.values());
  }

  function refreshBulkDetectSummary() {
    const unread = bulkDetectCandidates('all').length;
    const retryable = bulkDetectCandidates('retry').length;
    els.bulkDetectSummary.textContent = 'ページ数未保存: ' + unread + '作品 / タイムアウトで再試行可能: ' + retryable + '作品';
    els.bulkDetectAllBtn.disabled = bulkDetectRunning || unread === 0;
    els.bulkRetryBtn.disabled = bulkDetectRunning || retryable === 0;
  }

  function openBulkDetect() {
    closeSavedList();
    bulkDetectCancelRequested = false;
    els.bulkDetectProgress.textContent = '';
    els.bulkCancelBtn.textContent = '閉じる';
    refreshBulkDetectSummary();
    els.bulkDetectOverlay.classList.add('show');
  }

  function closeBulkDetect() {
    if (bulkDetectRunning) {
      bulkDetectCancelRequested = true;
      els.bulkCancelBtn.disabled = true;
      els.bulkCancelBtn.textContent = '中止中…';
      return;
    }
    els.bulkDetectOverlay.classList.remove('show');
    reopenSavedList();
  }

  async function runBulkDetect(mode) {
    if (bulkDetectRunning) return;
    const jobs = bulkDetectCandidates(mode);
    if (!jobs.length) { refreshBulkDetectSummary(); return; }
    bulkDetectRunning = true;
    bulkDetectCancelRequested = false;
    els.bulkCancelBtn.disabled = false;
    els.bulkCancelBtn.textContent = '中止';
    refreshBulkDetectSummary();
    let completed = 0;
    let retried = 0;
    for (const job of jobs) {
      if (bulkDetectCancelRequested) break;
      const fromPage = mode === 'retry' && job.cache ? (Number(job.cache.count) || 0) + 1 : 1;
      els.bulkDetectProgress.textContent = '読み込み中 (' + (completed + 1) + ' / ' + jobs.length + ')\n' + itemDisplayTitle(job.item) + '\n' + fromPage + 'ページ目から確認しています…';
      const parsedJob = parseInputUrl(job.item.url);
      const result = await ensurePageCountDetected(job.key, {
        force: true,
        retry: mode === 'retry',
        numberWidth: job.item.numberWidth,
        pattern: job.item.pagePattern || (parsedJob && parsedJob.pattern) || (job.cache && job.cache.pattern) || null,
        onProgress: (count) => {
          els.bulkDetectProgress.textContent = '読み込み中 (' + (completed + 1) + ' / ' + jobs.length + ')\n' + itemDisplayTitle(job.item) + '\n' + count + 'ページまで保存しました。';
        }
      });
      completed++;
      if (result && result.state === 'retryable') retried++;
    }
    bulkDetectRunning = false;
    els.bulkCancelBtn.disabled = false;
    els.bulkCancelBtn.textContent = '閉じる';
    if (bulkDetectCancelRequested) {
      els.bulkDetectProgress.textContent = completed + '作品まで読み込み、途中で中止しました。';
    } else {
      els.bulkDetectProgress.textContent = completed + '作品の読み込みが完了しました。' + (retried ? ' ' + retried + '作品はタイムアウトのため続きから再試行できます。' : '');
    }
    refreshBulkDetectSummary();
    scheduleCloudSync();
  }

    }
    if (anyModalOpen()) {
      if (e.key === 'Escape') { closeSaveDialog(); closeSavedList(); closeCustomAddDialog(); closeEditItemDialog(); closeTocList(); closeBulkDetect(); }
      return;
    }
    switch (e.key) {
      case 'ArrowLeft': prevPage(); break;   // left = back
      case 'ArrowRight': nextPage(); break;  // right = forward
      case 'Home': goFirst(); break;
      case 'End': goLast(); break;
      case 'h': case 'H': toggleBars(); break;
    }
  });

  // ---------- video list (動画タブ) ----------
  function persistSavedVideos() {
    try { localStorage.setItem(SAVED_VIDEOS_KEY, JSON.stringify(savedVideos)); } catch (e) {}
    scheduleCloudSync();
  }

  function videoEmbedUrl(a, b) {
    return 'https://www.' + a + '.com/embed/' + b;
  }

  function renderVideoList() {
    const frag = document.createDocumentFragment();
    if (!savedVideos.length) {
      els.videoListEmpty.style.display = '';
      els.videoListItems.innerHTML = '';
      return;
    }
    els.videoListEmpty.style.display = 'none';

    // group by a
    const groups = {};
    const groupOrder = [];
    savedVideos.forEach((v) => {
      if (!groups[v.a]) { groups[v.a] = []; groupOrder.push(v.a); }
      groups[v.a].push(v);
    });

    groupOrder.forEach((a) => {
      const groupDiv = document.createElement('div');
      groupDiv.className = 'videoGroup';

      const header = document.createElement('div');
      header.className = 'videoGroupHeader';
      header.textContent = a;
      groupDiv.appendChild(header);

      groups[a].forEach((v) => {
        const item = document.createElement('div');
        item.className = 'videoItem';

        const titleSpan = document.createElement('span');
        titleSpan.className = 'videoItemTitle';
        titleSpan.textContent = v.title || (a + ' / ' + v.b);

        const idSpan = document.createElement('span');
        idSpan.className = 'videoItemId';
        idSpan.textContent = 'B: ' + v.b;

        const delBtn = document.createElement('button');
        delBtn.className = 'videoDeleteBtn';
        delBtn.textContent = '削除';
        delBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteVideo(v.id);
        });

        item.appendChild(titleSpan);
        item.appendChild(idSpan);
        item.appendChild(delBtn);
        item.addEventListener('click', () => openVideoPlayer(v));
        groupDiv.appendChild(item);
      });

      frag.appendChild(groupDiv);
    });

    els.videoListItems.innerHTML = '';
    els.videoListItems.appendChild(frag);
  }

  function deleteVideo(id) {
    savedVideos = savedVideos.filter((v) => v.id !== id);
    persistSavedVideos();
    renderVideoList();
  }

  function openVideoPlayer(video) {
    els.videoPlayerTitle.textContent = video.title || (video.a + ' / ' + video.b);
    els.videoPlayerIframe.src = videoEmbedUrl(video.a, video.b);
    els.videoPlayerOverlay.classList.add('show');
  }

  function closeVideoPlayer() {
    els.videoPlayerIframe.src = ''; // stop playback
    els.videoPlayerOverlay.classList.remove('show');
  }

  // https://www.[A].com/v/[B]/... → { a: 'example', b: '0000' }
  function parseVideoUrl(url) {
    try {
      const u = new URL(url.trim());
      const hostParts = u.hostname.split('.');
      if (hostParts[0] === 'www') hostParts.shift();
      const a = hostParts[0];
      if (!a || !/^[a-zA-Z0-9]+$/.test(a)) return null;
      const m = u.pathname.match(/\/v\/(\d+)/);
      if (!m) return null;
      return { a, b: m[1] };
    } catch (e) { return null; }
  }

  function updateVideoPreview() {
    const a = els.videoAInput.value.trim();
    const b = els.videoBInput.value.trim();
    if (a && b) {
      els.videoPreviewUrl.textContent = '→ ' + videoEmbedUrl(a, b);
    } else {
      els.videoPreviewUrl.textContent = '';
    }
  }

  function openAddVideoDialog() {
    els.videoUrlInput.value = '';
    els.videoTitleInput.value = '';
    els.videoAInput.value = '';
    els.videoBInput.value = '';
    els.videoPreviewUrl.textContent = '';
    els.videoPreviewUrl.style.color = '';
    els.videoAddOverlay.classList.add('show');
    els.videoUrlInput.focus();
  }

  function closeAddVideoDialog() {
    els.videoAddOverlay.classList.remove('show');
  }

  function confirmVideoAdd() {
    const a = els.videoAInput.value.trim();
    const b = els.videoBInput.value.trim();
    if (!a || !/^[a-zA-Z0-9]+$/.test(a)) {
      els.videoPreviewUrl.textContent = 'Aは英数字で入力してください';
      els.videoPreviewUrl.style.color = 'var(--accent)';
      return;
    }
    if (!b || !/^\d+$/.test(b)) {
      els.videoPreviewUrl.textContent = 'Bは数字のみで入力してください';
      els.videoPreviewUrl.style.color = 'var(--accent)';
      return;
    }
    els.videoPreviewUrl.style.color = '';
    const title = els.videoTitleInput.value.trim();
    savedVideos.unshift({ id: genId('v'), a, b, title, addedAt: Date.now() });
    persistSavedVideos();
    renderVideoList();
    closeAddVideoDialog();
  }

  function switchListTab(tab) {
    activeListTab = tab;
    if (tab === 'manga') {
      els.listTabManga.classList.add('active');
      els.listTabVideo.classList.remove('active');
      els.mangaListSection.style.display = '';
      els.videoListSection.style.display = 'none';
      els.listPanelTitle.textContent = '保存したURL';
    } else {
      els.listTabVideo.classList.add('active');
      els.listTabManga.classList.remove('active');
      els.videoListSection.style.display = '';
      els.mangaListSection.style.display = 'none';
      els.listPanelTitle.textContent = '動画';
      renderVideoList();
    }
  }

  els.listTabManga.addEventListener('click', () => switchListTab('manga'));
  els.listTabVideo.addEventListener('click', () => switchListTab('video'));
  els.addVideoBtn.addEventListener('click', openAddVideoDialog);
  els.cancelVideoAddBtn.addEventListener('click', closeAddVideoDialog);
  els.confirmVideoAddBtn.addEventListener('click', confirmVideoAdd);
  els.closeVideoPlayerBtn.addEventListener('click', closeVideoPlayer);
  els.videoAddOverlay.addEventListener('click', (e) => { if (e.target === els.videoAddOverlay) closeAddVideoDialog(); });
  els.videoPlayerOverlay.addEventListener('click', (e) => { if (e.target === els.videoPlayerOverlay) closeVideoPlayer(); });
  els.videoUrlInput.addEventListener('input', () => {
    const parsed = parseVideoUrl(els.videoUrlInput.value);
    if (parsed) {
      els.videoAInput.value = parsed.a;
      els.videoBInput.value = parsed.b;
      updateVideoPreview();
    }
  });
  els.videoAInput.addEventListener('input', updateVideoPreview);
  els.videoBInput.addEventListener('input', updateVideoPreview);

  // No URL bar anymore, so automatically resume the last-viewed manga on
  // load (not counted as a "新規" open, so it isn't re-added to 履歴).
  // LAST_URL_KEY is now a JSON envelope ({kind:'url',value} or
  // {kind:'item',itemId}) so a custom (explicit page list) manga can be
  // resumed too; older saved data was a plain URL string, handled below.
  let resumedOnLoad = false;
  try {
    const raw = localStorage.getItem(LAST_URL_KEY);
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.kind === 'url' && parsed.value) {
          startReading(parsed.value, false);
          resumedOnLoad = true;
        } else if (parsed && parsed.kind === 'item' && parsed.itemId) {
          const it = savedItems.find((x) => x.id === parsed.itemId);
          if (it) { openItem(it, false); resumedOnLoad = true; }
        }
      } catch (e) { /* not JSON: legacy plain-string URL from before this change */ }
      if (!resumedOnLoad && /^https?:\/\//i.test(raw)) { startReading(raw, false); resumedOnLoad = true; }
    }
  } catch (e) {}
  // 何も復元されなかった場合（初回起動、または閉じる操作の直後など）は、
  // 空のplaceholderの代わりにリスト（保存したURL）を表示する。
  if (!resumedOnLoad) openSavedList(true);
})();
</script>
</body>
</html>
