<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c0d12">
  <title>ローカル漫画リーダー</title>
  <style>
    :root{--bg:#0b0c10;--panel:rgba(22,24,32,.88);--panel2:#20232d;--line:#303442;--text:#f5f6fa;--muted:#9aa0b2;--accent:#ff7656;--shadow:0 14px 42px rgba(0,0,0,.38)}
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}body{overflow:hidden}img{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}button{-webkit-touch-callout:none}
    button,input{font:inherit}button{cursor:pointer}.app{height:100%;position:relative;background:radial-gradient(ellipse 100% 80% at 50% -20%,#252936 0,var(--bg) 63%)}
    .topbar,.bottombar{position:absolute;z-index:5;left:0;right:0;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--panel);backdrop-filter:blur(14px);border-color:var(--line);transition:.25s ease}.topbar{top:0;border-bottom:1px solid}.bottombar{bottom:0;border-top:1px solid}.topbar.hidden,.bottombar.hidden{opacity:0;pointer-events:none}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#ff9b73,var(--accent));display:grid;place-items:center;color:#25100a;font-weight:900}.title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36vw}.status{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}.button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:8px 12px;transition:.15s}.button:hover{border-color:#697083;filter:brightness(1.1)}.button.primary{border-color:transparent;background:var(--accent);color:#230d07;font-weight:700}.button.icon{width:38px;padding:8px;display:grid;place-items:center}.select{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:8px 30px 8px 10px}.viewer{position:absolute;inset:0;background:#050507;overflow:hidden}.empty{height:100%;display:grid;place-items:center;padding:30px}.empty-card{width:min(520px,100%);text-align:center;background:rgba(22,24,32,.88);border:1px solid var(--line);border-radius:18px;padding:42px 28px;box-shadow:var(--shadow)}.empty-icon{font-size:44px;margin-bottom:14px}.empty h1{font-size:24px;margin:0 0 10px}.empty p{color:var(--muted);line-height:1.75;margin:0 0 24px}.drop-zone{border:1px dashed #596072;border-radius:12px;padding:18px;color:var(--muted);font-size:13px}.drop-zone.dragging{border-color:var(--accent);background:rgba(255,118,86,.09);color:var(--text)}.reader{height:100%;overflow:auto;scrollbar-color:#363b4a transparent}.reader.vertical{display:flex;flex-direction:column;align-items:center;padding:74px 0 80px;gap:8px}.reader.vertical img{display:block;width:min(100%,1100px);height:auto;object-fit:contain;box-shadow:0 2px 18px #000}.reader.horizontal{display:flex;align-items:center;gap:20px;overflow-x:auto;overflow-y:hidden;padding:70px 8vw 76px;scroll-snap-type:x mandatory}.reader.horizontal img{height:calc(100vh - 146px);width:auto;max-width:88vw;object-fit:contain;scroll-snap-align:center;box-shadow:0 2px 18px #000}.page{position:relative}.page-number{position:absolute;right:8px;bottom:8px;padding:3px 7px;border-radius:5px;background:rgba(0,0,0,.66);color:#fff;font-size:11px;opacity:0;transition:.15s}.page:hover .page-number{opacity:1}.progress{height:4px;flex:1;max-width:280px;background:#343846;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}.counter{font-size:12px;color:var(--muted);min-width:72px;text-align:right}.hint{color:var(--muted);font-size:12px;margin-right:2px}.noscript{padding:30px;color:white}
    .reader{touch-action:pan-y}.reader.horizontal{touch-action:pan-x}.reader.image-zoom img{transform:scale(var(--image-scale,1));transform-origin:center}.favorite-badge{position:absolute;right:10px;top:10px;border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;width:30px;height:30px;padding:0;font-size:18px;line-height:30px;z-index:2}.favorite-badge.active{color:#ff617e}.reader.fit-width.vertical img{width:min(100%,1100px);height:auto}.reader.fit-height.vertical img{width:auto;max-width:100%;height:calc(100vh - 154px)}.reader.fit-width.horizontal img{width:min(88vw,1100px);height:auto;max-height:calc(100vh - 146px)}.reader.original.vertical img{width:auto;max-width:none}.reader.original.horizontal img{width:auto;height:auto;max-width:none;max-height:none}.page.current{outline:2px solid var(--accent);outline-offset:-2px}.nav-controls{display:flex;align-items:center;gap:5px}.nav-controls .button{min-width:34px;padding:8px 9px}.crop-editor{position:absolute;z-index:8;inset:12%;display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:18px;padding:18px;background:rgba(15,17,23,.97);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.crop-preview{display:grid;place-items:center;min-height:240px;background:#050507;overflow:hidden}.crop-preview img{max-width:100%;max-height:60vh;object-fit:contain}.crop-fields label{display:block;color:var(--muted);font-size:12px;margin:10px 0 4px}.crop-fields input{width:100%;accent-color:var(--accent)}.crop-actions{display:flex;gap:8px;margin-top:16px}
    @media(max-width:650px){.topbar,.bottombar{padding:10px;gap:6px}.title{max-width:28vw}.status,.hint{display:none}.button{padding:8px 9px}.reader.vertical{padding-top:62px;padding-bottom:70px;gap:3px}.reader.horizontal{padding:62px 5vw 66px;gap:10px}.reader.horizontal img{height:calc(100vh - 128px);max-width:90vw}.empty-card{padding:32px 20px}}
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar" id="topbar">
      <div class="brand"><div class="brand-mark">本</div><div class="title" id="folderName">ローカル漫画リーダー</div></div>
      <span class="status" id="status">画像フォルダを選択してください</span>
      <button class="button" id="openButton" type="button">フォルダを開く</button>
      <button class="button primary" id="syncButton" type="button" hidden>同期対象に追加</button>
      <button class="button" id="favoriteOnlyButton" type="button" hidden>♡ お気に入りのみ</button>
      <button class="button" id="cropButton" type="button" hidden>トリミング</button>
      <button class="button icon" id="fullscreenButton" type="button" title="全画面">⛶</button>
      <button class="button icon" id="toggleBarsButton" type="button" title="操作バーを隠す">⌃</button>
      <input id="folderInput" type="file" webkitdirectory directory multiple accept="image/*" hidden>
    </header>

    <main class="viewer" id="viewer">
      <section class="empty" id="emptyState">
        <div class="empty-card">
          <div class="empty-icon">▧</div>
          <h1>ローカル漫画を読む</h1>
          <p>画像が入ったフォルダを選ぶと、ファイル名の順番で表示します。通常はこのブラウザ内だけで読み込み、「同期対象に追加」を押した場合だけクラウドへ保存します。</p>
          <button class="button primary" id="emptyOpenButton" type="button">画像フォルダを選択</button>
          <div class="drop-zone" id="dropZone">ここに画像ファイル、またはフォルダをドロップ</div>
        </div>
      </section>
      <div class="reader vertical" id="reader" hidden></div>
      <section class="crop-editor" id="cropEditor" hidden aria-label="トリミング編集">
        <div class="crop-preview"><img id="cropPreviewImage" alt="トリミング対象"></div>
        <div class="crop-fields"><strong>トリミング（元画像は変更しません）</strong><label>上 <input id="cropTop" type="range" min="0" max="45" value="0"></label><label>右 <input id="cropRight" type="range" min="0" max="45" value="0"></label><label>下 <input id="cropBottom" type="range" min="0" max="45" value="0"></label><label>左 <input id="cropLeft" type="range" min="0" max="45" value="0"></label><div class="crop-actions"><button class="button" id="cropCancel" type="button">キャンセル</button><button class="button primary" id="cropApply" type="button">適用</button></div></div>
      </section>
    </main>

    <footer class="bottombar" id="bottombar" hidden>
      <div class="nav-controls"><button class="button" id="firstButton" type="button" title="最初のページ">|◀</button><button class="button" id="prevButton" type="button" title="前のページ">◀</button></div>
      <span class="hint">← → キーでページ移動 / M で操作バー</span>
      <div class="progress"><i id="progressFill"></i></div><div class="counter" id="counter">0 / 0</div>
      <div class="nav-controls"><button class="button" id="nextButton" type="button" title="次のページ">▶</button><button class="button" id="lastButton" type="button" title="最後のページ">▶|</button></div>
      <select class="select" id="modeSelect" aria-label="表示方向"><option value="vertical">縦スクロール</option><option value="horizontal">横スクロール</option></select>
      <select class="select" id="fitSelect" aria-label="画像の合わせ方"><option value="default">フィット</option><option value="width">幅に合わせる</option><option value="height">高さに合わせる</option><option value="original">原寸</option></select>
      <button class="button" id="sortButton" type="button" title="並び順を反転">↕ 名前順</button>
      <button class="button" id="zoomOutButton" type="button" title="画像を縮小">−</button><button class="button" id="zoomResetButton" type="button">100%</button><button class="button" id="zoomInButton" type="button" title="画像を拡大">＋</button>
      <span class="status" id="syncStatus" aria-live="polite"></span>
    </footer>
  </div>
  <noscript><div class="noscript">このリーダーを使うには JavaScript を有効にしてください。</div></noscript>
  <script src="supabase-config.js"></script>
  <script src="vault-session.js?v=20260815-local-reader"></script>
  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const ui = {app:$('app'),viewer:$('viewer'),reader:$('reader'),empty:$('emptyState'),drop:$('dropZone'),input:$('folderInput'),open:$('openButton'),emptyOpen:$('emptyOpenButton'),folder:$('folderName'),status:$('status'),bottom:$('bottombar'),mode:$('modeSelect'),fit:$('fitSelect'),sort:$('sortButton'),fill:$('progressFill'),counter:$('counter'),first:$('firstButton'),prev:$('prevButton'),next:$('nextButton'),last:$('lastButton'),fullscreen:$('fullscreenButton'),toggle:$('toggleBarsButton'),top:$('topbar'),syncButton:$('syncButton'),syncStatus:$('syncStatus'),favoriteOnly:$('favoriteOnlyButton'),crop:$('cropButton'),cropEditor:$('cropEditor'),cropPreview:$('cropPreviewImage'),cropTop:$('cropTop'),cropRight:$('cropRight'),cropBottom:$('cropBottom'),cropLeft:$('cropLeft'),cropCancel:$('cropCancel'),cropApply:$('cropApply'),zoomOut:$('zoomOutButton'),zoomReset:$('zoomResetButton'),zoomIn:$('zoomInButton')};
      let urls = [], pages = [], pageState = [], reverse = false, favoriteOnly = false, imageScale = 1, framePending = false, currentFolder = '', cropIndex = -1, touchStart = null, lastTap = 0, tapTimer = null, cloudItem = null;
      const STORAGE_BUCKET = 'local-manga';
      const imageTypes = /^(image\/|image\/svg\+xml$)/i;
      const natural = new Intl.Collator(undefined, {numeric:true, sensitivity:'base'});
      function clearUrls(){ urls.forEach(url => URL.revokeObjectURL(url)); urls=[]; }
      function fileName(file){ return file.webkitRelativePath || file.name; }
      function sortFiles(files){ return Array.from(files || []).filter(file => imageTypes.test(file.type || '') || /\.(avif|bmp|gif|jpe?g|jfif|png|svg|webp)$/i.test(file.name)).sort((a,b) => natural.compare(fileName(a),fileName(b))); }
      function defaultState(){return {hidden:false,favorite:false,crop:{top:0,right:0,bottom:0,left:0}};}
      function stateKey(){return 'mangaReaderLocalState:'+currentFolder;}
      function applyCrop(img,state){const c=state.crop||defaultState().crop; img.style.clipPath=`inset(${c.top}% ${c.right}% ${c.bottom}% ${c.left}%)`;}
      function visibleIndices(){return pageState.map((state,index)=>({state,index})).filter(entry=>!entry.state.hidden && (!favoriteOnly || entry.state.favorite)).map(entry=>entry.index);}
      function renderPages(){
        const visible=visibleIndices(); ui.reader.replaceChildren();
        visible.forEach((original,index)=>{const wrap=document.createElement('div');wrap.className='page';wrap.id='page-'+original;const img=document.createElement('img');img.loading=index<3?'eager':'lazy';img.decoding='async';img.src=urls[original];img.alt=fileName(pages[original]);applyCrop(img,pageState[original]);const heart=document.createElement('button');heart.className='favorite-badge'+(pageState[original].favorite?' active':'');heart.type='button';heart.textContent=pageState[original].favorite?'♥':'♡';heart.title='お気に入り';heart.addEventListener('click',event=>{event.stopPropagation();toggleFavorite(original);});wrap.append(img,heart);ui.reader.append(wrap);});
        ui.status.textContent=visible.length+'ページ'+(favoriteOnly?'（お気に入りのみ）':'')+(pageState.some(state=>state.hidden)?'・非表示あり':''); ui.counter.textContent=visible.length?'1 / '+visible.length:'0 / 0'; updateCounter();
      }
      function persistState(){try{localStorage.setItem(stateKey(),JSON.stringify(pageState));}catch(_){} persistCloudState();}
      function loadFiles(fileList){
        const files = sortFiles(fileList); if(!files.length){ ui.status.textContent=fileList && fileList.length ? '画像として読み込めるファイルが見つかりません（JPG / PNG / WEBPなどを選択してください）' : 'フォルダが選択されていません'; return; }
        clearUrls(); pages = files; urls = files.map(file => URL.createObjectURL(file));
        const first = fileName(files[0]), folder = first.includes('/') ? first.split('/')[0] : '選択した画像';
        currentFolder = folder; let saved=[]; try{saved=JSON.parse(localStorage.getItem(stateKey())||'[]');}catch(_){} pageState=files.map((_,index)=>saved[index]&&typeof saved[index]==='object'?Object.assign(defaultState(),saved[index]):defaultState()); cloudItem=null;
        ui.folder.textContent = folder; ui.empty.hidden=true; ui.reader.hidden=false; ui.bottom.hidden=false; ui.syncButton.hidden=false; ui.syncButton.disabled=false; ui.syncButton.textContent='同期対象に追加'; ui.favoriteOnly.hidden=false; ui.crop.hidden=false; ui.syncStatus.textContent=''; favoriteOnly=false; ui.favoriteOnly.textContent='♡ お気に入りのみ'; renderPages();
      }
      function updateProgress(){ if(!pages.length)return; const max=ui.reader.scrollWidth-ui.reader.clientWidth; const current=ui.reader.scrollLeft; const ratio=max>0 ? current/max : 0; ui.fill.style.width=Math.max(0,Math.min(100,ratio*100))+'%'; if(ui.reader.classList.contains('vertical')){ const at=ui.reader.scrollTop/(ui.reader.scrollHeight-ui.reader.clientHeight||1); ui.fill.style.width=Math.max(0,Math.min(100,at*100))+'%'; } }
      function updateCounter(){ if(!pages.length)return; const els=[...ui.reader.querySelectorAll('.page')]; if(!els.length){ui.counter.textContent='0 / 0';updateProgress();return;} const axis=ui.reader.classList.contains('vertical')?'top':'left'; const pos=axis==='top'?ui.reader.scrollTop:ui.reader.scrollLeft; const size=axis==='top'?ui.reader.clientHeight:ui.reader.clientWidth; let index=0; els.forEach((el,i)=>{const edge=axis==='top'?el.offsetTop:el.offsetLeft;if(edge<=pos+size*.45)index=i;}); els.forEach((el,i)=>el.classList.toggle('current',i===index)); ui.counter.textContent=(index+1)+' / '+els.length; updateProgress(); }
      function currentPage(){ const text=ui.counter.textContent.split('/')[0].trim(); const index=parseInt(text,10)-1; return Number.isFinite(index)?index:0; }
      function goPage(index){ const els=[...ui.reader.querySelectorAll('.page')]; if(!els.length)return; const target=Math.max(0,Math.min(els.length-1,index)); if(els[target])els[target].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}); }
      function setMode(mode){ ui.reader.classList.toggle('vertical',mode==='vertical'); ui.reader.classList.toggle('horizontal',mode==='horizontal'); ui.reader.scrollTo({top:0,left:0}); updateCounter(); }
      function setFit(fit){ ['fit-width','fit-height','original'].forEach(name=>ui.reader.classList.toggle(name,fit===name.replace('fit-',''))); }
      function reverseOrder(){ if(!pages.length)return; reverse=!reverse; pages.reverse(); urls.reverse(); pageState.reverse(); renderPages(); ui.sort.textContent=reverse?'↕ 逆順':'↕ 名前順'; ui.reader.scrollTo({top:0,left:0}); persistState(); }
      function originalIndexFromVisible(){const current=ui.reader.querySelector('.page.current');return current?Number(current.id.replace('page-','')):-1;}
      function toggleFavorite(original){if(original<0)return;pageState[original].favorite=!pageState[original].favorite;renderPages();persistState();}
      function hideCurrent(){const original=originalIndexFromVisible();if(original<0)return;pageState[original].hidden=true;renderPages();persistState();}
      function toggleFavoriteOnly(){favoriteOnly=!favoriteOnly;ui.favoriteOnly.textContent=favoriteOnly?'♥ 全ページを表示':'♡ お気に入りのみ';renderPages();}
      function setImageScale(value){imageScale=Math.max(1,Math.min(2.5,value));ui.reader.style.setProperty('--image-scale',imageScale);ui.reader.classList.toggle('image-zoom',imageScale!==1);ui.zoomReset.textContent=Math.round(imageScale*100)+'%';}
      function toggleBars(){ const hidden=ui.top.classList.toggle('hidden'); ui.bottom.classList.toggle('hidden',hidden); ui.toggle.textContent=hidden?'⌄':'⌃'; }
      function session(){ try{return JSON.parse(localStorage.getItem('mangaReaderSupabaseSession')||'null');}catch(_){return null;} }
      function safePart(value){ return String(value||'file').normalize('NFKC').replace(/[^a-zA-Z0-9._-]+/g,'_').slice(0,120); }
      function updateCropPreview(){const c={top:Number(ui.cropTop.value),right:Number(ui.cropRight.value),bottom:Number(ui.cropBottom.value),left:Number(ui.cropLeft.value)};ui.cropPreview.style.clipPath=`inset(${c.top}% ${c.right}% ${c.bottom}% ${c.left}%)`;}
      function openCrop(){const original=originalIndexFromVisible();if(original<0)return;cropIndex=original;const c=pageState[original].crop||defaultState().crop;ui.cropPreview.src=urls[original];ui.cropTop.value=c.top;ui.cropRight.value=c.right;ui.cropBottom.value=c.bottom;ui.cropLeft.value=c.left;updateCropPreview();ui.cropEditor.hidden=false;}
      function closeCrop(){ui.cropEditor.hidden=true;cropIndex=-1;}
      function applyCrop(){if(cropIndex<0)return;pageState[cropIndex].crop={top:Number(ui.cropTop.value),right:Number(ui.cropRight.value),bottom:Number(ui.cropBottom.value),left:Number(ui.cropLeft.value)};renderPages();persistState();closeCrop();}
      function manifest(){return pages.map((file,index)=>({name:fileName(file),hidden:!!pageState[index].hidden,favorite:!!pageState[index].favorite,crop:pageState[index].crop||defaultState().crop}));}
      async function persistCloudState(){if(!cloudItem||!window.MangaVault)return;try{const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key)||'')??fallback}catch(_){return fallback}};const items=read('mangaReaderSavedItems',[]);const item=items.find(entry=>entry.id===cloudItem.id);if(!item)return;item.pageMeta=manifest();item.favoriteOnly=favoriteOnly;localStorage.setItem('mangaReaderSavedItems',JSON.stringify(items));await MangaVault.savePayload({folders:read('mangaReaderSavedFolders',[]),items,videos:read('mangaReaderVideos',[]),mangaInfo:read('mangaReaderInfoCache',{}),toc:read('mangaReaderToc',{}),lastPages:read('mangaReaderLastPage',{}),theme:localStorage.getItem('mangaReaderTheme')==='light'?'light':'dark'});}catch(_){} }
      async function syncToCloud(){
        if(!pages.length || ui.syncButton.disabled)return;
        const userSession=session();
        if(!userSession || !userSession.access_token || !userSession.user){ ui.syncStatus.textContent='先にログインしてください'; setTimeout(()=>location.href='sync.html',700); return; }
        if(!window.MangaVault || !MangaVault.loadActive()){ ui.syncStatus.textContent='保管庫を開いてから同期してください'; setTimeout(()=>location.href='sync.html',700); return; }
        const config=window.MANGA_READER_SUPABASE||{}; if(!config.url||!config.publishableKey){ui.syncStatus.textContent='Supabase設定が見つかりません';return;}
        ui.syncButton.disabled=true; ui.syncStatus.textContent='同期を準備しています…';
        const folderId='local-'+crypto.randomUUID(); const folderPath=userSession.user.id+'/'+folderId; const uploaded=[];
        try{
          for(let i=0;i<pages.length;i++){
            const file=pages[i]; const path=folderPath+'/'+String(i+1).padStart(5,'0')+'-'+safePart(file.name); const response=await fetch(config.url+'/storage/v1/object/'+STORAGE_BUCKET+'/'+path,{method:'POST',headers:{apikey:config.publishableKey,Authorization:'Bearer '+userSession.access_token,'Content-Type':file.type||'application/octet-stream','x-upsert':'true'},body:file});
            if(!response.ok) throw new Error('画像 '+(i+1)+' のアップロードに失敗しました ('+response.status+')');
            uploaded.push(config.url+'/storage/v1/object/public/'+STORAGE_BUCKET+'/'+path); ui.syncStatus.textContent='アップロード中 '+(i+1)+' / '+pages.length;
          }
          const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key)||'')??fallback}catch(_){return fallback}};
          const folders=read('mangaReaderSavedFolders',[]), items=read('mangaReaderSavedItems',[]);
          const itemId='local-item-'+crypto.randomUUID(); folders.push({id:folderId,name:currentFolder,addedAt:Date.now()}); items.push({id:itemId,title:currentFolder,folderId,pages:uploaded,pageMeta:manifest(),favoriteOnly,addedAt:Date.now(),localSync:true}); cloudItem={id:itemId,folderId};
          await MangaVault.savePayload({folders,items,videos:read('mangaReaderVideos',[]),mangaInfo:read('mangaReaderInfoCache',{}),toc:read('mangaReaderToc',{}),lastPages:read('mangaReaderLastPage',{}),theme:localStorage.getItem('mangaReaderTheme')==='light'?'light':'dark'});
          localStorage.setItem('mangaReaderSavedFolders',JSON.stringify(folders)); localStorage.setItem('mangaReaderSavedItems',JSON.stringify(items)); ui.syncStatus.textContent='同期対象に追加しました'; ui.syncButton.textContent='同期済み';
        }catch(error){ui.syncStatus.textContent=error.message||'同期できませんでした';}
        finally{ui.syncButton.disabled=false;}
      }
      function chooseFolder(){ ui.input.value=''; ui.input.click(); }
      ui.open.addEventListener('click',chooseFolder); ui.emptyOpen.addEventListener('click',chooseFolder); ui.input.addEventListener('change',e=>loadFiles(e.target.files)); ui.mode.addEventListener('change',e=>setMode(e.target.value)); ui.fit.addEventListener('change',e=>setFit(e.target.value)); ui.first.addEventListener('click',()=>goPage(0)); ui.prev.addEventListener('click',()=>goPage(currentPage()-1)); ui.next.addEventListener('click',()=>goPage(currentPage()+1)); ui.last.addEventListener('click',()=>goPage(ui.reader.children.length-1)); ui.sort.addEventListener('click',reverseOrder); ui.favoriteOnly.addEventListener('click',toggleFavoriteOnly); ui.crop.addEventListener('click',openCrop); ui.cropCancel.addEventListener('click',closeCrop); ui.cropApply.addEventListener('click',applyCrop); [ui.cropTop,ui.cropRight,ui.cropBottom,ui.cropLeft].forEach(input=>input.addEventListener('input',updateCropPreview)); ui.zoomOut.addEventListener('click',()=>setImageScale(imageScale-.25)); ui.zoomReset.addEventListener('click',()=>setImageScale(1)); ui.zoomIn.addEventListener('click',()=>setImageScale(imageScale+.25)); ui.syncButton.addEventListener('click',syncToCloud); ui.reader.addEventListener('scroll',()=>{if(!framePending){framePending=true;requestAnimationFrame(()=>{framePending=false;updateCounter();});}}); ui.toggle.addEventListener('click',toggleBars);
      ui.reader.addEventListener('contextmenu',event=>event.preventDefault()); ui.reader.addEventListener('dragstart',event=>event.preventDefault());
      ui.reader.addEventListener('click',event=>{const page=event.target.closest('.page');if(!page||event.target.closest('.favorite-badge'))return;const now=Date.now();const original=Number(page.id.replace('page-',''));if(now-lastTap<320){clearTimeout(tapTimer);lastTap=0;toggleFavorite(original);return;}lastTap=now;clearTimeout(tapTimer);tapTimer=setTimeout(()=>{const rect=page.getBoundingClientRect();const x=event.clientX-rect.left;if(x>rect.width*.3&&x<rect.width*.7)toggleBars();},260);});
      ui.reader.addEventListener('touchstart',event=>{if(event.touches.length===1)touchStart={x:event.touches[0].clientX,y:event.touches[0].clientY};},{passive:true}); ui.reader.addEventListener('touchend',event=>{if(!touchStart||!event.changedTouches.length)return;const touch=event.changedTouches[0],dx=touch.clientX-touchStart.x,dy=touch.clientY-touchStart.y;touchStart=null;if(dx<-80&&Math.abs(dx)>Math.abs(dy)*1.25)hideCurrent();});
      ui.fullscreen.addEventListener('click',()=>{if(!document.fullscreenElement)ui.app.requestFullscreen?.();else document.exitFullscreen?.();});
      ['dragenter','dragover'].forEach(type=>ui.drop.addEventListener(type,e=>{e.preventDefault();ui.drop.classList.add('dragging');})); ['dragleave','drop'].forEach(type=>ui.drop.addEventListener(type,e=>{e.preventDefault();ui.drop.classList.remove('dragging');})); ui.drop.addEventListener('drop',e=>loadFiles(e.dataTransfer.files));
      document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='m'){toggleBars();return;}if(!pages.length)return;if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();goPage(currentPage()+1);}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();goPage(currentPage()-1);}if(e.key==='Home'){e.preventDefault();goPage(0);}if(e.key==='End'){e.preventDefault();goPage(pages.length-1);}});
      window.addEventListener('beforeunload',clearUrls); window.addEventListener('resize',updateCounter);
    })();
  </script>
</body>
</html>
