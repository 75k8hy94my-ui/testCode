<!doctype html>
<html lang="ja" class="auth-pending">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>画像</title>
<link rel="icon" href="icon-152.png" type="image/png">
<link rel="stylesheet" href="home-profile-shell.css?v=20261008-profile-avatar">
<link rel="stylesheet" href="app-global-shell.css?v=20260924-theme-unified">
<link rel="stylesheet" href="mobile-bottom-nav.css?v=20260925-instagram-drag-lock">
<link rel="stylesheet" href="images.css?v=20261008-size-preset">
<style>html.auth-pending body{visibility:hidden}</style>
</head>
<body>
<main class="homeShell" id="homeApp">
<header class="homeHeader" data-profile-only-header="1"><div><span class="eyebrow">LIBRARY</span><h1 id="shellTitle">画像</h1></div><button class="headerProfileButton" type="button" data-profile-menu-trigger aria-label="アカウント" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.7-4 3-6 6.5-6s5.8 2 6.5 6"/></svg></button></header>
<div id="routeContent">
<section class="imageLibrary" aria-label="暗号化画像">
  <div class="imageLibraryHead"><div><h2>暗号化写真</h2><p><a href="drive-gallery.html">Google Driveの公開画像を表示する →</a></p></div></div>
  <form id="imageUploadForm" class="imageUploadForm">
    <label>作品名<input id="imageTitle" name="title" type="text" required maxlength="200" autocomplete="off"></label>
    <label>画像ファイル（複数選択可）<input id="imageFiles" name="files" type="file" accept="image/*" multiple required></label>
    <label>保存画質
      <select id="imageQualityMode" name="quality">
        <option value="balanced" selected>標準（推奨・写真ごとに自動調整）</option>
        <option value="compact">軽量（容量を優先）</option>
        <option value="detailed">高画質（写真のディテールを優先）</option>
      </select>
    </label>
    <div class="imageUploadActions"><button id="imageUploadButton" type="submit">暗号化して追加</button><button id="imageCancelButton" type="button" hidden>キャンセル</button><button id="imageRetrySync" type="button" hidden>クラウド同期を再試行</button></div>
  </form>
  <p id="imageStatus" class="imageStatus" role="status" aria-live="polite"></p>
  <section id="imageUploadProgress" class="imageUploadProgress" aria-label="アップロードの進捗" hidden>
    <div class="imageProgressHeading"><strong id="imageProgressState">準備中</strong><span id="imageProgressElapsed">経過 0秒</span></div>
    <p id="imageProgressFile" class="imageProgressFile"></p>
    <progress id="imagePageProgress" value="0" max="1" aria-label="サーバー登録が完了したページ数"></progress>
    <div class="imageProgressMeta"><span id="imageProgressCount">登録済み 0 / 0ページ</span><span id="imageProgressActivity">処理を開始しています</span></div>
    <p id="imageProgressDetail" class="imageProgressDetail"></p>
    <p id="imageUploadSize" class="imageProgressDetail" role="status" aria-live="polite"></p>
    <ol id="imageProgressSteps" class="imageProgressSteps" aria-label="処理の段階">
      <li data-upload-stage="processing">画像加工</li>
      <li data-upload-stage="encrypt">暗号化</li>
      <li data-upload-stage="upload">データ送信</li>
      <li data-upload-stage="register">ページ登録</li>
      <li data-upload-stage="sync">一覧の同期</li>
    </ol>
    <p id="imageProgressHint" class="imageProgressHint" role="status" aria-live="polite"></p>
  </section>
  <div id="imageGrid" class="imageGrid" aria-label="画像一覧"></div>
  <p id="imageEmpty" class="imageEmpty" hidden>保存した画像はまだありません。</p>
</section>
</div>
</main>
<section id="imageViewer" class="imageViewer" role="dialog" aria-modal="true" aria-label="暗号化画像を表示" hidden>
 <div class="imageViewerHeader"><strong id="imageViewerTitle"></strong><button id="imageViewerClose" type="button">閉じる</button></div>
 <div id="imageViewerStage" class="imageViewerStage"></div>
 <div class="imageViewerControls"><button id="imageViewerPrevious" type="button">前へ</button><span id="imageViewerPage">1 / 1</span><button id="imageViewerNext" type="button">次へ</button><button id="imageViewerZoomOut" type="button" aria-label="縮小">－</button><button id="imageViewerZoomIn" type="button" aria-label="拡大">＋</button></div>
 <p id="imageViewerStatus" class="imageStatus" role="status" aria-live="polite"></p>
</section>
<script src="guest-mode.js?v=20261009-guest"></script>

<script src="encrypted-asset-storage.js"></script>

<script src="image-transfer-ledger.js"></script>
<script src="image-remote-access.js"></script>

<script src="image-pyramid-builder.js?v=20261008-native-zoom"></script>

</body></html>
