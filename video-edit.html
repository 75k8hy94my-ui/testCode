<!doctype html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>動画を編集</title>
<link rel="stylesheet" href="app-global-shell.css?v=20260924-theme-unified"><link rel="stylesheet" href="home-profile-shell.css?v=20261007-video-watch-layout"><link rel="stylesheet" href="mobile-bottom-nav.css?v=20260925-instagram-drag-lock">
<style>
#videoEditPage{width:min(900px,100%);margin:0 auto;padding:24px 18px 110px;color:var(--text,#202124)}
.videoEditHeading{margin:0 0 8px;font-size:24px}.videoEditLead{margin:0 0 20px;color:var(--sub);font-size:13px}
.videoEditForm{display:grid;gap:13px;padding:20px;border:1px solid var(--border,#dfe3e8);border-radius:18px;background:var(--panel,#fff);color:var(--text,#202124)}.videoEditField{padding:11px 12px;border:1px solid var(--border,#dfe3e8);border-radius:13px;background:var(--bg-soft,#fff)}
.videoEditField:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
.videoEditField label{display:block;margin:0 0 7px;color:var(--text);font-size:13px;font-weight:750}
.videoEditField input,.videoEditField select,.videoEditField textarea{color-scheme:inherit;width:100%;min-height:46px;padding:11px 12px;border:1px solid color-mix(in srgb,var(--sub) 48%,var(--border));border-radius:10px;background:var(--panel);color:var(--text);font:inherit;font-size:16px}
.videoEditField textarea{min-height:120px;resize:vertical}.videoEditField :focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 65%,transparent);outline-offset:1px}
.videoEditUrlRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}.videoEditButton{min-height:44px;padding:0 15px;border:1px solid var(--border);border-radius:11px;background:var(--panel-2);color:var(--text);font:inherit;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.videoEditUrlRow .videoEditButton{margin-bottom:0}.videoEditCheck{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--bg-soft);font-weight:700}
html[data-theme="dark"] .videoEditActions .save{color:#0a0c11}
.videoEditActions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:9px;padding-top:14px;border-top:1px solid var(--border)}.videoEditActions .save{border:0;background:var(--accent);color:white}.videoEditActions .danger{margin-right:auto;color:#ff7777}.videoEditSource{justify-self:start;margin-bottom:12px}
.videoEditError{min-height:20px;margin:0;color:#ff7777;font-size:13px}.videoEditNotice{padding:14px;border:1px solid var(--border);border-radius:13px;background:var(--bg-soft);line-height:1.6}
.videoEditJsonImport summary{cursor:pointer;font-weight:750}.videoEditHelp{margin:8px 0;color:var(--sub);font-size:12px;line-height:1.5}
.videoEditCustomProperties{display:grid;gap:10px;padding:14px;border:1px solid var(--border);border-radius:14px;background:var(--bg-soft)}.videoEditCustomProperties h3{margin:0;font-size:16px}.videoEditCustomPropertyName{margin:0 0 7px;color:var(--text);font-size:13px;font-weight:750;overflow-wrap:anywhere}.videoEditCustomProperties .videoEditCustomCheckbox{width:20px;min-height:20px;padding:0;accent-color:var(--accent)}.videoEditChoiceGroup{display:flex;flex-wrap:wrap;gap:7px}.videoEditChoiceGroup button{min-height:42px;padding:8px 13px;border:1px solid var(--border);border-radius:999px;background:var(--panel);color:var(--text);font:inherit;font-weight:700;cursor:pointer}.videoEditChoiceGroup button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}.videoEditCustomProperties .videoEditCheck{margin-top:7px}.videoEditCustomProperties a{color:var(--accent)}
@media(max-width:520px){#videoEditPage{padding:18px 12px 100px}.videoEditHeading{font-size:21px}.videoEditUrlRow{grid-template-columns:1fr}.videoEditUrlRow .videoEditButton{justify-self:start}}

/* Compact, responsive detail editor; the add screen retains its standard layout. */
#videoEditPage{width:min(1160px,100%);padding:12px 16px 32px}
.videoEditHeading{margin-bottom:3px;font-size:20px}.videoEditLead{margin-bottom:9px}
.videoEditForm.isEditMode{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px}
.videoEditForm.isEditMode > *{min-width:0}
.videoEditForm.isEditMode .videoEditField{padding:8px 9px}
.videoEditForm.isEditMode .videoEditField label{margin-bottom:4px;font-size:12px}
.videoEditForm.isEditMode .videoEditField input,.videoEditForm.isEditMode .videoEditField select{min-height:36px;padding:6px 9px;font-size:14px}
.videoEditForm.isEditMode .videoEditField textarea{min-height:62px;padding:7px 9px;font-size:14px}
.videoEditForm.isEditMode .videoEditButton{min-height:36px;padding:0 10px;font-size:13px}
.videoEditForm.isEditMode .videoEditMainUrl{grid-column:1/-1}
.videoEditForm.isEditMode .videoEditTitleField,.videoEditForm.isEditMode .videoEditFolderField{grid-column:span 2}
.videoEditForm.isEditMode .videoEditStatusField,.videoEditForm.isEditMode .videoEditRotateField{grid-column:span 1}
.videoEditForm.isEditMode .videoEditTagsField{grid-column:span 2}
.videoEditForm.isEditMode .videoEditRotateField{order:1}
.videoEditForm.isEditMode .videoEditMemoField,.videoEditForm.isEditMode .videoEditToggles{grid-column:span 2;order:2}
.videoEditToggles{display:flex;gap:8px;align-items:stretch}
.videoEditToggles .videoEditCheck{flex:1;min-width:0;min-height:36px;font-size:13px;padding:7px 9px}
.videoEditForm.isEditMode .videoEditCustomProperties{grid-column:1/-1;order:8;max-height:min(190px,25vh);overflow:auto;padding:9px 12px;display:block}
.videoEditForm.isEditMode .videoEditCustomProperties[open]{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;align-items:start}
.videoEditForm.isEditMode .videoEditCustomProperties summary{grid-column:1/-1}
.videoEditForm.isEditMode .videoEditCustomProperties .videoEditField{min-width:0}
.videoEditForm.isEditMode .videoEditAlternates,.videoEditForm.isEditMode .videoEditPlaybackMeta{grid-column:span 2;order:9}
.videoEditForm.isEditMode .videoEditPlaybackFields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px}
.videoEditForm.isEditMode .videoEditPlaybackFields .videoEditField{min-width:0}
.videoEditForm.isEditMode .videoEditError{grid-column:1/-1;order:19}
.videoEditForm.isEditMode .videoEditError:empty{display:none}
.videoEditForm.isEditMode .videoEditActions{grid-column:1/-1;order:20;padding-top:7px;align-items:center}
.videoEditSaveStatus{font-size:12px;color:var(--sub);margin-right:auto}
.videoEditForm.isEditMode .videoEditActions .danger{margin-right:0}
.videoEditForm.isEditMode .videoEditActions [data-cancel]{margin-left:auto}
.videoEditForm.isEditMode .videoEditSource{margin:0}
.videoEditFolderCreate{margin-top:5px}
.videoEditFolderCreate summary,.videoEditAlternates summary,.videoEditPlaybackMeta summary,.videoEditCustomProperties summary{cursor:pointer;font-size:13px;font-weight:700}
.videoEditFolderCreate .videoEditUrlRow,.videoEditAlternates .videoEditFieldBody{margin-top:9px}
.videoEditFolderCreate .videoEditUrlRow{align-items:center}
.videoEditForm.isEditMode .videoEditAlternates textarea{min-height:75px}
.videoEditForm.isEditMode .videoEditAlternates .videoEditUrlRow{margin-top:7px}
@media(max-width:720px){
 #videoEditPage{padding:10px 12px 94px}
 .videoEditLead{margin-bottom:8px}
 .videoEditForm.isEditMode{grid-template-columns:repeat(2,minmax(0,1fr));padding:9px;gap:7px}
 .videoEditForm.isEditMode .videoEditTitleField,.videoEditForm.isEditMode .videoEditFolderField,
 .videoEditForm.isEditMode .videoEditTagsField,.videoEditForm.isEditMode .videoEditMemoField,
 .videoEditForm.isEditMode .videoEditToggles,.videoEditForm.isEditMode .videoEditAlternates,
 .videoEditForm.isEditMode .videoEditPlaybackMeta,.videoEditForm.isEditMode .videoEditCustomProperties{grid-column:1/-1}
 .videoEditForm.isEditMode .videoEditStatusField,.videoEditForm.isEditMode .videoEditRotateField{grid-column:span 1;order:1}
 .videoEditForm.isEditMode .videoEditMemoField,.videoEditForm.isEditMode .videoEditToggles{order:2}
 .videoEditForm.isEditMode .videoEditCustomProperties[open]{grid-template-columns:repeat(2,minmax(0,1fr))}
 .videoEditForm.isEditMode .videoEditMainUrl{grid-template-columns:minmax(0,1fr) auto}
 .videoEditForm.isEditMode .videoEditMainUrl .videoEditButton{padding:0 8px;font-size:12px}
 .videoEditForm.isEditMode .videoEditActions{gap:6px}
 .videoEditSaveStatus{flex-basis:100%;order:-1}
}
@media(max-width:390px){
 .videoEditForm.isEditMode .videoEditCustomProperties[open]{grid-template-columns:1fr}
 .videoEditForm.isEditMode .videoEditPlaybackFields{grid-template-columns:1fr}
 .videoEditToggles .videoEditCheck{font-size:12px;gap:5px}
}
.videoEditLinkLookup{grid-column:1/-1;display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap}
.videoEditLinkLookup[hidden]{display:none!important}
.videoEditLinkLookup .videoEditHelp{margin:0;flex:1;min-width:220px;overflow-wrap:anywhere}
.videoEditForm.isEditMode .videoEditLinkLookup{grid-column:1/-1}
</style></head><body>
<div class="homeShell" id="homeApp"><header class="homeHeader" data-profile-only-header="1"><div><span class="eyebrow">VIDEO</span><h1 id="shellTitle">動画を編集</h1></div><button class="headerProfileButton" type="button" data-profile-menu-trigger aria-label="アカウント" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.7-4 3-6 6.5-6s5.8 2 6.5 6"/></svg></button></header>
<main id="videoEditPage" aria-live="polite"><p class="videoEditNotice">読み込み中…</p></main></div>
