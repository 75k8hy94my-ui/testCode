<head>
<meta charset="utf-8">

<style>
.definitionCardsMain{box-sizing:border-box;max-width:780px;width:100%;margin:0 auto;padding:92px 20px 110px;color:var(--text,#202124)}
.definitionCardsToolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.definitionCardsToolbar h2{margin:0;font-size:20px}
.definitionCardsBack{color:inherit;text-decoration:none;font-size:13px;border:1px solid var(--border,rgba(128,128,128,.4));padding:8px 12px;border-radius:8px}
.definitionCardsManageToggle{appearance:none;min-height:39px;padding:8px 13px;border:1px solid var(--border,rgba(128,128,128,.35));background:var(--surface,rgba(128,128,128,.08));border-radius:9px;color:inherit;font:inherit;cursor:pointer}
.definitionCardsToolbarLinks{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.definitionCardsManager{border:1px solid var(--border,rgba(128,128,128,.35));border-radius:14px;padding:18px;margin-bottom:24px;background:var(--surface,rgba(128,128,128,.04))}
.definitionCardsManager[hidden]{display:none!important}
.definitionCardsManager h3{font-size:17px;margin:0 0 12px}
.definitionCardsForm{display:grid;gap:12px}
.definitionCardsForm label{display:grid;gap:5px;font-size:14px}
.definitionCardsForm input,.definitionCardsForm textarea{box-sizing:border-box;width:100%;border:1px solid var(--border,rgba(128,128,128,.45));border-radius:8px;padding:10px;background:var(--surface,#fff);color:inherit;font:inherit;resize:vertical}
.definitionCardsFormActions{display:flex;flex-wrap:wrap;gap:10px}
.definitionCardsFormActions button,.definitionCardsManualList button{appearance:none;min-height:38px;border:1px solid var(--border,rgba(128,128,128,.35));border-radius:8px;padding:7px 14px;background:transparent;color:inherit;font:inherit;cursor:pointer}
.definitionCardsFormActions button[type=submit]{background:var(--surface,rgba(128,128,128,.12));font-weight:600}
.definitionCardsManualList{list-style:none;padding:0;margin:12px 0 0}
.definitionCardsManualList li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--border,rgba(128,128,128,.25))}
.definitionCardsManualTitle{font-weight:600;overflow-wrap:anywhere;min-width:0}
.definitionCardsManualTitle small{display:block;font-weight:400;color:var(--sub,#6b7280)}
.definitionCardsManualActions{display:flex;gap:6px;flex-shrink:0}
.definitionCardsManagerStatus{min-height:1.2em;font-size:13px;color:var(--sub,#6b7280);margin:4px 0}
.definitionCardsCount{margin:0 0 12px;color:var(--sub,#6b7280);font-size:13px}
.definitionCardsFront,.definitionCardsAnswer{box-sizing:border-box;min-height:138px;padding:26px;border:1px solid var(--border,rgba(128,128,128,.35));border-radius:14px;background:var(--surface,rgba(128,128,128,.06));overflow-wrap:anywhere}
.definitionCardsFront strong{display:block;font-size:24px;line-height:1.5}
.definitionCardsSource{display:block;margin-top:15px;color:var(--sub,#6b7280);font-size:13px}
.definitionCardsAnswer{margin-top:14px;min-height:110px;white-space:pre-wrap;font-size:17px;line-height:1.65}
.definitionCardsAnswer[hidden],.definitionCardsStudy[hidden]{display:none!important}
.definitionCardsActions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.definitionCardsActions button{appearance:none;min-height:42px;padding:10px 18px;border:1px solid var(--border,rgba(128,128,128,.35));border-radius:9px;background:var(--surface,rgba(128,128,128,.08));color:inherit;font:inherit;cursor:pointer}
.definitionCardsActions button:disabled{opacity:.4;cursor:default}
.definitionCardsActions #definitionCardsFlip{flex:1}
.definitionCardsRating{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.definitionCardsRating[hidden]{display:none!important}.definitionCardsRating button{flex:1;min-width:110px;min-height:44px;border:1px solid var(--border,rgba(128,128,128,.35));border-radius:9px;background:var(--surface,rgba(128,128,128,.08));color:inherit;font:inherit;cursor:pointer}.definitionCardsReviewSettings{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;font-size:13px;color:var(--sub,#6b7280)}.definitionCardsEmpty{padding:35px 18px;text-align:center;color:var(--sub,#6b7280);line-height:1.8}
@media(max-width:899px){.definitionCardsMain{padding:28px 16px calc(110px + env(safe-area-inset-bottom))}.definitionCardsFront{min-height:160px}.definitionCardsToolbar h2{font-size:18px}}
</style>
</head>
<body>
<main class="homeShell" id="homeApp">
<header class="homeHeader" data-profile-only-header="1"><div><span class="eyebrow">LAW</span><h1 id="shellTitle">定義カード</h1></div><button class="headerProfileButton" type="button" data-profile-menu-trigger aria-label="アカウント" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.7-4 3-6 6.5-6s5.8 2 6.5 6"/></svg></button></header>
<section class="definitionCardsMain" id="definitionCardsRoot">
  <div class="definitionCardsToolbar"><h2>暗記カード</h2><div class="definitionCardsToolbarLinks"><button type="button" class="definitionCardsManageToggle" id="definitionCardsManageToggle" aria-expanded="false" aria-controls="definitionCardsManager">カードを追加・管理</button><a href="statutes.html" class="definitionCardsBack">逐条集へ</a></div></div>
  <section class="definitionCardsManager" id="definitionCardsManager" aria-label="手動カードの追加と管理" hidden>
    <h3 id="definitionCardsFormHeading">新しいカードを作成</h3>
    <form class="definitionCardsForm" id="definitionCardsManualForm">
      <label>問題（表面）<textarea id="definitionCardsManualFront" required maxlength="3000" rows="3" placeholder="例：民法９４条２項の類推適用の要件"></textarea></label>
      <label>解答（裏面）<textarea id="definitionCardsManualBack" required maxlength="12000" rows="4" placeholder="覚えたい内容を入力"></textarea></label>
      <label>科目・分類（任意）<input type="text" id="definitionCardsManualCategory" maxlength="120" placeholder="例：民法／総則"></label>
      <div class="definitionCardsFormActions"><button type="submit" id="definitionCardsManualSave">カードを保存</button><button type="button" id="definitionCardsManualNew">新規作成に戻す</button></div>
    </form>
    <p id="definitionCardsManualStatus" class="definitionCardsManagerStatus" role="status" aria-live="polite"></p>
    <h3>手動で作成したカード <span id="definitionCardsManualTotal"></span></h3>
    <ul id="definitionCardsManualList" class="definitionCardsManualList"></ul>
  </section>
  <div class="definitionCardsReviewSettings"><span id="definitionCardsSummary" role="status"></span><label><input id="definitionCardsAll" type="checkbox"> 全カードを表示</label><label>目標保持率 <select id="definitionCardsRetention" aria-label="目標保持率"><option value="0.85">85%</option><option value="0.9">90%</option><option value="0.95">95%</option></select></label></div><div class="definitionCardsReviewSettings"><button type="button" id="definitionCardsOptimize">公式FSRSで最適化</button><button type="button" id="definitionCardsExport">履歴CSV出力</button><span id="definitionCardsOptimizeStatus" role="status"></span></div><p class="definitionCardsCount" id="definitionCardsCount" role="status"></p>
  <div class="definitionCardsStudy" id="definitionCardsStudy" hidden>
    <div class="definitionCardsFront"><strong id="definitionCardsTerm"></strong><span class="definitionCardsSource" id="definitionCardsSource"></span></div>
    <div class="definitionCardsAnswer" id="definitionCardsAnswer" hidden></div>
    <div class="definitionCardsRating" id="definitionCardsRating" hidden><button type="button" data-grade="0">忘れた</button><button type="button" data-grade="1">難しい</button><button type="button" data-grade="2">できた</button><button type="button" data-grade="3">簡単</button></div><div class="definitionCardsActions"><button type="button" id="definitionCardsPrev">前へ</button><button type="button" id="definitionCardsFlip">答えを見る</button><button type="button" id="definitionCardsNext">次へ</button></div>
  </div>
  <p class="definitionCardsEmpty" id="definitionCardsEmpty" hidden>カードはまだありません。上の「カードを追加・管理」から作成するか、逐条集で定義を登録してください。</p>
</section>
</main>

<script>
(async () => {
  const show = () => document.documentElement.classList.remove('auth-pending');
  if (window.TestCodeGuest?.isActive() === true) { try { if(window.DefinitionCards?.applyPendingCalibration?.()) localStorage.removeItem(window.DefinitionCards.calibrationFlag); } catch(_) {} show(); return; }
  const vault = window.MangaVault;
  const config = window.MANGA_READER_SUPABASE || {};
  const session = vault?.loadSession?.();
  if (!session?.refresh_token || !config.url || !config.publishableKey) {
    location.replace('index.html'); return;
  }
  if (!vault.loadActive?.() && !window.StatutesVault?.hasDeviceKey?.()) { location.replace('sync.html'); return; }
  try {
    if (navigator.onLine !== false) await vault.ensureSession();
    const calibration=window.DefinitionCards?.applyPendingCalibration?.();
    const result=await window.StatutesVault.sync();
    if (result?.reason === 'locked' && !window.StatutesVault.hasDeviceKey()) {
      location.replace('sync.html'); return;
    }
    if (calibration && result?.state === 'success')
      localStorage.removeItem(window.DefinitionCards.calibrationFlag);
    window.DefinitionCards?.refresh?.();
    show();
  } catch (error) {
    if (navigator.onLine === false && window.StatutesVault?.hasDeviceKey?.()) { show(); return; }
    if (vault.isSessionAuthError?.(error)) vault.saveSession(null);
    location.replace('index.html');
  }
})();
</script>
