name: Apply reader vault race fix

on:
  push:
    branches: [fix/reader-vault-handoff-race]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reader-vault-handoff-race
      - name: Patch vault wait and reader guard
        shell: python
        run: |
          from pathlib import Path

          vault_path = Path('vault-session.js')
          vault = vault_path.read_text(encoding='utf-8')
          anchor = """  setupVaultChannel();
  function getMeta(userId) { return readJSON(META_KEY, {})[userId] || null; }
"""
          replacement = """  setupVaultChannel();
  async function waitForActive(timeoutMs = 2500) {
    const existing = loadActive();
    if (existing) return existing;
    if (!vaultChannel) setupVaultChannel();
    return new Promise((resolve) => {
      let settled = false;
      let timer = null;
      let interval = null;
      const cleanup = () => {
        if (timer !== null) clearTimeout(timer);
        if (interval !== null) clearInterval(interval);
        window.removeEventListener('manga-vault-active', onActive);
      };
      const finish = (value) => {
        if (settled) return;
        settled = true;
        cleanup();
        resolve(value || null);
      };
      const check = () => {
        const active = loadActive();
        if (active) { finish(active); return true; }
        return false;
      };
      const request = () => {
        if (!check()) channelPost({ type: 'vault-request' });
      };
      const onActive = () => { check(); };
      window.addEventListener('manga-vault-active', onActive);
      request();
      interval = setInterval(request, 200);
      timer = setTimeout(() => finish(loadActive()), Math.max(0, Number(timeoutMs) || 2500));
    });
  }
  function getMeta(userId) { return readJSON(META_KEY, {})[userId] || null; }
"""
          if 'async function waitForActive(' not in vault:
              if anchor not in vault:
                  raise SystemExit('vault insertion anchor not found')
              vault = vault.replace(anchor, replacement, 1)
          export_old = "window.MangaVault = { SESSION_KEY, META_KEY, ACTIVE_KEY, loadSession, saveSession, clearActive, loadActive, refreshSession, api, withSession, fetchRecordForUi, initialize, initializeWithPasskey, registerPasskey, savePayload };"
          export_new = "window.MangaVault = { SESSION_KEY, META_KEY, ACTIVE_KEY, loadSession, saveSession, clearActive, loadActive, waitForActive, refreshSession, api, withSession, fetchRecordForUi, initialize, initializeWithPasskey, registerPasskey, savePayload };"
          if export_old in vault:
              vault = vault.replace(export_old, export_new, 1)
          elif export_new not in vault:
              raise SystemExit('vault export anchor not found')
          vault_path.write_text(vault, encoding='utf-8')

          reader_path = Path('reader.html')
          reader = reader_path.read_text(encoding='utf-8')
          old = """(() => {
  const sessionKey = 'mangaReaderSupabaseSession';
  const loginUrl = 'index.html';
  const vaultUrl = 'sync.html';
  const AUTH_REFRESH_TIMEOUT_MS = 5000;
  const showLogin = () => window.location.replace(loginUrl);
  try {
    const session = JSON.parse(localStorage.getItem(sessionKey) || 'null');
    const config = window.MANGA_READER_SUPABASE || {};
    if (!session || !session.refresh_token || !config.url || !config.publishableKey) { showLogin(); return; }
    if (!window.MangaVault || !MangaVault.loadActive()) { window.location.replace(vaultUrl); return; }
"""
          new = """(async () => {
  const sessionKey = 'mangaReaderSupabaseSession';
  const loginUrl = 'index.html';
  const vaultUrl = 'sync.html';
  const AUTH_REFRESH_TIMEOUT_MS = 5000;
  const showLogin = () => window.location.replace(loginUrl);
  try {
    const session = JSON.parse(localStorage.getItem(sessionKey) || 'null');
    const config = window.MANGA_READER_SUPABASE || {};
    if (!session || !session.refresh_token || !config.url || !config.publishableKey) { showLogin(); return; }
    if (!window.MangaVault) { window.location.replace(vaultUrl); return; }
    let activeVault = MangaVault.loadActive();
    if (!activeVault && typeof MangaVault.waitForActive === 'function') activeVault = await MangaVault.waitForActive(2500);
    if (!activeVault) { window.location.replace(vaultUrl); return; }
"""
          if 'await MangaVault.waitForActive(' not in reader:
              if old not in reader:
                  raise SystemExit('reader auth guard anchor not found')
              reader = reader.replace(old, new, 1)
          reader_path.write_text(reader, encoding='utf-8')
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vault-session.js reader.html
          git commit -m "fix: wait for cross-tab vault before reader redirect"
          git push origin HEAD:fix/reader-vault-handoff-race
