name: Embed statute article captions
on:
  push:
    paths:
      - 'scripts/embed-statute-captions.py'
      - '.github/workflows/embed-statute-captions.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch official captions and embed in checked-in JSON
        run: python scripts/embed-statute-captions.py
      - name: Commit updated law data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add statutes-data/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Embed official article captions into static statute corpus"
            git fetch origin main
            git rebase origin/main
            git push
          fi
