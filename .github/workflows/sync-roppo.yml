name: Sync Roppo Law Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch current law data from e-Gov
        run: node scripts/sync-roppo-data.mjs
      - name: Commit updated law data
        shell: bash
        run: |
          if git diff --quiet -- data/roppo; then
            echo "No law data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/roppo
          git commit -m "chore: sync roppo law data"
          git push origin HEAD:main
