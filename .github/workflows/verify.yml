name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run npm test
        shell: bash
        run: |
          npm test 2>&1 | tee node-test-output.txt || true
      - name: Upload node test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-output
          path: node-test-output.txt
      - run: PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run verify:static
