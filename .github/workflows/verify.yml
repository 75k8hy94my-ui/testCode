name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - name: Run Python tests when present
        run: |
          if find tests -type f -name 'test_*.py' -print -quit | grep -q .; then
            PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_*.py'
          else
            echo "No Python tests found; skipping Python test discovery."
          fi
      - run: npm run verify:static
  postgres-vault-sync:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vault_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vault_sync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify isolated Vault v4 migration and authorization contract
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: vault_sync_test
        run: bash scripts/test-vault-sync-v4-postgres.sh
      - name: Verify synthetic PostgreSQL dump and isolated restore
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: vault_sync_test
        run: bash scripts/test-vault-backup-restore-synthetic.sh
