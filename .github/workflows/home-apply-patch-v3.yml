name: Home apply patch v3

on:
  push:
    branches:
      - feature/home-dashboard
    paths:
      - scripts/home-patch-request-v3.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/home-dashboard
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/home-patch-request-v3.mjs
      - run: npm test
      - run: npm run verify:static
      - name: Commit generated implementation changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add synced home layout state"
          git push origin HEAD:feature/home-dashboard
