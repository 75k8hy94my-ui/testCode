name: Home core task 5

on:
  push:
    branches:
      - feature/home-dashboard
    paths:
      - scripts/home-task5.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/home-dashboard
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/home-task5.mjs
      - run: npm test
      - run: npm run verify:static
      - name: Commit task 5
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html reader.html study.html tests/static-regression.test.mjs tests/study-page.test.mjs
          git commit -m "feat: route authenticated sessions through home"
          git push origin HEAD:feature/home-dashboard
