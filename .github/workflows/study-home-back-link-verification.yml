name: Study home back link verification
on:
  push:
    branches: [feat/study-home-back-link]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/study-home-back-link.test.mjs
