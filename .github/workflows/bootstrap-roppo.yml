name: Bootstrap Roppo Data

on:
  push:
    branches:
      - feat/roppo-static-sync
    paths:
      - .github/workflows/bootstrap-roppo.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-roppo-data.mjs
      - name: Commit generated law data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/roppo
          git commit -m "data: seed roppo law data"
          git push
