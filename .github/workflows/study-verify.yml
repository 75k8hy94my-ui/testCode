name: Study branch verification

on:
  push:
    branches:
      - feat/judicial-exam-study

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
      - name: Verify static files
        run: npm run verify:static
      - name: Check diff whitespace
        run: git diff --check HEAD^ HEAD
