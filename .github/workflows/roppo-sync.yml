name: Refresh Roppo Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roppo-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh only when one calendar month has elapsed
        run: python3 scripts/sync_roppo.py
      - name: Commit refreshed statutes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/roppo)" ]; then
            echo 'No statute refresh needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/roppo
          git commit -m 'data: refresh roppo statutes from e-Gov'
          git push origin HEAD:main
