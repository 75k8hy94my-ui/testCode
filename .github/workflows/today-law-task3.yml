name: Today's Law task 3

on:
  push:
    branches:
      - feature/home-dashboard
    paths:
      - scripts/today-law-task3.mjs

permissions:
  contents: write

jobs:
  author-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/home-dashboard
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/today-law-task3.mjs
      - run: node scripts/verify-today-laws.mjs --file data/today-laws.json --subject civil-law --expected 65
      - run: node scripts/verify-today-laws.mjs --file data/today-laws.json --subject commercial-law --expected 50
      - run: node scripts/verify-today-laws.mjs --file data/today-laws.json --subject civil-law --expected 65 --live
      - run: node scripts/verify-today-laws.mjs --file data/today-laws.json --subject commercial-law --expected 50 --live
      - run: npm test
      - run: npm run verify:static
      - name: Commit verified data
        run: |
          if [ -z "$(git status --porcelain -- data/today-laws.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/today-laws.json
          git commit -m "data: add civil and commercial daily laws"
          git push origin HEAD:feature/home-dashboard
