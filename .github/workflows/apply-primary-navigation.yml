name: Apply primary navigation

on:
  push:
    branches:
      - chatgpt/unify-primary-navigation
    paths:
      - scripts/apply-primary-navigation.mjs
      - .github/workflows/apply-primary-navigation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-primary-navigation.mjs
      - name: Commit navigation changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home.html index-search.html hyakusen.html
          git commit -m "feat: unify primary page navigation"
          git push origin HEAD:${{ github.ref_name }}
